<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>施工工艺交底</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#43516a;background:#fff}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#process{min-height:100vh;position:relative;display:grid;grid-template-columns:250px minmax(0,1fr);font-size:14px}#process .groups{padding:24px 15px 24px 20px;border-right:1px solid #e7edf5}#process .group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;color:#1d2b3e;font-size:16px;font-weight:700}#process .group-head button{border:0;border-radius:4px;background:#2387f6;color:#fff;width:38px;height:36px;font-size:23px}#process .group-item{width:100%;border:0;background:#fff;display:flex;align-items:center;gap:8px;text-align:left;padding:11px 12px 11px 24px;color:#33465e;white-space:nowrap}#process .group-item.active{background:#eaf4ff}#process .group-item .label{overflow:hidden;text-overflow:ellipsis;flex:1}#process .group-item .count{color:#6c7b8d}#process .workspace{min-width:0;padding:22px 24px}#process .toolbar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}#process .search{height:40px;width:260px;max-width:100%;border:1px solid #d9e0e9;border-radius:4px;padding:0 12px}#process .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#process .control{height:40px;padding:0 14px;border:1px solid #d7e0ea;border-radius:4px;background:#fff;color:#52667d;white-space:nowrap}#process .primary{background:#2387f6;border-color:#2387f6;color:#fff}#process .link{border:0;background:transparent;color:#1785fa;padding:5px;white-space:nowrap}#process .link:hover{text-decoration:underline}#process .danger{color:#e95d68!important}#process .grid{overflow:auto}#process table{width:100%;border-collapse:collapse;white-space:nowrap;table-layout:auto}#process th{background:#f3f4f6;color:#334457;text-align:left;font-size:14px;font-weight:700;padding:15px 12px}#process td{border-bottom:1px solid #e6ebf1;padding:13px 12px;height:58px}#process tr:hover td{background:#fafcff}#process .check{width:25px}#process .file-icon{color:#158af9;font-size:20px;margin-right:8px}#process .file-name{border:0;background:transparent;color:#3d4a5a;padding:0;text-align:left}#process .file-name:hover{color:#1785fa}#process .tag{display:inline-block;font-size:12px;color:#2880df;background:#eaf4ff;padding:2px 6px;margin-left:7px}#process .empty{padding:80px 10px;text-align:center;color:#8794a4}#process .menu{position:fixed;z-index:20;min-width:195px;padding:6px 0;border:1px solid #e6ebf2;border-radius:4px;background:#fff;box-shadow:0 8px 26px #1b2f4c30}#process .menu button{display:block;width:100%;padding:10px 16px;border:0;background:#fff;text-align:left;color:#40516a}#process .menu button:hover{background:#ecf5ff;color:#1785fa}#process .overlay{position:fixed;inset:0;z-index:30;background:#17263d80;display:flex;justify-content:center;align-items:flex-start;padding:10vh 18px 20px;overflow:auto}#process .dialog{width:min(700px,100%);background:#fff;border-radius:6px;box-shadow:0 16px 40px #1527443d}#process .dialog.wide{width:min(1050px,100%)}#process .dialog-head{height:61px;border-bottom:1px solid #e5e9ef;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:18px;color:#1d2c40}#process .dialog-head button{font-size:24px;background:none;border:0;color:#8a98a8}#process .dialog-body{padding:22px 28px;max-height:68vh;overflow:auto}#process .dialog-foot{border-top:1px solid #e5e9ef;display:flex;justify-content:flex-end;gap:10px;padding:14px 28px}#process .field{display:grid;grid-template-columns:125px 1fr;gap:10px;align-items:center;margin-bottom:16px}#process .field input,#process .field select{height:40px;border:1px solid #d7dfe9;border-radius:4px;padding:0 10px;min-width:0;width:100%}#process .note{color:#8b98a8;font-size:12px;line-height:1.7}#process .error{color:#dc5260;margin:8px 0}#process .record-tabs{display:flex;gap:28px;border-bottom:1px solid #e0e4eb;margin-bottom:18px}#process .record-tabs button{border:0;background:#fff;padding:8px 0;color:#4d5d72}#process .record-tabs button.active{color:#1688f8;border-bottom:2px solid #1688f8}#process .record-table{border:1px solid #c9dcf7;min-height:270px;overflow:auto}#process .record-table th,#process .record-table td{text-align:center;border-right:1px solid #c9dcf7;border-bottom:1px solid #c9dcf7}#process .record-table th{background:#fbfcff}#process .record-table tr>*:last-child{border-right:0}#process .qr{text-align:center;margin:18px 0}#process .qr svg{width:190px;height:190px}#process .preview{width:100%;max-height:390px;background:#1c2634}#process .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:50;background:#263d55;color:#fff;padding:10px 18px;border-radius:4px}#process .placeholder{text-align:center;padding:90px 20px;background:#f4f7fb;color:#7e8b9e}
@media(max-width:900px){#process{grid-template-columns:190px minmax(0,1fr)}#process .workspace{padding:16px}}@media(max-width:600px){#process{display:block}#process .groups{border-right:0;border-bottom:1px solid #e7edf5;padding:14px}#process .group-list{display:flex;overflow:auto}#process .group-item{width:auto;flex:none;padding:9px 12px}#process .toolbar{align-items:stretch}#process .tools{gap:5px}#process .control{padding:0 9px}#process .field{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="process">
  <aside class="groups"><div class="group-head"><span>分组名称</span><button type="button" id="add-group" aria-label="新建分组">＋</button></div><div class="group-list" id="group-list"></div></aside>
  <main class="workspace"><div class="toolbar"><input class="search" id="search" placeholder="按照关键词搜索" aria-label="搜索工艺文件"><div class="tools"><button class="control primary" id="upload">▣ 上传文件</button><button class="control" id="batch-download" disabled>↓ 下载</button><button class="control" id="batch-qr" disabled>▦ 打印/导出二维码</button><button class="control" id="batch-move" disabled>➜ 移动到</button><button class="control" id="batch-delete" disabled>♧ 删除</button></div></div><div class="grid" id="list"></div><input id="file-input" type="file" accept="video/mp4,video/webm,.mp4,.webm" multiple hidden></main>
  <div id="popover"></div><div id="modal"></div><div id="toast" aria-live="polite"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(()=>{'use strict';
const root=document.getElementById('process'),$=s=>root.querySelector(s),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groupNames=['混凝土浇筑展示','梁柱节点拦网展示','地下室后浇带做法展示','压头防水做法展示'];
const files=['混凝土浇筑.mp4','砌体结构施工工艺动画模拟.mp4','三桩承台混凝土浇筑施工工艺.mp4','无梁楼盖柱帽模板施工.mp4','石材幕墙做法.mp4','预制楼梯吊装演示.mp4','基坑开挖支护全过程施工动画.mp4'];
let group=groupNames[0],query='',nextId=11,selected=new Set(),items=files.map((name,i)=>({id:i+1,name,group:groupNames[0],by:i?'系统管理员':'刘耀宇',size:[95.15,7.23,9.64,16.13,7.06,25.6,19.29][i],date:i?'2025-10-20 15:20:0'+i:'2024-10-13 21:28:41',type:'mp4',file:null,shares:[],views:[],bim:[]}));
['梁柱节点拦网','地下室后浇带','压头防水'].forEach((name,i)=>items.push({id:8+i,name:name+'.mp4',group:groupNames[i+1],by:'系统管理员',size:8+i,date:'2025-10-20 15:30:00',type:'mp4',file:null,shares:[],views:[],bim:[]}));
let popId=null,toastTimer;
function now(){return new Date().toLocaleString('sv-SE').slice(0,19)}
function notify(message){clearTimeout(toastTimer);$('#toast').innerHTML='<div class="toast">'+escape(message)+'</div>';toastTimer=setTimeout(()=>$('#toast').innerHTML='',3000)}
function closeMenu(){popId=null;$('#popover').innerHTML=''}
function closeDialog(){$('#modal').innerHTML=''}
function dialog(title,body,footer='',wide=false){closeMenu();$('#modal').innerHTML='<div class="overlay"><section class="dialog '+(wide?'wide':'')+'" role="dialog" aria-modal="true" aria-label="'+escape(title)+'"><div class="dialog-head">'+escape(title)+'<button id="dialog-close" aria-label="关闭">×</button></div><div class="dialog-body">'+body+'</div>'+(footer?'<div class="dialog-foot">'+footer+'</div>':'')+'</section></div>';$('#dialog-close').onclick=closeDialog;const cancel=$('#cancel');if(cancel)cancel.onclick=closeDialog}
const cancel='<button class="control" id="cancel">取消</button>',save='<button class="control primary" id="save">确定</button>';
function current(){return items.filter(x=>x.group===group&&x.name.toLowerCase().includes(query))}
function render(){const shown=current();$('#group-list').innerHTML=groupNames.map(name=>'<button class="group-item '+(group===name?'active':'')+'" data-group="'+escape(name)+'"><span class="label">'+escape(name)+'</span><span class="count">'+items.filter(x=>x.group===name).length+'</span></button>').join('');$('#list').innerHTML=shown.length?'<table><thead><tr><th class="check"><input id="check-all" type="checkbox" aria-label="全选当前列表" '+(shown.every(x=>selected.has(x.id))?'checked':'')+'></th><th>文件名称</th><th>上传人</th><th>类型</th><th>文件大小</th><th>上传时间</th><th>操作</th></tr></thead><tbody>'+shown.map(x=>'<tr><td><input type="checkbox" data-check="'+x.id+'" aria-label="选择'+escape(x.name)+'" '+(selected.has(x.id)?'checked':'')+'></td><td><span class="file-icon">▣</span><button class="file-name" data-action="preview" data-id="'+x.id+'">'+escape(x.name)+'</button>'+(x.bim.length?'<span class="tag">已挂接BIM</span>':'')+'</td><td>'+escape(x.by)+'</td><td>'+escape(x.type)+'</td><td>'+x.size+'MB</td><td>'+escape(x.date)+'</td><td><button class="link" data-action="rename" data-id="'+x.id+'">重命名</button><button class="link" data-action="download" data-id="'+x.id+'">下载</button><button class="link danger" data-action="delete" data-id="'+x.id+'">删除</button><button class="link" data-action="menu" data-id="'+x.id+'">更多⌄</button></td></tr>').join('')+'</tbody></table>':'<div class="empty">该分组暂无文件</div>';const count=selected.size;for(const id of ['batch-download','batch-qr','batch-move','batch-delete'])$('#'+id).disabled=count===0}
function fileDownload(x){if(!x.file){notify('示例文件未附原始视频，上传文件后可下载');return}const url=URL.createObjectURL(x.file),a=document.createElement('a');a.href=url;a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function addGroup(){dialog('新建','<label class="field"><span><span class="danger">*</span> 分组名称</span><input id="new-group" maxlength="50" placeholder="请输入"></label><div class="error" id="error" role="alert"></div>',cancel+save);$('#save').onclick=()=>{const name=$('#new-group').value.trim();if(!name){$('#error').textContent='请输入分组名称';return}if(groupNames.includes(name)){$('#error').textContent='分组名称已存在';return}groupNames.push(name);group=name;selected.clear();closeDialog();render();notify('分组已创建')}}
function rename(x){dialog('重命名','<label class="field"><span>文件名称</span><input id="new-name" maxlength="100" value="'+escape(x.name)+'"></label><div class="error" id="error" role="alert"></div>',cancel+save);$('#save').onclick=()=>{const name=$('#new-name').value.trim();if(!name){$('#error').textContent='请输入文件名称';return}x.name=name;closeDialog();render();notify('名称已更新')}}
function remove(ids){const list=items.filter(x=>ids.includes(x.id));dialog('删除文件','确认删除 '+list.length+' 个文件？相关分享链接和二维码将失效。',cancel+'<button class="control primary" id="save">确认删除</button>');$('#save').onclick=()=>{items=items.filter(x=>!ids.includes(x.id));ids.forEach(id=>selected.delete(id));closeDialog();render();notify('已删除')}}
function move(ids){dialog('移动到分组','<label class="field"><span>目标分组</span><select id="move-target">'+groupNames.filter(name=>name!==group).map(name=>'<option>'+escape(name)+'</option>').join('')+'</select></label>',cancel+save);$('#save').onclick=()=>{const target=$('#move-target').value;if(!target){notify('请先创建其他分组');return}items.filter(x=>ids.includes(x.id)).forEach(x=>x.group=target);selected.clear();closeDialog();render();notify('已移动到 '+target)}}
function menu(x,button){if(popId===x.id){closeMenu();return}popId=x.id;$('#popover').innerHTML='<div class="menu" role="menu">'+[['share','分享'],['qr','二维码'],['records','查看记录'],['bim','BIM模型挂接']].map(([action,label])=>'<button role="menuitem" data-action="'+action+'" data-id="'+x.id+'">'+label+'</button>').join('')+'</div>';const pop=$('#popover .menu'),rect=button.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(rect.left,innerWidth-pop.offsetWidth-8))+'px';pop.style.top=(rect.bottom+pop.offsetHeight+6<innerHeight?rect.bottom+4:Math.max(8,rect.top-pop.offsetHeight-4))+'px'}
function shareUrl(x){return 'https://example.com/process/'+x.id}
function makeQr(el,url){if(typeof qrcode!=='function'){el.textContent='二维码组件未加载';return}const qr=qrcode(0,'M');qr.addData(url);qr.make();el.innerHTML=qr.createSvgTag(4,12)}
function share(x,qrMode=false){const url=shareUrl(x);dialog(qrMode?'二维码':'分享链接','<div>文件：'+escape(x.name)+'</div>'+(qrMode?'<div class="qr" id="qr-code"></div>':'')+'<label class="field"><span>分享链接</span><input id="share-url" readonly value="'+url+'"></label><label class="field"><span>有效期</span><select id="expiry"><option>永久</option><option>7天</option><option>30天</option><option>半年</option></select></label><div class="note">这是演示链接，正式使用时由后台生成可访问地址。</div>',cancel+'<button class="control primary" id="save">'+(qrMode?'下载二维码':'复制链接')+'</button>');if(qrMode)makeQr($('#qr-code'),url);$('#save').onclick=async()=>{if(qrMode){const svg=$('#qr-code svg');if(!svg){notify('二维码组件未加载');return}const blob=new Blob([svg.outerHTML],{type:'image/svg+xml'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=x.name+'-二维码.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else{try{await navigator.clipboard.writeText(url)}catch{$('#share-url').select();notify('请按 Ctrl+C 复制已选中的链接');return}}x.shares.unshift({type:qrMode?'二维码':'链接',date:now(),expiry:$('#expiry').value,by:'系统管理员'});closeDialog();notify(qrMode?'二维码已下载':'分享链接已复制')}}
function records(x,tab='view'){const buttons='<div class="record-tabs"><button data-tab="view" class="'+(tab==='view'?'active':'')+'">查看记录</button><button data-tab="share" class="'+(tab==='share'?'active':'')+'">分享记录</button></div>';const logs=tab==='view'?x.views:x.shares;const head=tab==='view'?'<tr><th>序号</th><th>查看人</th><th>查看时间</th><th>来源</th></tr>':'<tr><th>序号</th><th>分享人</th><th>分享方式</th><th>有效期</th><th>分享时间</th></tr>';const rows=logs.map((r,i)=>tab==='view'?'<tr><td>'+(i+1)+'</td><td>'+escape(r.person)+'</td><td>'+escape(r.date)+'</td><td>'+escape(r.source)+'</td></tr>':'<tr><td>'+(i+1)+'</td><td>'+escape(r.by)+'</td><td>'+escape(r.type)+'</td><td>'+escape(r.expiry)+'</td><td>'+escape(r.date)+'</td></tr>').join('');dialog('查看记录',buttons+'<div class="record-table"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table>'+(logs.length?'':'<div class="empty">暂无数据</div>')+'</div>','',true);root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>records(x,b.dataset.tab))}
function attachBim(x){window.parent.postMessage({channel:'xa-bim-briefing',action:'bind',briefingType:'施工工艺交底',resourceName:x.name.replace(/\.[^.]+$/,''),fileName:x.name,sourceId:String(x.id)},'*')}
function preview(x){x.views.unshift({person:'系统管理员',date:now(),source:'WEB'});dialog(x.name,x.file?'<video class="preview" src="'+URL.createObjectURL(x.file)+'" controls></video>':'<div class="placeholder">演示条目未附视频文件。上传本地视频后可在此播放。</div>','',true)}
function bulkQr(ids){
  const chosen=items.filter(x=>ids.includes(x.id));
  dialog('打印/导出二维码','<div class="note">每个二维码对应一条施工工艺，正式访问地址需接入后台。</div><div id="bulk-qr-list" style="display:flex;flex-wrap:wrap;gap:20px"></div>',cancel+'<button class="control" id="export-qr">导出二维码</button><button class="control primary" id="save">打印</button>',true);
  $('#bulk-qr-list').innerHTML=chosen.map(x=>'<div style="width:220px;text-align:center"><div class="qr" data-qr="'+x.id+'"></div><div>'+escape(x.name)+'</div></div>').join('');
  chosen.forEach(x=>makeQr(root.querySelector('[data-qr="'+x.id+'"]'),shareUrl(x)));
  $('#export-qr').onclick=()=>{let count=0;chosen.forEach(x=>{const svg=root.querySelector('[data-qr="'+x.id+'"] svg');if(!svg)return;const blob=new Blob([svg.outerHTML],{type:'image/svg+xml'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=x.name+'-二维码.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);count++});notify(count?'已导出 '+count+' 个二维码':'二维码组件未加载')};
  $('#save').onclick=()=>window.print();
}
root.addEventListener('click',e=>{const groupButton=e.target.closest('[data-group]');if(groupButton){group=groupButton.dataset.group;selected.clear();closeMenu();render();return}const action=e.target.closest('[data-action]');if(action){const x=items.find(v=>v.id===+action.dataset.id);if(!x)return;const name=action.dataset.action;if(name==='menu')menu(x,action);else{closeMenu();({preview:()=>preview(x),rename:()=>rename(x),download:()=>fileDownload(x),delete:()=>remove([x.id]),share:()=>share(x),qr:()=>share(x,true),records:()=>records(x),bim:()=>attachBim(x)})[name]?.()}return}if(!e.target.closest('.menu'))closeMenu()});
$('#group-list').addEventListener('change',()=>{});$('#add-group').onclick=addGroup;$('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();selected.clear();render()};$('#upload').onclick=()=>$('#file-input').click();$('#file-input').onchange=e=>{for(const file of e.target.files){if(!/\.(mp4|webm)$/i.test(file.name)){notify('仅支持 MP4、WebM 视频');continue}items.unshift({id:nextId++,name:file.name,group,by:'系统管理员',size:(file.size/1048576).toFixed(2),date:now(),type:file.name.split('.').at(-1).toLowerCase(),file,shares:[],views:[],bim:[]})}e.target.value='';render()};
$('#list').addEventListener('change',e=>{if(e.target.id==='check-all'){current().forEach(x=>e.target.checked?selected.add(x.id):selected.delete(x.id))}else if(e.target.dataset.check){const id=+e.target.dataset.check;e.target.checked?selected.add(id):selected.delete(id)}render()});
$('#batch-download').onclick=()=>items.filter(x=>selected.has(x.id)).forEach(fileDownload);$('#batch-qr').onclick=()=>bulkQr([...selected]);$('#batch-move').onclick=()=>move([...selected]);$('#batch-delete').onclick=()=>remove([...selected]);window.addEventListener('scroll',closeMenu,true);root.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeDialog()}});render();
})();
</script>
</body>
</html>
