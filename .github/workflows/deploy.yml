name: Deploy to GitHub Pages

# 手动触发 + 推送 main 时自动部署
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 基本检查
        run: |
          echo "站点文件："
          find . -maxdepth 2 -type f -not -path './.git/*' | sort
          test -f index.html || { echo "缺少 index.html"; exit 1; }
          echo "index.html 大小: $(stat -c%s index.html) 字节"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # 仓库根目录就是站点根目录；排除 .git 与样例文档，只发布真正的站点文件
          path: .
          exclude: |
            .git/**
            samples/**

      - id: deployment
        uses: actions/deploy-pages@v4
