<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>批注台账</title>
<style>
/* 样式与 实测实量_测量记录台账_嵌入页.html 保持一致 */
:root{--blue:#3a82ee;--text:#34445a;--muted:#8290a4;--line:#e4eaf2;--head:#f3f4f6}
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px/1.5 "Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);background:#fff}button,input,select{font:inherit}button{cursor:pointer}
.page{height:100%;padding:22px;overflow:auto}
.filters{display:flex;align-items:center;gap:14px;padding-bottom:20px;border-bottom:1px solid #edf1f5;flex-wrap:wrap}
.filters input,.filters select{height:40px;border:1px solid #dbe3ed;border-radius:4px;padding:0 12px;color:#41546c;background:#fff}
.filters input{width:240px}
.btn{height:40px;padding:0 18px;border:1px solid #d8e1ec;border-radius:4px;background:#fff;color:#43556d}
.btn:hover{border-color:#b9cde8;color:var(--blue)}
.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}
.btn.primary:hover{background:#2f74dc;border-color:#2f74dc;color:#fff}
.summary{display:flex;justify-content:space-between;align-items:center;margin:19px 0 12px}
.summary b{color:var(--blue)}
.summary .sub{color:var(--muted);margin-left:4px}
.table-wrap{min-width:1080px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{height:56px;padding:0 12px;background:var(--head);color:#33465e;text-align:left;font-weight:700}
td{height:64px;padding:0 12px;border-bottom:1px solid var(--line);color:#566980;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:hover td{background:#fbfdff}
tbody tr{cursor:pointer}
.wrap-cell{white-space:normal;line-height:1.55;padding-top:12px;padding-bottom:12px;height:auto}
.cell-title{font-weight:600;color:#33465e}
.cell-sub{color:var(--muted);margin-top:4px;font-size:13px}
.comp small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;background:#f0f4f9;color:#5a6d86;border:1px solid #e6edf6;font-size:12px;margin:5px 5px 0 0}
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:12.5px;font-weight:700;white-space:nowrap}
.badge.wait{background:#fff1f2;color:#d94252;border:1px solid #ffd9dd}
.badge.cont{background:#fff6ea;color:#c2690a;border:1px solid #ffe2bd}
.badge.check{background:#eef6ff;color:#2176cf;border:1px solid #cfe6ff}
.badge.done{background:#eefaf3;color:#148659;border:1px solid #cdeedb}
.badge.over{background:#e45555;color:#fff;border:1px solid #e45555}
.over-days{color:#e45555;font-size:12.5px;font-weight:700;margin-left:6px}
.action{border:0;background:transparent;color:#237bea;padding:4px 6px}
.action:hover{text-decoration:underline}
.pagination{display:flex;justify-content:flex-end;gap:14px;align-items:center;padding:22px 0;color:#74849a}
.page-no{color:#237bea;font-weight:700;border:0;background:transparent;padding:2px 6px}
.page-no.on{color:#fff;background:var(--blue);border-radius:3px}
.empty{padding:50px;text-align:center;color:#91a0b2}
.pick-note{padding:10px 12px;margin-bottom:14px;border:1px solid #d9eafd;border-radius:4px;background:#f2f8ff;color:#52718f}

.mask{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:#17283f63}
.mask.show{display:flex}
.dialog{width:min(760px,96vw);max-height:88vh;display:flex;flex-direction:column;background:#fff;border-radius:6px;box-shadow:0 18px 45px #17283f42}
.dialog-head{height:58px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);font-size:17px;font-weight:700}
.close{margin-left:auto;border:0;background:transparent;color:#7f8da1;font-size:24px}
.dialog-body{padding:19px 20px;overflow:auto}
.dialog-foot{height:62px;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:0 20px;border-top:1px solid var(--line);background:#fafcff}
.sec-title{font-weight:700;color:#33465e;margin:18px 0 4px;font-size:13.5px}
.sec-title:first-child{margin-top:0}
.kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:13.5px;line-height:1.6}
.kv:last-child{border-bottom:0}
.kv .k{width:88px;flex:none;color:var(--muted)}
.kv .v{flex:1;min-width:0;word-break:break-word}
.steps{position:relative;padding-left:18px}
.steps::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.step{position:relative;padding-bottom:14px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.step.on::before{border-color:var(--blue)}
.step.over::before{border-color:#e45555}
.step .st{font-weight:700;color:#33465e}
.step .sm{color:var(--muted);font-size:13px;margin-top:2px}
@media(max-width:900px){.page{padding:15px}.dialog{width:97vw}.dialog-body{padding:14px}}
</style>
</head>
<body>
<main class="page">
  <div class="filters">
    <select id="fStatus">
      <option value="all">全部状态</option>
      <option value="open">未闭环</option>
      <option value="待整改">待整改</option>
      <option value="继续整改">继续整改</option>
      <option value="待复查">待复查</option>
      <option value="已复查">已复查</option>
      <option value="待整改逾期">待整改逾期</option>
    </select>
    <select id="fChecker"><option value="">全部批注人</option></select>
    <select id="fComp"><option value="">全部构件</option></select>
    <input id="fSearch" placeholder="搜索批注内容 / 构件 / 责任人"/>
    <button class="btn" id="resetBtn">重置</button>
    <button class="btn primary" id="searchBtn">搜索</button>
  </div>

  <div class="summary">
    <span>共 <b id="count">0</b> 条批注<span class="sub" id="subInfo"></span></span>
    <span class="sub" id="pageInfo"></span>
  </div>

  <div id="tableMount"></div>
  <div class="pagination" id="pagination"></div>
</main>

<div class="mask" id="mask">
  <section class="dialog">
    <header class="dialog-head"><span id="dialogTitle">批注详情</span><button class="close" id="closeBtn" aria-label="关闭">×</button></header>
    <div class="dialog-body" id="dialogBody"></div>
    <footer class="dialog-foot"><button class="btn" id="dialogFootBtn">关闭</button></footer>
  </section>
</div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const PAGE_SIZE=10;

/* ===== 数据 =====
   与 BIM统一模型_交互原型（批注页签）、分屏对比、移动端共用同一份批注数据。
   存储 key 统一为 xa-annotations-v1；本页作为嵌入页（sandbox 无 same-origin）时读不到 localStorage，
   自动回落到种子数据，因此任何环境下都能独立演示。 */
const SEED=[
  {id:101,type:'annotation',title:'桥架与风管净距不足',componentId:'C-A1',compName:'1号楼 · 14层 · 柱 KZ-01',checkTime:'2026-10-12 09:26',checker:'张恒毓',category:'机电安装 / 管线综合',level:'一般',
   description:'电气桥架与排风管交叉处净距不足 50mm，不满足规范要求。',requirement:'调整桥架标高或路由，避让排风管后复检。',
   deadline:'2026-10-15',unit:'机电安装班组',assignee:'李强',reviewer:'王会彬',baseStatus:'待整改',issueRequired:true,round:1,source:'全景对比'},
  {id:102,type:'annotation',title:'模板拼缝处漏浆痕迹',componentId:'C-A3',compName:'1号楼 · 14层 · 柱 KZ-02',checkTime:'2026-10-08 15:40',checker:'刘振',category:'主体结构工程 / 模板工程',level:'一般',
   description:'柱模板拼缝处存在漏浆痕迹，拆模后表面观感缺陷。',requirement:'封堵拼缝，后续浇筑前复查。',
   deadline:'2026-10-11',unit:'主体施工班组',assignee:'徐志成',reviewer:'王会彬',baseStatus:'待复查',issueRequired:true,round:1,source:'全景对比'},
  {id:103,type:'annotation',title:'临边防护栏杆缺失',componentId:'C-A2',compName:'1号楼 · 14层 · 楼板 B-01',checkTime:'2026-09-18 10:05',checker:'王会彬',category:'高处作业 / 临边防护',level:'严重',
   description:'楼板临边防护栏杆未安装到位，存在坠落风险。',requirement:'立即补齐防护栏并设置警示标识。',
   deadline:'2026-09-20',unit:'主体施工班组',assignee:'徐志成',reviewer:'王会彬',baseStatus:'待整改',issueRequired:true,round:1,source:'全景对比'},
  {id:104,type:'annotation',title:'地面成品保护不到位',componentId:'C-A5',compName:'1号楼 · 14层 · 梁 KL-05',checkTime:'2026-09-22 11:20',checker:'张恒毓',category:'文明施工 / 成品保护',level:'一般',
   description:'已完工地坪未做覆盖保护，材料堆放造成划痕。',requirement:'覆盖保护并清理堆放材料。',
   deadline:'',unit:'',assignee:'',reviewer:'',baseStatus:'待整改',issueRequired:false,round:1,source:'移动端'},
  {id:105,type:'annotation',title:'桥架吊架间距偏大',componentId:'C-B1',compName:'2号楼 · 13层 · 梁 L-12',checkTime:'2026-09-16 14:30',checker:'李强',category:'机电安装 / 支吊架',level:'一般',
   description:'桥架吊架间距超过规范要求，需加密。',requirement:'按规范加密吊架。',
   deadline:'2026-10-20',unit:'机电安装班组',assignee:'李强',reviewer:'王会彬',baseStatus:'继续整改',issueRequired:true,round:2,source:'全景对比'},
  {id:106,type:'annotation',title:'风管保温层局部破损',componentId:'C-A6',compName:'1号楼 · 13层 · 梁 KL-03',checkTime:'2026-09-10 16:05',checker:'刘振',category:'机电安装 / 暖通',level:'一般',
   description:'风管保温层局部破损，影响保温效果。',requirement:'修补保温层并复查。',
   deadline:'2026-09-13',unit:'机电安装班组',assignee:'李强',reviewer:'王会彬',baseStatus:'已复查',issueRequired:true,round:1,source:'全景对比'}
];

function loadStore(){
  let raw=null;
  try{ raw=localStorage.getItem('xa-annotations-v1') }catch(e){ raw=null }
  if(!raw) return null;
  try{
    const d=JSON.parse(raw);
    const list=Array.isArray(d)?d:(d.annotations||[]);
    return list.length?list:null;
  }catch(e){ return null }
}
let DATA=(loadStore()||SEED).map(r=>({...r}));

/* ===== 状态派生（与其它端一致） ===== */
function displayStatus(r){
  const b=r.baseStatus||r.status||'待整改';
  const open=(b==='待整改'||b==='继续整改');
  return (open&&r.deadline&&r.deadline<today())?'待整改逾期':b;
}
function overdueDays(r){
  if(displayStatus(r)!=='待整改逾期'||!r.deadline) return 0;
  return Math.max(0,Math.round((new Date(today())-new Date(r.deadline))/86400000));
}
function badgeCls(s){
  return s==='待整改逾期'?'over':s==='待整改'?'wait':s==='继续整改'?'cont':s==='待复查'?'check':s==='已复查'?'done':'wait';
}
const isClosed=s=>s==='已复查';

/* ===== 查询 ===== */
let view={status:'all',checker:'',comp:'',kw:'',page:1};
function allRows(){ return DATA.map(r=>({r,s:displayStatus(r)})); }
function filtered(){
  return allRows().filter(({r,s})=>{
    if(view.status==='open'){ if(isClosed(s)) return false }
    else if(view.status!=='all'&&s!==view.status) return false;
    if(view.checker&&r.checker!==view.checker) return false;
    if(view.comp&&r.compName!==view.comp) return false;
    if(view.kw){
      const hay=[r.title,r.description,r.compName,r.assignee,r.checker].join(' ').toLowerCase();
      if(hay.indexOf(view.kw)<0) return false;
    }
    return true;
  }).sort((a,b)=>{
    const rank=x=>x==='待整改逾期'?0:x==='待整改'?1:x==='继续整改'?2:x==='待复查'?3:4;
    return rank(a.s)-rank(b.s)||String(b.r.checkTime).localeCompare(a.r.checkTime);
  });
}

/* ===== 渲染 ===== */
function renderFilters(){
  const cs=[...new Set(DATA.map(r=>r.checker))].sort();
  const ps=[...new Set(DATA.map(r=>r.compName).filter(Boolean))].sort();
  $('#fChecker').innerHTML='<option value="">全部批注人</option>'+cs.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  $('#fComp').innerHTML='<option value="">全部构件</option>'+ps.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  $('#fStatus').value=view.status;
  $('#fChecker').value=view.checker;
  $('#fComp').value=view.comp;
  $('#fSearch').value=view.kw;
}
function renderTable(){
  const list=filtered(), total=list.length, pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(view.page>pages) view.page=pages;
  if(view.page<1) view.page=1;
  const start=(view.page-1)*PAGE_SIZE, paged=list.slice(start,start+PAGE_SIZE);

  const all=allRows(), openCnt=all.filter(x=>!isClosed(x.s)).length, overCnt=all.filter(x=>x.s==='待整改逾期').length;
  $('#count').textContent=total;
  $('#subInfo').textContent=' · 未闭环 '+openCnt+' 条 · 逾期 '+overCnt+' 条';
  $('#pageInfo').textContent='第 '+view.page+' / '+pages+' 页';

  const mount=$('#tableMount');
  if(!list.length){
    mount.innerHTML='<div class="empty">没有符合条件的批注</div>';
  }else{
    mount.innerHTML='<div class="table-wrap"><table><colgroup>'
      +'<col style="width:60px"><col><col style="width:190px"><col style="width:170px">'
      +'<col style="width:130px"><col style="width:160px"><col style="width:90px">'
      +'</colgroup><thead><tr>'
      +'<th>序号</th><th>批注内容</th><th>关联构件</th><th>批注人 / 时间</th>'
      +'<th>整改状态</th><th>整改人 / 期限</th><th>操作</th>'
      +'</tr></thead><tbody>'
      +paged.map(({r,s},i)=>{
        const od=overdueDays(r);
        const duty=r.issueRequired===false
          ? '<span style="color:'+'var(--muted)'+'">未下发整改单</span>'
          : esc(r.assignee||'--')+'<div class="cell-sub">期限 '+(r.deadline?esc(r.deadline):'--')+(od?' · 超期 '+od+' 天':'')+'</div>';
        return '<tr data-id="'+r.id+'">'
          +'<td>'+(start+i+1)+'</td>'
          +'<td class="wrap-cell"><div class="cell-title">'+esc(r.title)+'</div>'
            +'<div class="cell-sub">'+esc(r.description)+'</div>'
            +'<div><span class="tag">第 '+(r.round||1)+' 轮</span>'+(r.source?'<span class="tag">'+esc(r.source)+'</span>':'')+'</div></td>'
          +'<td class="comp">'+esc(r.compName||r.componentId)+'<small>'+esc(r.componentId)+'</small></td>'
          +'<td>'+esc(r.checker)+'<div class="cell-sub">'+esc(r.checkTime)+'</div></td>'
          +'<td><span class="badge '+badgeCls(s)+'">'+esc(s)+'</span>'+(od?'<div class="over-days">超 '+od+' 天</div>':'')+'</td>'
          +'<td>'+duty+'</td>'
          +'<td><button class="action" data-detail="'+r.id+'">详情</button></td>'
          +'</tr>';
      }).join('')
      +'</tbody></table></div>';
  }

  const pg=$('#pagination');
  if(pages<=1){ pg.innerHTML=''; }
  else{
    let h='<span>共 '+total+' 条</span>';
    for(let i=1;i<=pages;i++) h+='<button class="page-no'+(i===view.page?' on':'')+'" data-page="'+i+'">'+i+'</button>';
    pg.innerHTML=h;
  }
}
function renderAll(){ renderFilters(); renderTable(); }

/* ===== 详情 ===== */
function stepHtml(r){
  const s=displayStatus(r), od=overdueDays(r), steps=[];
  steps.push({t:'批注发起',m:r.checker+' · '+r.checkTime+' · 来源：'+(r.source||'—'),on:true});
  if(r.issueRequired===false){
    steps.push({t:'未下发整改单',m:'仅现场留痕，未指派整改人与期限',on:false});
  }else{
    steps.push({t:'下发整改单',m:'整改人：'+r.assignee+' · 期限：'+r.deadline+' · 复查人：'+r.reviewer,on:true});
    if(s==='待整改') steps.push({t:'等待整改',m:r.assignee+' 尚未提交整改结果',on:false});
    if(s==='继续整改') steps.push({t:'复查未通过 · 继续整改',m:'第 '+(r.round||1)+' 轮，需重新整改后再次提交',on:true});
    if(s==='待复查') steps.push({t:'整改已提交 · 待复查',m:'等待 '+r.reviewer+' 复查',on:true});
    if(s==='已复查') steps.push({t:'复查通过 · 已闭环',m:'复查人：'+r.reviewer,on:true});
    if(s==='待整改逾期') steps.push({t:'已超期 '+od+' 天',m:'超过整改期限 '+r.deadline+'，需督办',on:false,over:true});
  }
  return '<div class="steps">'+steps.map(x=>'<div class="step '+(x.over?'over':x.on?'on':'')+'"><div class="st">'+esc(x.t)+'</div><div class="sm">'+esc(x.m)+'</div></div>').join('')+'</div>';
}
function openDetail(id){
  const r=DATA.find(x=>x.id===id); if(!r) return;
  const s=displayStatus(r), od=overdueDays(r);
  $('#dialogTitle').textContent='批注详情';
  $('#dialogBody').innerHTML=
     '<div class="sec-title">批注内容</div>'
    +'<div class="kv"><span class="k">问题描述</span><span class="v">'+esc(r.description)+'</span></div>'
    +'<div class="kv"><span class="k">关联构件</span><span class="v">'+esc(r.compName||r.componentId)+'<br><span style="color:#8290a4;font-size:12.5px">'+esc(r.componentId)+'</span></span></div>'
    +'<div class="kv"><span class="k">批注人</span><span class="v">'+esc(r.checker)+'</span></div>'
    +'<div class="kv"><span class="k">批注时间</span><span class="v">'+esc(r.checkTime)+'</span></div>'
    +'<div class="sec-title">整改信息</div>'
    +(r.issueRequired===false
      ? '<div class="kv"><span class="k">整改状态</span><span class="v"><span class="badge '+badgeCls(s)+'">'+esc(s)+'</span></span></div>'
        +'<div class="kv"><span class="k">说明</span><span class="v">未下发整改单，仅作现场留痕。</span></div>'
      : '<div class="kv"><span class="k">整改状态</span><span class="v"><span class="badge '+badgeCls(s)+'">'+esc(s)+'</span>'+(od?'<span class="over-days">超 '+od+' 天</span>':'')+'</span></div>'
        +'<div class="kv"><span class="k">整改人</span><span class="v">'+esc(r.assignee||'--')+(r.unit?'（'+esc(r.unit)+'）':'')+'</span></div>'
        +'<div class="kv"><span class="k">整改期限</span><span class="v">'+esc(r.deadline||'--')+'</span></div>'
        +'<div class="kv"><span class="k">复查人</span><span class="v">'+esc(r.reviewer||'--')+'</span></div>')
    +'<div class="sec-title">流转记录</div>'+stepHtml(r);
  $('#mask').classList.add('show');
}
function closeDetail(){ $('#mask').classList.remove('show'); }

/* ===== 事件 ===== */
$('#searchBtn').onclick=()=>{
  view.status=$('#fStatus').value; view.checker=$('#fChecker').value;
  view.comp=$('#fComp').value; view.kw=$('#fSearch').value.trim().toLowerCase();
  view.page=1; renderTable();
};
$('#resetBtn').onclick=()=>{
  view={status:'all',checker:'',comp:'',kw:'',page:1}; renderFilters(); renderTable();
};
$('#fSearch').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#searchBtn').click() });
$('#tableMount').addEventListener('click',e=>{
  const b=e.target.closest('[data-detail]');
  if(b){ e.stopPropagation(); openDetail(+b.dataset.detail); return }
  const tr=e.target.closest('tr[data-id]');
  if(tr) openDetail(+tr.dataset.id);
});
$('#pagination').addEventListener('click',e=>{
  const b=e.target.closest('[data-page]'); if(!b) return;
  view.page=+b.dataset.page; renderTable();
});
$('#closeBtn').onclick=closeDetail;
$('#dialogFootBtn').onclick=closeDetail;
$('#mask').onclick=e=>{ if(e.target.id==='mask') closeDetail() };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail() });

/* ===== 跨端同步 ===== */
window.addEventListener('message',e=>{
  const d=e.data; if(!d||d.channel!=='xa-annotation') return;
  if(d.action==='refresh'||d.action==='changed'){
    if(Array.isArray(d.data)&&d.data.length){
      d.data.forEach(x=>{
        const i=DATA.findIndex(y=>y.id===x.id);
        if(i<0) DATA.push({...x}); else DATA[i]={...DATA[i],...x};
      });
    }else{
      const s=loadStore(); if(s) DATA=s.map(r=>({...r}));
    }
    renderAll();
  }
});
try{
  const bc=new BroadcastChannel('xa-annotation-sync');
  bc.onmessage=e=>{ if(e.data&&e.data.type==='changed'){ const s=loadStore(); if(s)DATA=s.map(r=>({...r})); renderAll() } };
}catch(e){}
try{ window.addEventListener('storage',e=>{ if(e.key==='xa-annotations-v1'){ const s=loadStore(); if(s){DATA=s.map(r=>({...r})); renderAll()} } }) }catch(e){}

renderAll();
})();
</script>
</body>
</html>
