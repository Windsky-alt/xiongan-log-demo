<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>批注台账</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1688f8;--blue-soft:#edf6ff;--text:#26364d;--muted:#7d8ca2;
  --line:#e7edf5;--bg:#f5f8fc;--danger:#e94655;--ok:#12a150;--warn:#f08a24;
  --shadow:0 8px 24px rgba(46,79,122,.10);
}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cfdae8;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#b6c6da}
::-webkit-scrollbar-track{background:transparent}

.wrap{padding:18px 22px 26px;max-width:1560px;margin:0 auto}
.head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.head h1{font-size:19px;font-weight:600;letter-spacing:.2px}
.head p{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.head .sp{flex:1}
.btn{padding:7px 15px;border-radius:7px;border:1px solid var(--line);background:#fff;color:#435873;
  font-size:12.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#bcd3ee;background:#fbfdff;color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn.pri:hover{background:#0d78e4;border-color:#0d78e4;color:#fff}

/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .n{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.5px}
.stat .t{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat .s{font-size:11.5px;margin-top:4px;color:#9aa8bc}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.stat.a::after{background:var(--danger)}
.stat.b::after{background:var(--warn)}
.stat.c::after{background:var(--blue)}
.stat.d::after{background:var(--ok)}
.stat.e::after{background:#b4232f}
.stat.a .n{color:var(--danger)} .stat.b .n{color:var(--warn)}
.stat.c .n{color:var(--blue)} .stat.d .n{color:var(--ok)}
.stat.e .n{color:#b4232f}

/* 筛选 */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.filters select,.filters input{padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;outline:none;font-size:12.5px}
.filters select:focus,.filters input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.filters input{width:220px}
.filters .sp{flex:1}
.filters .cnt{font-size:12.5px;color:var(--muted)}
.filters .cnt b{color:var(--blue)}

/* 表格 */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#f7fafd;text-align:left;color:#5a6d86;font-weight:600;font-size:12.5px;padding:12px 14px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid #f1f5fa;font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:.13s}
tbody tr:hover{background:#fafcff}
tbody tr.open{background:var(--blue-soft)}
.cell-title{font-weight:600;line-height:1.5}
.cell-sub{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.comp{font-size:12.5px;line-height:1.6}
.comp small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;background:#f0f4f9;color:#5a6d86;
  border:1px solid #e6edf6;margin:0 4px 4px 0;white-space:nowrap}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:6px;font-weight:600;white-space:nowrap}
.badge.wait{background:#fff1f2;color:var(--danger);border:1px solid #ffd9dd}
.badge.cont{background:#fff6ea;color:#c2690a;border:1px solid #ffe2bd}
.badge.check{background:var(--blue-soft);color:#0d6fd4;border:1px solid #cfe6ff}
.badge.done{background:#eefaf3;color:var(--ok);border:1px solid #cdeedb}
.badge.over{background:var(--danger);color:#fff;border:1px solid var(--danger)}
.over-days{font-size:11px;color:var(--danger);font-weight:600;margin-left:5px}
.ops{white-space:nowrap;text-align:right}
.ops .btn{padding:4px 10px;font-size:12px}
.empty{padding:56px 20px;text-align:center;color:#9aa8bc;font-size:13px;line-height:1.9}
.empty b{display:block;color:#5a6d86;font-size:14px;margin-bottom:6px}
.hintbar{display:flex;align-items:center;gap:9px;padding:9px 14px;background:#fbfdff;border-bottom:1px solid var(--line);
  font-size:12px;color:var(--muted)}
.hintbar .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:0 0 auto}

/* 详情抽屉 */
.mask{position:fixed;inset:0;background:rgba(28,45,68,.34);display:none;z-index:50}
.mask.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:92vw;background:#fff;z-index:51;
  box-shadow:-14px 0 40px rgba(28,45,68,.18);transform:translateX(100%);transition:transform .26s ease;
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dhd h3{font-size:15.5px;font-weight:600;line-height:1.5;flex:1}
.dhd .x{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#9aa8bc;font-size:19px;line-height:1;flex:0 0 auto}
.dhd .x:hover{background:#f2f6fb;color:#5a6d86}
.dbd{flex:1;overflow:auto;padding:16px 20px 24px}
.sec{margin-bottom:20px}
.sec h4{font-size:12px;color:#94a3b8;font-weight:700;letter-spacing:.6px;margin-bottom:10px}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #f0f4f9;font-size:13px;line-height:1.6}
.kv:last-child{border-bottom:none}
.kv .k{width:82px;flex:0 0 auto;color:var(--muted);font-size:12.5px}
.kv .v{flex:1;min-width:0;word-break:break-word}
.steps{position:relative;padding-left:20px}
.steps::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.step{position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:-19px;top:4px;width:11px;height:11px;border-radius:50%;
  background:#fff;border:2.5px solid var(--line)}
.step.on::before{border-color:var(--blue)}
.step.over::before{border-color:var(--danger)}
.step .st{font-size:13px;font-weight:600}
.step .sm{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(10px);opacity:0;background:#1c2d44;
  color:#fff;padding:10px 18px;border-radius:8px;font-size:12.5px;transition:.24s;pointer-events:none;z-index:99;
  box-shadow:0 10px 30px rgba(28,45,68,.3);max-width:80vw;text-align:center;line-height:1.6}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:1180px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.filters input{width:140px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>批注台账</h1>
      <p>汇总 BIM 模型与全景对比中发起的全部批注及其整改闭环情况。批注来自现场移动端与 Web 端分屏对比，状态自动同步。</p>
    </div>
    <div class="sp"></div>
    <button class="btn" id="refreshBtn">刷新</button>
    <button class="btn pri" id="exportBtn">导出未闭环清单</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <select id="fStatus">
      <option value="all">全部状态</option>
      <option value="open">未闭环</option>
      <option value="待整改">待整改</option>
      <option value="继续整改">继续整改</option>
      <option value="待复查">待复查</option>
      <option value="已复查">已复查</option>
      <option value="待整改逾期">待整改逾期</option>
    </select>
    <select id="fChecker"><option value="">全部批注人</option></select>
    <select id="fComp"><option value="">全部构件</option></select>
    <input id="fSearch" placeholder="搜索批注内容 / 构件 / 责任人"/>
    <div class="sp"></div>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="card">
    <div class="hintbar"><span class="dot"></span>「待整改逾期」为派生状态：待整改或继续整改且已过整改期限，无需人工维护。</div>
    <table>
      <colgroup>
        <col style="width:44px"><col><col style="width:178px"><col style="width:172px">
        <col style="width:120px"><col style="width:150px"><col style="width:104px">
      </colgroup>
      <thead><tr>
        <th>序号</th><th>批注内容</th><th>关联构件</th><th>批注人 / 时间</th>
        <th>整改状态</th><th>整改人 / 期限</th><th class="ops">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="dhd"><h3 id="dTitle">批注详情</h3><button class="x" id="dClose">×</button></div>
  <div class="dbd" id="dBody"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');

/* ===== 数据 =====
   同一份批注数据由三处共用：BIM统一模型_交互原型（批注页签）、分屏对比（发起）、移动端。
   存储 key 统一为 xa-annotations-v1；本页作为嵌入页（sandbox 无 same-origin）时读不到 localStorage，
   自动回落到种子数据，因此任何环境下都能独立演示。 */
const SEED=[
  {id:101,type:'annotation',title:'桥架与风管净距不足',componentId:'C-A1',compName:'1号楼 · 14层 · 柱 KZ-01',checkTime:'2026-10-12 09:26',checker:'张恒毓',category:'机电安装 / 管线综合',level:'一般',
   description:'电气桥架与排风管交叉处净距不足 50mm，不满足规范要求。',requirement:'调整桥架标高或路由，避让排风管后复检。',
   deadline:'2026-10-15',unit:'机电安装班组',assignee:'李强',reviewer:'王会彬',baseStatus:'待整改',issueRequired:true,round:1,source:'全景对比'},
  {id:102,type:'annotation',title:'模板拼缝处漏浆痕迹',componentId:'C-A3',compName:'1号楼 · 14层 · 柱 KZ-02',checkTime:'2026-10-08 15:40',checker:'刘振',category:'主体结构工程 / 模板工程',level:'一般',
   description:'柱模板拼缝处存在漏浆痕迹，拆模后表面观感缺陷。',requirement:'封堵拼缝，后续浇筑前复查。',
   deadline:'2026-10-11',unit:'主体施工班组',assignee:'徐志成',reviewer:'王会彬',baseStatus:'待复查',issueRequired:true,round:1,source:'全景对比'},
  {id:103,type:'annotation',title:'临边防护栏杆缺失',componentId:'C-A2',compName:'1号楼 · 14层 · 楼板 B-01',checkTime:'2026-09-18 10:05',checker:'王会彬',category:'高处作业 / 临边防护',level:'严重',
   description:'楼板临边防护栏杆未安装到位，存在坠落风险。',requirement:'立即补齐防护栏并设置警示标识。',
   deadline:'2026-09-20',unit:'主体施工班组',assignee:'徐志成',reviewer:'王会彬',baseStatus:'待整改',issueRequired:true,round:1,source:'全景对比'},
  {id:104,type:'annotation',title:'地面成品保护不到位',componentId:'C-A5',compName:'1号楼 · 14层 · 梁 KL-05',checkTime:'2026-09-22 11:20',checker:'张恒毓',category:'文明施工 / 成品保护',level:'一般',
   description:'已完工地坪未做覆盖保护，材料堆放造成划痕。',requirement:'覆盖保护并清理堆放材料。',
   deadline:'',unit:'',assignee:'',reviewer:'',baseStatus:'待整改',issueRequired:false,round:1,source:'移动端'},
  {id:105,type:'annotation',title:'桥架吊架间距偏大',componentId:'C-B1',compName:'2号楼 · 13层 · 梁 L-12',checkTime:'2026-09-16 14:30',checker:'李强',category:'机电安装 / 支吊架',level:'一般',
   description:'桥架吊架间距超过规范要求，需加密。',requirement:'按规范加密吊架。',
   deadline:'2026-10-20',unit:'机电安装班组',assignee:'李强',reviewer:'王会彬',baseStatus:'继续整改',issueRequired:true,round:2,source:'全景对比'},
  {id:106,type:'annotation',title:'风管保温层局部破损',componentId:'C-A6',compName:'1号楼 · 13层 · 梁 KL-03',checkTime:'2026-09-10 16:05',checker:'刘振',category:'机电安装 / 暖通',level:'一般',
   description:'风管保温层局部破损，影响保温效果。',requirement:'修补保温层并复查。',
   deadline:'2026-09-13',unit:'机电安装班组',assignee:'李强',reviewer:'王会彬',baseStatus:'已复查',issueRequired:true,round:1,source:'全景对比'}
];

/* 读取存储（可能因 sandbox 不可用） */
function loadStore(){
  let raw=null;
  try{ raw=localStorage.getItem('xa-annotations-v1') }catch(e){ raw=null }
  if(!raw) return null;
  try{
    const d=JSON.parse(raw);
    const list=Array.isArray(d)?d:(d.annotations||[]);
    return list.length?list:null;
  }catch(e){ return null }
}
let DATA=(loadStore()||SEED).map(r=>({...r}));

/* ===== 状态派生（与 BIM统一模型 保持一致） ===== */
function displayStatus(r){
  const b=r.baseStatus||r.status||'待整改';
  const open=(b==='待整改'||b==='继续整改');
  return (open&&r.deadline&&r.deadline<today())?'待整改逾期':b;
}
function overdueDays(r){
  if(displayStatus(r)!=='待整改逾期'||!r.deadline) return 0;
  const d=(new Date(today())-new Date(r.deadline))/86400000;
  return Math.max(0,Math.round(d));
}
function badgeCls(s){
  return s==='待整改逾期'?'over':s==='待整改'?'wait':s==='继续整改'?'cont':s==='待复查'?'check':s==='已复查'?'done':'wait';
}
const isClosed=s=>s==='已复查';

/* ===== 渲染 ===== */
function stat(i){
  const all=DATA.map(r=>({r,s:displayStatus(r)}));
  return {
    total:all.length,
    wait:all.filter(x=>x.s==='待整改').length,
    cont:all.filter(x=>x.s==='继续整改').length,
    check:all.filter(x=>x.s==='待复查').length,
    done:all.filter(x=>x.s==='已复查').length,
    over:all.filter(x=>x.s==='待整改逾期').length,
    noIssue:all.filter(x=>x.r.issueRequired===false).length,
    firstPass:all.filter(x=>x.s==='已复查'&&(x.r.round||1)===1).length
  };
}
function renderStats(){
  const s=stat();
  const rate=s.done?Math.round(s.firstPass/s.done*100):0;
  const cards=[
    {cls:'a',n:s.wait, t:'待整改',    sub:'已派单，等待整改人处理'},
    {cls:'b',n:s.cont, t:'继续整改',  sub:'复查未通过，退回重做'},
    {cls:'c',n:s.check,t:'待复查',    sub:'整改人已提交，等待复查'},
    {cls:'d',n:s.done, t:'已复查',    sub:'一次通过率 '+rate+'%'},
    {cls:'e',n:s.over, t:'待整改逾期',sub:'含继续整改超期，需督办'}
  ];
  $('#stats').innerHTML=cards.map(c=>
    '<div class="stat '+c.cls+'"><div class="n">'+c.n+'</div><div class="t">'+c.t+'</div><div class="s">'+c.sub+'</div></div>'
  ).join('');
}
function renderFilters(){
  const cs=[...new Set(DATA.map(r=>r.checker))].sort();
  const ps=[...new Set(DATA.map(r=>r.compName).filter(Boolean))].sort();
  const cur1=$('#fChecker').value, cur2=$('#fComp').value;
  $('#fChecker').innerHTML='<option value="">全部批注人</option>'+cs.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  $('#fComp').innerHTML='<option value="">全部构件</option>'+ps.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  $('#fChecker').value=cur1; $('#fComp').value=cur2;
}
function rows(){
  const st=$('#fStatus').value, ck=$('#fChecker').value, cp=$('#fComp').value,
        kw=$('#fSearch').value.trim().toLowerCase();
  return DATA.map(r=>({r,s:displayStatus(r)})).filter(({r,s})=>{
    if(st==='open'){ if(isClosed(s)) return false }
    else if(st!=='all'&&s!==st) return false;
    if(ck&&r.checker!==ck) return false;
    if(cp&&r.compName!==cp) return false;
    if(kw){
      const hay=[r.title,r.description,r.compName,r.assignee,r.requirement,r.category].join(' ').toLowerCase();
      if(hay.indexOf(kw)<0) return false;
    }
    return true;
  }).sort((a,b)=>{
    const rank=x=>x==='待整改逾期'?0:x==='待整改'?1:x==='继续整改'?2:x==='待复查'?3:4;
    return rank(a.s)-rank(b.s)||String(b.r.checkTime).localeCompare(a.r.checkTime);
  });
}
function renderTable(){
  const list=rows(), body=$('#tbody');
  const s0=stat();
  $('#cnt').innerHTML='共 <b>'+list.length+'</b> 条 / 全部 '+DATA.length+' 条 · 未派单 <b>'+s0.noIssue+'</b> 条';
  if(!list.length){
    body.innerHTML='<tr><td colspan="7"><div class="empty"><b>没有符合条件的批注</b>调整筛选条件，或到 BIM 模型 / 全景对比中点击构件发起批注。</div></td></tr>';
    return;
  }
  body.innerHTML=list.map(({r,s},i)=>{
    const od=overdueDays(r);
    const duty=r.issueRequired===false
      ? '<span style="color:#9aa8bc">未下发整改单</span>'
      : esc(r.assignee||'--')+'<div class="cell-sub">期限 '+(r.deadline?esc(r.deadline):'--')+(od?' · 超期 '+od+' 天':'')+'</div>';
    return '<tr data-id="'+r.id+'">'
      +'<td>'+(i+1)+'</td>'
      +'<td><div class="cell-title">'+esc(r.title)+'</div>'
        +'<div class="cell-sub">'+esc(r.description)+'</div>'
        +'<div style="margin-top:6px"><span class="tag">第 '+(r.round||1)+' 轮</span>'
        +(r.source?'<span class="tag">'+esc(r.source)+'</span>':'')+'</div></td>'
      +'<td class="comp">'+esc(r.compName||r.componentId)+'<small>'+esc(r.componentId)+'</small></td>'
      +'<td>'+esc(r.checker)+'<div class="cell-sub">'+esc(r.checkTime)+'</div></td>'
      +'<td><span class="badge '+badgeCls(s)+'">'+esc(s)+'</span>'+(od?'<span class="over-days">超'+od+'天</span>':'')+'</td>'
      +'<td>'+duty+'</td>'
      +'<td class="ops"><button class="btn" data-detail="'+r.id+'">详情</button></td>'
      +'</tr>';
  }).join('');
}
function renderAll(){ renderStats(); renderFilters(); renderTable(); }

/* ===== 详情抽屉 ===== */
function stepHtml(r){
  const s=displayStatus(r);
  const od=overdueDays(r);
  const steps=[];
  steps.push({t:'批注发起',m:r.checker+' · '+r.checkTime+' · 来源：'+(r.source||'—'),
    c:true});
  if(r.issueRequired===false){
    steps.push({t:'未下发整改单',m:'仅留痕批注，未指派整改人与期限',c:false});
  }else{
    steps.push({t:'下发整改单',m:'整改人：'+r.assignee+' · 责任单位：'+(r.unit||'--')+' · 期限：'+r.deadline+' · 复查人：'+r.reviewer,c:true});
    if(s==='待整改'||s==='待整改逾期') steps.push({t:'等待整改',m:r.assignee+' 尚未提交整改结果',c:false,over:s==='待整改逾期'});
    if(s==='继续整改') steps.push({t:'复查未通过 · 继续整改',m:'第 '+(r.round||1)+' 轮，需重新整改后再次提交',c:true});
    if(s==='待复查') steps.push({t:'整改已提交 · 待复查',m:'等待 '+r.reviewer+' 复查',c:true});
    if(s==='已复查') steps.push({t:'复查通过 · 已闭环',m:'复查人：'+r.reviewer,c:true});
    if(s==='待整改逾期') steps.push({t:'已超期 '+od+' 天',m:'超过整改期限 '+r.deadline+'，需督办',c:false,over:true});
  }
  return '<div class="steps">'+steps.map(x=>
    '<div class="step '+(x.over?'over':x.c?'on':'')+'"><div class="st">'+esc(x.t)+'</div><div class="sm">'+esc(x.m)+'</div></div>'
  ).join('')+'</div>';
}
function openDetail(id){
  const r=DATA.find(x=>x.id===id); if(!r) return;
  const s=displayStatus(r);
  $('#dTitle').textContent=r.title;
  $('#dBody').innerHTML=
    '<div class="sec"><h4>整改状态</h4>'
      +'<div class="kv"><span class="k">当前状态</span><span class="v"><span class="badge '+badgeCls(s)+'">'+esc(s)+'</span>'
      +(overdueDays(r)?'<span class="over-days">超期 '+overdueDays(r)+' 天</span>':'')+'</span></div>'
      +'<div class="kv"><span class="k">整改轮次</span><span class="v">第 '+(r.round||1)+' 轮</span></div>'
      +'<div class="kv"><span class="k">是否派单</span><span class="v">'+(r.issueRequired===false?'否（仅批注留痕）':'是')+'</span></div>'
    +'</div>'
    +'<div class="sec"><h4>批注信息</h4>'
      +'<div class="kv"><span class="k">问题描述</span><span class="v">'+esc(r.description)+'</span></div>'
      +'<div class="kv"><span class="k">整改要求</span><span class="v">'+esc(r.requirement)+'</span></div>'
      +'<div class="kv"><span class="k">关联构件</span><span class="v">'+esc(r.compName||r.componentId)+'<br><span style="color:#9aa8bc;font-size:11.5px">'+esc(r.componentId)+'</span></span></div>'
    +'</div>'
    +'<div class="sec"><h4>责任分工</h4>'
      +'<div class="kv"><span class="k">批注人</span><span class="v">'+esc(r.checker)+' · '+esc(r.checkTime)+'</span></div>'
      +'<div class="kv"><span class="k">整改人</span><span class="v">'+esc(r.assignee||'--')+(r.unit?'（'+esc(r.unit)+'）':'')+'</span></div>'
      +'<div class="kv"><span class="k">整改期限</span><span class="v">'+esc(r.deadline||'--')+'</span></div>'
      +'<div class="kv"><span class="k">复查人</span><span class="v">'+esc(r.reviewer||'--')+'</span></div>'
    +'</div>'
    +'<div class="sec"><h4>流转记录</h4>'+stepHtml(r)+'</div>';
  $('#mask').classList.add('on'); $('#drawer').classList.add('on');
}
function closeDetail(){ $('#mask').classList.remove('on'); $('#drawer').classList.remove('on'); }

/* ===== 事件 ===== */
$('#tbody').addEventListener('click',e=>{
  const b=e.target.closest('[data-detail]');
  if(b){ e.stopPropagation(); openDetail(+b.dataset.detail); return }
  const tr=e.target.closest('tr[data-id]');
  if(tr) openDetail(+tr.dataset.id);
});
$('#dClose').onclick=closeDetail;
$('#mask').onclick=closeDetail;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail() });
['#fStatus','#fChecker','#fComp'].forEach(s=>$(s).onchange=renderTable);
$('#fSearch').oninput=renderTable;
$('#refreshBtn').onclick=()=>{ const d=loadStore(); if(d){DATA=d.map(r=>({...r}))} renderAll(); toast('已刷新，共 '+DATA.length+' 条批注') };
$('#exportBtn').onclick=()=>{
  const open=DATA.map(r=>({r,s:displayStatus(r)})).filter(x=>!isClosed(x.s));
  if(!open.length){ toast('全部批注均已闭环，无需导出'); return }
  const lines=['批注内容,关联构件,整改状态,整改人,整改期限,超期天数']
    .concat(open.map(({r,s})=>[r.title,r.compName||r.componentId,s,r.assignee||'--',r.deadline||'--',overdueDays(r)||''].join(',')));
  toast('已生成未闭环清单：'+open.length+' 条（演示环境不下载文件）');
  console.log(lines.join('\n'));
};
let tt=null;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2600) }

/* ===== 跨端同步 ===== */
window.addEventListener('message',e=>{
  const d=e.data; if(!d||d.channel!=='xa-annotation') return;
  if(d.action==='refresh'||d.action==='changed'){
    /* 宿主（v4）只持有它自己持久化的那些批注，因此这里做合并而不是整体替换，
       保证种子数据与各端新增的批注都在台账里可见 */
    if(Array.isArray(d.data)&&d.data.length){
      d.data.forEach(x=>{
        const i=DATA.findIndex(y=>y.id===x.id);
        if(i<0) DATA.push({...x}); else DATA[i]={...DATA[i],...x};
      });
    } else { const s=loadStore(); if(s) DATA=s.map(r=>({...r})); }
    renderAll(); toast('批注已更新，共 '+DATA.length+' 条');
  }
});
try{
  const bc=new BroadcastChannel('xa-annotation-sync');
  bc.onmessage=e=>{ if(e.data&&e.data.type==='changed'){ const s=loadStore(); if(s)DATA=s.map(r=>({...r})); renderAll(); toast('批注已更新') } };
}catch(e){}
try{ window.addEventListener('storage',e=>{ if(e.key==='xa-annotations-v1'){ const s=loadStore(); if(s){DATA=s.map(r=>({...r})); renderAll()} } }) }catch(e){}

renderAll();
})();
</script>
</body>
</html>
