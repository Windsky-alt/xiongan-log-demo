function clone(x){return JSON.parse(JSON.stringify(x))}
function read(key,fallback){const raw=localStorage.getItem(key);return raw?JSON.parse(raw):clone(fallback)}
function normalizeBindings(raw){
 const out={};
 Object.entries(raw||{}).forEach(([key,values])=>{
  const code=key.replace(/^(REPORT\||report:)/,'');
  if(!Array.isArray(values))return;
  out[code]=[...new Set([...(out[code]||[]),...values.filter(v=>typeof v==='string')])];
 });
 return out;
}
function sourceKey(r){return [r.type,r.type==='briefing'?r.subtype||'':'',r.type==='report'?'report:'+r.sendCode:r.sourceId||r.id].join('|')}
function rowKey(r){return sourceKey(r)+'|'+r.componentId}
function reportRows(bindings,rows,overrides={}){
 const out=rows.filter(r=>r.type!=='report');
 Object.entries(bindings).forEach(([code,names])=>{
  const existing=rows.filter(r=>r.type==='report'&&r.sendCode===code);
  const original=existing[0]||catalog.find(r=>r.sendCode===code);
  if(!original)return;const data={...original,...overrides[code]};
  names.forEach(name=>{const c=components.find(c=>c[0]===name||c[1]===name);if(!c)return;
   const old=existing.find(r=>r.componentId===c[0]);
   out.push({...data,...old,type:'report',sourceId:'report:'+code,componentId:c[0],compName:c[1],x:c[2],y:c[3],
    title:code+' · '+data.materialName,checkTime:data.sendDate||'',bimModel:old?.bimModel||data.bimModel||'XA000_ZMXA_A_建筑单体主文件-01地块-地上.rvt'});
  });
 });
 return out;
}
function baseline(){return{records:reportRows(seedBindings,[]),reportBindings:clone(seedBindings)}}
function load(){
 const state=read(KEY,{records:[],reportBindings:null});
 const bindings={...clone(seedBindings),...normalizeBindings(state.reportBindings||read(LEGACY,{}))};
 return{records:reportRows(bindings,Array.isArray(state.records)?state.records:[],state.reportOverrides||{}),reportBindings:bindings,reportOverrides:state.reportOverrides||{},inspectOverrides:state.inspectOverrides||{}};
}
function save(rows,options={}){
 const state=load(),incoming=(rows||[]).filter(r=>r&&['quality','safety','briefing','measure','report','plan','annotation'].includes(r.type)&&r.sourceId&&r.componentId);
 const bills=incoming.filter(r=>r.bindingKind==='bill');
 bills.forEach(r=>{
  const code=r.rectifyCode||r.sourceId,current=state.inspectOverrides?.[code]||r.rectifySnapshot||r;
  if(status(current)==='已撤回')throw Error('已撤回整改单不允许挂接');
  if(r.type==='safety'){
   if(!String(r.problemLocation||'').trim())throw Error('请填写问题部位');
   if(new Set(bills.filter(x=>sourceKey(x)===sourceKey(r)).map(x=>x.componentId)).size!==1)throw Error('安全整改单请选择一个范围内的参考构件');
  }
 });
 const replacing=new Set([...(options.replaceSources||[]),...bills.map(sourceKey)]),map=new Map(state.records.filter(r=>!replacing.has(sourceKey(r))).map(r=>[rowKey(r),r]));
 incoming.forEach(r=>map.set(rowKey(r),clone(r)));
 const bindings={...state.reportBindings};
 incoming.filter(r=>r.type==='report').forEach(r=>{
  if(!bindings[r.sendCode])bindings[r.sendCode]=[];
  const c=components.find(c=>c[0]===r.componentId);
  if(c&&!bindings[r.sendCode].includes(c[1]))bindings[r.sendCode].push(c[1]);
 });
 Object.entries(normalizeBindings(options.reportBindings)).forEach(([code,names])=>bindings[code]=names);
 const overrides={...state.reportOverrides,...options.reportOverrides};
 const next={records:reportRows(bindings,[...map.values()],overrides),reportBindings:bindings,reportOverrides:overrides,inspectOverrides:{...state.inspectOverrides,...options.inspectOverrides}};
 localStorage.setItem(KEY,JSON.stringify(next));
 // 新数据以同一个存储项提交；旧索引仅供旧版本页面兼容读取。
 try{localStorage.setItem(LEGACY,JSON.stringify(bindings))}catch{}
 return next;
}
function status(r){return r.issueRequired===false?'无需整改':String(r.baseStatus||r.status||r.state||'待整改').replace('逾期','')}
function overdueDays(r){
 const s=status(r);if(s==='无需整改'||!/^\d{4}-\d{2}-\d{2}$/.test(r.deadline||''))return 0;
 const end=['待整改','继续整改'].includes(s)?new Date().toLocaleDateString('sv-SE'):(r.rectifiedAt||r.reviewAt||'').slice(0,10);
 if(!end)return 0;const days=(Date.parse(end+'T00:00:00Z')-Date.parse(r.deadline+'T00:00:00Z'))/86400000;
 return Number.isFinite(days)?Math.max(0,Math.round(days)):0;
}

window.addEventListener('message',e=>{const d=e.data;if(e.source!==parent||d?.channel!=='xa-measure-history')return;if(d.action==='init'&&Array.isArray(d.data)){mergeMobileReports(d.data);render()}});
window.addEventListener('storage',e=>{if(e.key==='xa_measure_work_v1'){try{mergeMobileReports(XABimStore.measurementHistory());render()}catch{}}});
if(parent!==window)parent.postMessage({channel:'xa-measure-history',action:'ready'},'*');
function locationResult(loc){return XABimStore.pointSummary(loc.points).result}
function locationRate(loc){return XABimStore.pointSummary(loc.points).rate}
function pointChips(loc,limit=3){return '<div class="value-chips">'+loc.points.slice(0,limit).map(p=>'<span class="value-chip">'+esc(p.no)+'：'+esc(p.value)+' '+esc(p.unit)+'</span>').join('')+(loc.points.length>limit?'<span class="value-chip">+'+(loc.points.length-limit)+'个</span>':'')+'</div>'}
function pointDetail(loc){return '<table class="point-subtable"><thead><tr><th>测点序号</th><th>测点值</th><th>标准范围</th><th>判定</th></tr></thead><tbody>'+loc.points.map(p=>'<tr><td>'+esc(p.no)+'</td><td class="point-value">'+esc(p.value)+' '+esc(p.unit)+'</td><td>'+esc(p.standard)+'</td><td class="'+(p.result==='合格'?'result-ok':p.result==='不合格'?'result-bad':'')+'">'+esc(p.result)+'</td></tr>').join('')+'</tbody></table>'}
function filtered(){return reports.filter(r=>(!filter.name||r.name.includes(filter.name))&&(!filter.start||r.time.slice(0,10)>=filter.start)&&(!filter.end||r.time.slice(0,10)<=filter.end))}
function render(){const rows=filtered();$('#count').textContent=rows.length;$('#tableMount').innerHTML=rows.length?'<div class="table-wrap"><table><colgroup><col style="width:180px"><col style="width:160px"><col style="width:100px"><col style="width:100px"><col style="width:155px"><col style="width:100px"><col style="width:150px"><col style="width:90px"><col style="width:135px"></colgroup><thead><tr><th>表单名称</th><th>工序</th><th>区域</th><th>记录人</th><th>测量时间</th><th>总合格率</th><th>合格报告</th><th>测量报告</th><th>操作</th></tr></thead><tbody>'+rows.map(r=>'<tr><td title="'+esc(r.name)+'">'+esc(r.name)+'</td><td title="'+esc(r.process)+'">'+esc(r.process)+'</td><td>'+esc(r.area)+'</td><td>'+esc(r.recorder)+'</td><td>'+esc(r.time)+'</td><td>'+esc(r.rate)+'</td><td><button class="action" data-report="'+r.id+'">查看</button><button class="download">下载</button></td><td><button class="action" data-report="'+r.id+'">查看</button></td><td><button class="bind" data-bind="'+r.id+'">BIM模型挂接</button></td></tr>').join('')+'</tbody></table></div><div class="pagination"><span>共 '+rows.length+' 条</span><span>10条/页</span><span>‹</span><span class="page-no">1</span><span>›</span></div>':'<div class="empty">暂无测量记录</div>'}
function openDialog(title,body,foot,cls=''){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;$('#dialogFoot').innerHTML=foot;$('#dialog').className='dialog '+cls;$('#mask').classList.add('show')}
function closeDialog(){$('#mask').classList.remove('show');current=null;selectedLocations.clear();bindingExpanded.clear()}
function openReport(r){const cells=r.locations.map((loc,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(loc.item)+'</td><td>'+esc(loc.position)+'</td><td>'+pointChips(loc,99)+'</td><td>'+loc.points.length+'</td><td class="'+(locationResult(loc)==='合格'?'result-ok':locationResult(loc)==='不合格'?'result-bad':'')+'">'+locationResult(loc)+'</td></tr>').join('');openDialog('测量报告','<div class="report-title">'+esc(r.name)+'</div><div class="report-meta"><span>楼号：'+esc(r.area)+'</span><span>工序：'+esc(r.process)+'</span><span>记录人：'+esc(r.recorder)+'</span><span>检查时间：'+esc(r.time)+'</span></div><table class="sheet"><thead><tr><th style="width:55px">序号</th><th>测量项</th><th>测量部位</th><th>测点值</th><th style="width:75px">测点数</th><th style="width:85px">综合判定</th></tr></thead><tbody>'+cells+'</tbody></table>','<button class="btn primary" id="downloadReport">下载</button><button class="btn" id="reportClose">关闭</button>','report');$('#reportClose').onclick=closeDialog;$('#downloadReport').onclick=()=>alert('原型：已生成测量报告下载任务')}
function openBinding(r){current=r;const allSelected=r.locations.length>0&&r.locations.every(loc=>selectedLocations.has(loc.id)),rows=r.locations.map(loc=>{const expanded=bindingExpanded.has(loc.id),checked=selectedLocations.has(loc.id);return '<tr class="'+(checked?'selected':'')+'" data-pick-row="'+loc.id+'"><td><input type="checkbox" name="measureLocation" value="'+loc.id+'" '+(checked?'checked':'')+'></td><td>'+esc(r.time)+'</td><td>'+esc(loc.item)+'</td><td title="'+esc(loc.position)+'">'+esc(loc.position)+'</td><td>'+loc.points.length+'</td><td>'+pointChips(loc)+'</td><td class="'+(locationResult(loc)==='合格'?'result-ok':locationResult(loc)==='不合格'?'result-bad':'')+'">'+locationResult(loc)+'</td><td><button class="value-more" data-expand-location="'+loc.id+'">'+(expanded?'收起':'展开')+'</button></td></tr>'+(expanded?'<tr class="point-detail"><td colspan="8">'+pointDetail(loc)+'</td></tr>':'')}).join('');openDialog('选择需要挂接的测量部位','<div class="pick-note">测量报告：<b>'+esc(r.name)+'</b>。支持全选或多选，选中的测量部位会分别挂接到同一批BIM构件，并保留各自的测点值和测量时间。</div><table class="pick-table"><colgroup><col style="width:48px"><col style="width:145px"><col style="width:155px"><col><col style="width:68px"><col style="width:260px"><col style="width:82px"><col style="width:60px"></colgroup><thead><tr><th><input id="selectAllLocations" type="checkbox" '+(allSelected?'checked':'')+' aria-label="全选测量部位"></th><th>测量时间</th><th>测量项</th><th>测量部位</th><th>测点数</th><th>测点值</th><th>综合判定</th><th>明细</th></tr></thead><tbody>'+rows+'</tbody></table>','<button class="btn" id="bindCancel">取消</button><button class="btn primary" id="bindConfirm" '+(selectedLocations.size?'':'disabled')+'>下一步：选择BIM构件（'+selectedLocations.size+'）</button>','lg');$('#bindCancel').onclick=closeDialog;$('#selectAllLocations').onchange=e=>{if(e.target.checked)r.locations.forEach(loc=>selectedLocations.add(loc.id));else selectedLocations.clear();openBinding(r)};document.querySelectorAll('input[name="measureLocation"]').forEach(el=>el.onchange=()=>{if(el.checked)selectedLocations.add(el.value);else selectedLocations.delete(el.value);openBinding(r)});document.querySelectorAll('[data-expand-location]').forEach(el=>el.onclick=()=>{const id=el.dataset.expandLocation;if(bindingExpanded.has(id))bindingExpanded.delete(id);else bindingExpanded.add(id);openBinding(r)});$('#bindConfirm').onclick=()=>{const measurements=r.locations.filter(loc=>selectedLocations.has(loc.id)).map(loc=>({measurementItem:loc.item,measurementPosition:loc.position,points:loc.points,result:locationResult(loc),passRate:locationRate(loc),sourceId:r.id+'-'+loc.id}));if(!measurements.length)return;window.parent.postMessage({channel:'xa-bim-measure',action:'bind',reportName:r.name,measurementTime:r.time,measurements},'*')}}
$('#tableMount').addEventListener('click',e=>{const reportId=e.target.closest('[data-report]')?.dataset.report,bindId=e.target.closest('[data-bind]')?.dataset.bind;if(reportId){const r=reports.find(x=>x.id===reportId);if(r)openReport(r)}if(bindId){const r=reports.find(x=>x.id===bindId);if(r)openBinding(r)}});$('#searchBtn').onclick=()=>{filter={name:$('#nameFilter').value.trim(),start:$('#startDate').value,end:$('#endDate').value};render()};$('#resetBtn').onclick=()=>{$('#nameFilter').value='';$('#startDate').value='';$('#endDate').value='';filter={name:'',start:'',end:''};render()};$('#closeBtn').onclick=closeDialog;$('#mask').onclick=e=>{if(e.target.id==='mask')closeDialog()};render();
})();
</script>
</body>
</html>
