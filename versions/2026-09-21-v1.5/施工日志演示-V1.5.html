<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>雄安科创园指挥工地 - 施工日志</title>
<style>
  :root{
    --blue:#1688f8; --blue-soft:#edf6ff; --text:#26364d; --muted:#7d8ca2;
    --line:#e7edf5; --bg:#f5f8fc; --danger:#ff5d6c; --shadow:0 12px 34px rgba(46,79,122,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);background:var(--bg)}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .app{min-width:1280px;height:100vh;overflow:hidden;background:
    radial-gradient(circle at 18% 0%,rgba(86,171,255,.13),transparent 26%),
    linear-gradient(180deg,#f7fbff 0,#f6f8fc 100%)}
  .topbar{height:72px;display:flex;align-items:center;border-bottom:1px solid #e6edf6;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);position:relative;z-index:20}
  .brand{width:330px;padding-left:18px;font-size:28px;font-weight:800;color:#0787f7;letter-spacing:-1px;white-space:nowrap}
  .topnav{height:72px;display:flex;align-items:center;gap:28px;font-size:20px}
  .topnav .item{height:72px;display:flex;align-items:center;position:relative;color:#172437;cursor:pointer;white-space:nowrap}
  .topnav .item.active{color:var(--blue);font-weight:700}
  .topnav .item.active:after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;background:var(--blue)}
  .topnav .chev{font-size:12px;margin-left:8px}
  .userbox{margin-left:auto;margin-right:16px;height:52px;min-width:560px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding:0 18px;box-shadow:0 2px 15px rgba(50,75,110,.04);gap:14px;color:#475568}
  .divider{width:1px;height:22px;background:#e4eaf2}
  .project-name{min-width:180px;text-align:center}
  .round-user{width:29px;height:29px;border-radius:50%;background:#a9aaad;position:relative}
  .round-user:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:9px;top:5px}
  .round-user:after{content:"";position:absolute;width:18px;height:9px;border-radius:12px 12px 6px 6px;background:#fff;left:5px;bottom:4px}
  .device-ico{font-size:18px;color:#64758c}

  .body{height:calc(100vh - 72px);display:flex}
  .sidebar{width:242px;padding:6px 14px 14px;background:linear-gradient(180deg,rgba(255,255,255,.44),rgba(247,250,255,.95));border-right:1px solid #edf2f7;overflow:auto}
  .menu-group{font-size:13px;color:#94a3b8;padding:12px 14px 4px}
  .menu-item{height:46px;display:flex;align-items:center;padding:0 14px;border-radius:7px;margin:1px 0;font-size:16px;color:#18263a;cursor:pointer}
  .menu-item.active{background:linear-gradient(90deg,#1292ff,#0b83f7);color:#fff}
  .collapse{position:sticky;bottom:0;margin:8px 0 0 auto;width:37px;height:37px;border:1px solid #d8e6f5;background:#fff;border-radius:7px;color:#1786f2;font-size:22px;display:flex;align-items:center;justify-content:center}

  .main{flex:1;padding:0 16px 16px 0;overflow:hidden}
  .panel{height:100%;background:#fff;border:1px solid #eef2f6;border-radius:16px 16px 0 0;overflow:hidden;box-shadow:0 2px 15px rgba(63,87,123,.02);display:flex;flex-direction:column}
  .crumbs{height:54px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #edf2f7;background:linear-gradient(90deg,#ecf7ff,#fbfbff);font-size:15px;color:#54677e}
  .crumbs .cur{color:#1f8ef5;font-weight:700}
  .crumb-back{border:1px solid #d6e5f5;background:#fff;color:#1f8ef5;border-radius:6px;height:32px;padding:0 14px;font-weight:600}
  .content{flex:1;overflow:auto;padding:22px 22px 50px}
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .ledger-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;border:1px solid #e4edf6;background:#fbfdff;border-radius:6px;color:#435873;font-size:14px}
  .ledger-filter input{height:34px;border:1px solid #d8e3ef;border-radius:4px;padding:0 9px;color:#435873;background:#fff}
  .ledger-filter .range-sep{color:#8494a8}
  .count{font-size:15px;color:#1d2b3e}
  .count b{color:#1688f8}
  .primary{border:0;background:#0d87f7;color:white;height:36px;border-radius:4px;padding:0 18px;font-weight:700;box-shadow:0 4px 10px rgba(13,135,247,.16)}
  .ghost{border:1px solid #dbe7f3;background:white;color:#496079;height:34px;border-radius:5px;padding:0 14px}
  .danger-btn{border:1px solid #ffc8ce;background:#fff6f7;color:#e94655;height:34px;border-radius:5px;padding:0 14px}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{background:#f2f3f5;color:#293c55;text-align:left;height:50px;padding:0 14px;font-size:15px;font-weight:700}
  td{height:50px;padding:0 14px;border-bottom:1px solid #e8eef5;color:#5b6b80;font-size:14px;vertical-align:middle}
  .action{color:#0787f7;margin-right:12px;cursor:pointer;white-space:nowrap}
  .action.danger{color:#ff5c68}
  .ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .expander{width:26px;text-align:center;color:#4f6075;font-size:16px;cursor:pointer;user-select:none}
  tr.parent:hover td{background:#fbfdff}
  tr.parent.open td{background:#f7fbff}
  .child-box{padding:12px 16px 14px;border-bottom:1px solid #e8eef5;background:#fff}
  .child-tip{font-size:12px;color:#8b98a8;margin:0 0 8px}
  .status{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px}
  .status.done{background:#eaf8f0;color:#118c52}
  .status.todo{background:#f3f5f7;color:#7d8896}
  .status.overdue{background:#fff0f1;color:#e54c58}
  .progress-text{font-size:12px;color:#586a80}
  .progress-line{display:inline-block;vertical-align:middle;width:74px;height:6px;background:#edf1f5;border-radius:4px;margin-left:8px;overflow:hidden}
  .progress-line>span{display:block;height:100%;background:#1688f8;border-radius:4px}
  .pagination{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding-top:26px;color:#5d6e83;font-size:13px}
  .select-mini,.page-input{height:36px;border:1px solid #d9e4ef;border-radius:5px;background:#fff;color:#53667d;padding:0 10px}
  .page-num{min-width:28px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer}
  .page-num.active{color:#1688f8;font-weight:700}
  .empty{padding:38px;text-align:center;color:#9ba7b7}

  .modal-mask{position:fixed;inset:0;background:rgba(22,37,58,.28);display:none;align-items:center;justify-content:center;z-index:99}
  .modal-mask.show{display:flex}
  .modal{width:760px;max-height:82vh;background:#fff;border-radius:8px;box-shadow:var(--shadow);overflow:hidden;animation:pop .18s ease-out;display:flex;flex-direction:column}
  .modal.lg{width:920px}
  @keyframes pop{from{transform:translateY(10px) scale(.985);opacity:.3}to{transform:none;opacity:1}}
  .modal-hd{height:58px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #edf1f5;font-size:17px;font-weight:700}
  .modal-close{margin-left:auto;color:#8b98a8;font-size:24px;font-weight:400;cursor:pointer}
  .modal-bd{padding:20px 22px;max-height:calc(82vh - 120px);overflow:auto}
  .modal-ft{height:62px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 22px;border-top:1px solid #edf1f5;background:#fafcff}
  .person-list{border:1px solid #e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:16px}
  .person-row{display:grid;grid-template-columns:1.1fr 1.1fr 1.1fr 80px;align-items:center;min-height:45px;padding:0 14px;border-bottom:1px solid #eef2f6;font-size:14px}
  .person-row:last-child{border-bottom:0}
  .person-row.head{background:#f5f6f7;font-weight:700;color:#3d5067}
  .person-add-panel{border:1px dashed #cfdceb;border-radius:6px;padding:14px;background:#fbfdff}
  .staff-form{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;padding:4px 2px 14px}
  .staff-form .form-item{display:flex;align-items:center;gap:10px;min-height:38px}
  .staff-form .form-item.full{grid-column:1 / -1}
  .staff-form .form-label{width:72px;flex:0 0 72px;color:#435873;font-size:14px}
  .staff-form .form-label.required:before{content:"*";color:#ef4b5b;margin-right:4px}
  .staff-form input,.staff-form select{height:36px;flex:1;min-width:0;border:1px solid #d8e2ed;border-radius:4px;padding:0 10px;color:#2d435b;background:#fff}
  .staff-current{margin-top:8px;border-top:1px solid #e8eef5;padding-top:14px}
  .search-row{display:flex;gap:10px;margin-bottom:10px}
  .search-row input,.search-row select{height:34px;border:1px solid #d8e2ed;border-radius:5px;padding:0 10px}
  .candidate{display:grid;grid-template-columns:34px 1fr 1fr 1fr;align-items:center;height:42px;border-bottom:1px solid #edf1f5}
  .candidate:last-child{border-bottom:0}
  .notice{background:#f1f8ff;border:1px solid #d4eafd;color:#56708e;border-radius:5px;padding:10px 12px;font-size:13px;margin-bottom:16px}
  .toast{position:fixed;top:88px;left:50%;transform:translateX(-50%);background:#1f2f43;color:white;padding:10px 18px;border-radius:5px;z-index:200;box-shadow:0 8px 22px rgba(20,37,58,.18);opacity:0;pointer-events:none;transition:.2s}
  .toast.show{opacity:1}
  .smallnote{font-size:12px;color:#8b98a8;margin-top:6px}

  /* ===== 编辑页 / 生成页 ===== */
  .docwrap{max-width:1060px;margin:0 auto}
  .doc-title{text-align:center;font-size:28px;font-weight:800;margin:2px 0 12px;color:#111;letter-spacing:1px}
  .doc-sub{text-align:left;font-size:15px;color:#111;margin:0 0 8px;padding:0 4px;font-weight:600}
  .sec-h{font-size:19px;font-weight:800;color:#111;margin:20px 0 8px;border-left:0;padding-left:0}
  .sec-h.sub{font-size:15px;border-left:0;margin:13px 0 6px;color:#111;font-weight:700}
  .tblwrap{overflow:auto;border:0;border-radius:0;margin-bottom:6px}
  table.doc{border-collapse:collapse;table-layout:fixed;min-width:100%}
  table.doc th{background:#245a87;color:#fff;font-weight:700;font-size:13px;height:36px;padding:6px 8px;border:1px solid #9fb7cc;text-align:center;white-space:normal;line-height:1.4}
  table.doc td{border:1px solid #b7c5d6;font-size:13px;color:#33475f;padding:6px 8px;height:34px;vertical-align:middle;background:#fff;line-height:1.6}
  table.doc td.k{background:#eef5fb;font-weight:700;text-align:center;color:#1c3252}
  table.doc td.c{text-align:center}
  .tblwrap.doc-head{border:1px solid #111;margin-bottom:12px}
  table.doc.doc-head td{border:1px solid #111;color:#111;height:42px;padding:7px 10px}
  table.doc.doc-head td.k{background:#fff;color:#111;text-align:left;font-weight:600}
  table.doc.doc-head .fld,.tblwrap.doc-head select{border:0;background:transparent;box-shadow:none;color:#111;padding:0;min-height:24px}
  table.doc.doc-head .auto-tag{border:0;background:transparent;color:#111;padding:0}
  .activity-label{border:1px solid #111;border-top:0;padding:8px 10px;margin-top:-13px;margin-bottom:16px;font-size:15px;color:#111;font-weight:600}
  .auto-tag{display:inline-block;background:#f0f3f7;color:#8496aa;border:1px dashed #c9d5e2;border-radius:3px;padding:1px 6px;font-size:12px}
  .fill-empty{color:#b3bfcd}
  .fld{width:100%;border:1px solid #cfdcec;border-radius:4px;background:#fff;padding:6px 8px;font-size:13px;color:#12233a;outline:none;min-height:30px}
  .fld:focus{border-color:#1688f8;box-shadow:0 0 0 3px rgba(22,136,248,.12)}
  textarea.fld{min-height:60px;resize:vertical;line-height:1.7}
  .fld.ro{background:#f5f7fa;border:1px dashed #d3dde8;color:#7d8ca2;cursor:not-allowed}
  .unit-field{display:flex;align-items:center;gap:5px;min-width:0}
  .unit-field .fld{flex:1;min-width:0}
  .fld-unit{white-space:nowrap;color:#111}
  .legend{display:flex;gap:18px;align-items:center;font-size:13px;color:#5b6b80;background:#f7fafd;border:1px solid #e3ecf5;border-radius:6px;padding:9px 14px;margin-bottom:14px;flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
  .legend .e{background:#fff;border:1px solid #cfdcec}
  .legend .r{background:#f5f7fa;border:1px dashed #c9d5e2}
  .legend .a{background:#eef7ff;border:1px solid #bcdcfb}
  .row-delete{border:1px solid #ffc8ce;background:#fff6f7;color:#e94655;border-radius:4px;padding:3px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
  .row-delete:hover{background:#fff0f2;border-color:#f38a95}
  .savbar{display:flex;justify-content:flex-end;gap:10px;padding:18px 0 6px}
  .paper{background:#fff;border:1px solid #e0e7ef;border-radius:6px;box-shadow:0 8px 26px rgba(43,65,95,.08);padding:24px 26px 28px}
  .hl{background:#fffbe6;box-shadow:inset 0 0 0 1px #ffe58f}
  .kv-note{background:#f1f8ff;border:1px solid #d4eafd;color:#56708e;border-radius:5px;padding:9px 12px;font-size:13px;margin:0 0 12px}
  /* 计划表工具条：位于表格上方，滚动时吸顶 */
  .plan-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin:0 0 8px;padding:8px 12px;background:#f7fafd;border:1px solid #e3ecf5;border-radius:6px;
    position:sticky;top:0;z-index:5}
  /* 必填标记与校验失败的控件 */
  .req-mark{color:#e94655;font-weight:700;margin-left:2px}
  .fld.fld-invalid{border-color:#e94655;background:#fff6f7;box-shadow:0 0 0 2px rgba(233,70,85,.10)}
  .fld.fld-invalid:focus{border-color:#e94655;box-shadow:0 0 0 3px rgba(233,70,85,.18)}

  /* 打印/导出只保留日志模板正文，不输出系统导航和操作界面。 */
  @page{size:A4 portrait;margin:10mm 10mm 10mm 10mm}
  @media print{
    html,body{height:auto;min-height:0;background:#fff;overflow:visible}
    .app{min-width:0;height:auto;overflow:visible;background:#fff}
    .topbar,.sidebar,.crumbs,.toolbar,.savbar,.legend,.ledger-filter,.pagination,.modal-mask,.toast{display:none!important}
    .body,.main,.panel{display:block;width:auto;height:auto;min-height:0;overflow:visible;padding:0;border:0;border-radius:0;box-shadow:none;background:#fff}
    .content{display:block;overflow:visible;padding:0;margin:0}
    .docwrap{max-width:none;width:100%;margin:0;padding:0}
    .paper{border:0;border-radius:0;box-shadow:none;padding:0;margin:0;background:#fff}
    .doc-title{margin:0 0 8px;font-size:24px;line-height:1.25}
    .doc-sub{margin:0 0 6px;padding:0;font-size:13px;line-height:1.4}
    .tblwrap{overflow:visible;break-inside:avoid;page-break-inside:avoid}
    table.doc{width:100%;min-width:0}
    table.doc tr{break-inside:avoid;page-break-inside:avoid}
    table.doc td,table.doc th{break-inside:avoid;page-break-inside:avoid}
    table.doc.doc-head{width:100%;}
    table.doc.doc-head td{height:42px;padding:6px 8px}
    .activity-label{margin-top:-7px;margin-bottom:10px}
    .sec-h{break-after:avoid;page-break-after:avoid;margin-top:12px;margin-bottom:5px;font-size:16px}
    .sec-h.sub{margin-top:8px;margin-bottom:4px;font-size:13px}
    .kv-note{background:#fff;color:#111;border:0;padding:2px 0;margin:0 0 5px;font-size:11px}
    .auto-tag{background:#fff;border:0;padding:0;color:#111}
    .fld,.fld.ro{border:0;background:transparent;box-shadow:none;color:#111;padding:0;min-height:20px}
    .fld-unit{color:#111}
  }
</style>
</head>
<body>
<div class="app" data-prd-version="1.5" data-updated="2026-09-20">
  <div class="topbar">
    <div class="brand">雄安科创园指挥工地</div>
    <div class="topnav" id="topNav">
      <div class="item">首页</div>
      <div class="item">个人中心</div>

      <div class="item">设备管理</div>

</div>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox">
    <div class="modal-hd"><span id="modalTitle"></span><span class="modal-close" id="modalClose">×</span></div>

</div>

<script>
(function(){
"use strict";

/* =========================================================================
   0. 常量 / 工具
   ========================================================================= */
const LS_KEY = "xa_cons_log_v1";
const PROJECT = "中煤雄安科创园项目";
const $ = s => document.querySelector(s);

const fmtDate = d => { const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };
const today = fmtDate(new Date());
const shift = n => { const d = new Date(); d.setDate(d.getDate()+n); return fmtDate(d); };
const cnDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");
  return m ? `${m[1]}年${m[2]}月${m[3]}日` : (s||""); };
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pct = (a,b) => b>0 ? Math.round(a/b*100) : 0;
/* 百分比：保留 2 位小数；分母为 0 显示横线（说明书「统一计算 空值和导出规则」） */
const pct2 = (a,b) => b>0 ? (a/b*100).toFixed(2) + "%" : "—";
/* 天气接口无结果 / 温度无值时的兜底，不得转为人工必填 */
const WEATHER_NA = "暂无数据";
const TEMP_NA = "—";

/* 人员库（人员配置从这里选） */
let STAFF = [
  {id:"p1",name:"张三",dept:"工程部",role:"施工员"},
  {id:"p2",name:"李四",dept:"安全部",role:"安全员"},
  {id:"p3",name:"王五",dept:"质量部",role:"质量员"},
  {id:"p4",name:"赵六",dept:"工程部",role:"技术员"},
  {id:"p5",name:"陈强",dept:"物资部",role:"材料员"},
  {id:"p6",name:"周敏",dept:"机电部",role:"机电工程师"},
  {id:"p7",name:"刘洋",dept:"工程部",role:"测量员"}
];
const staffOf = id => STAFF.find(x=>x.id===id) || {name:"—",dept:"",role:""};

/* 工序库：本周施工计划执行的默认工序（可改可增可删） */
const PROC_LIB = [
  "主体结构施工","钢筋绑扎","模板安装","混凝土浇筑","二次结构施工","砌体施工",
  "土方开挖","基坑支护","桩基施工","防水施工","脚手架搭设","钢筋加工",
  "混凝土养护","机电预埋","墙体抹灰","地面找平","屋面工程","门窗安装",
  "幕墙安装","室外管网"
];
/* 默认自动带出的本周计划行：[工序, 计划开始, 计划完成, 实际开始, 实际完成, 完成率, 今日情况说明] */

/* 表格行数（不含表头） */
const rowCountOf = tb => {
  const n = tb.n || 1;
  return Math.max(0, Math.ceil((tb.cols.length - 1) / n));
};

/* =========================================================================
   1. 字段构造器
   ========================================================================= */
/* 表格行允许直接写字符串；统一转换为标签单元格，确保表头和普通标签都能正确渲染 */
const R   = (...cells)                          => ({t:"r",cells:cells.map(c=>typeof c==="string"?SP(c,""):c)});
/* TB(列数, [表头行, 数据行...], link) */
const TB  = (n,a,b) => {
  const link = (typeof b === "string") ? b : ((typeof a === "string") ? a : "");
  const list = (Array.isArray(a)?a:[]).concat(Array.isArray(b)?b:[]);
  return {t:"tb", n, cols:list, link};
};
const TBX = (n,a,b,opts={}) => Object.assign(TB(n,a,b),opts);
/* 无列标题、整表都是标签-取值行 */
const TBN = (n,rows)                            => ({t:"tb", n, cols:rows, plainHead:true});
const F   = (key,label,value="",ph="",ro=false) => ({t:"f", key,label,value,ph,ro});
const N   = (key,label,value="",ph="")          => ({t:"n", key,label,value,ph});
const TA  = (key,label,value="",ph="",rows=4)   => ({t:"ta",key,label,value,ph,rows});
const SEL = (key,label,value,opts)              => ({t:"sel",key,label,value,opts});
const KV  = (label,value)                       => ({t:"kv",label,value});
const SP  = (label,value,span=1)                => ({t:"sp",label,value,span});
const RS  = (label,value="",span=1,rowspan=1)  => ({t:"sp",label,value,span,rowspan});
/* 系统只读单元格 */
const RO  = (label)                             => ({t:"ro",label});
/* 汇总值：从当日子日志自动汇总，不可手填 */
const SUM = (label,key,sumOf)                   => ({t:"sum",label,key,sumOf});
/* 闭环率类指标：按分子/分母算，保留 2 位；分母 0 显示横线 */
function calcRateText(a,b){ return pct2(Number(a)||0, Number(b)||0); }

function headerCells(rec, edit, isChild){
  const W = rec.weather || WEATHER_NA, WD = rec.wind || WEATHER_NA,
        TH = rec.temp_high || TEMP_NA, TL = rec.temp_low || TEMP_NA;
  const input=(key,v)=>edit?F(key,"",v,"",key==="log_date"):SP("",v);
  const weather=edit?SEL("weather","",(rec.weather||""),WEATHERS):SP("",W);
  const row2=(cell)=>Object.assign(cell,{rowspan:2});
  const temp=(key,v)=>Object.assign(input(key,v),{unit:"℃"});
  /* 与表 C1-5 模板一致：日期、气象、风力各占两行；温度在右侧上下分两行。 */
  const table = TBN(8,[
    R(RS("日期","",1,2),row2(input("log_date",cnDate(rec.date))),RS("气象","",1,2),row2(weather),RS("风力","",1,2),row2(input("wind",WD)),SP("最高温度"),temp("temp_high",TH)),
    R(SP("最低温度"),temp("temp_low",TL))
  ]);
  /* Word 模板前 7 列等宽，最右温度值列略宽。 */
  table.widths = ["11.91%","11.91%","11.91%","11.91%","11.91%","11.91%","11.91%","16.65%"];
  return table;
}

/* 质量日志「一 日志基本信息」表头 —— 用「列位摆放器」构造，避免手工算 colspan：
     · 最高温度 / 最低温度 放在同一列（上下相邻两行）
     · 天气 / 风力 纵向合并两行
   摆放器自动处理：被上面 rowspan 覆盖的列自动跳过（插空占位格），行尾自动补齐到 10 列。 */
function qualityHeaderCells(rec, edit, isChild){
  const W = rec.weather || WEATHER_NA, WD = rec.wind || WEATHER_NA,
        TH = rec.temp_high || TEMP_NA, TL = rec.temp_low || TEMP_NA;
  const COLS = 10;
  /* 取值格：编辑页为控件，生成页为文本 */
  const val = (key, value, span, ro=false) =>
    edit ? Object.assign(F(key,"",value,"",ro),{span}) : Object.assign(SP("",value),{span});
  const lab = (text, span=1, rowspan=1) => RS(text, "", span, rowspan);
  const M2  = c => Object.assign(c, {rowspan:2});
  const gap = n => Object.assign(RS("","",n), {blank:true});

  const rows = [];
  if(isChild){
    /* 第 1 行：个人版把「日志编号」标签与「【系统自动生成】」合并为一个单元格
       （1+3+1+5 = 10） */
    rows.push(R(lab("项目名称"), val("prj_name", PROJECT, 3, true),
                lab("日志编号　【系统自动生成】", 5)));
  }else{
    /* 第 1 行：项目名称 / 日志编号（1+4+1+4 = 10） */
    rows.push(R(lab("项目名称"), val("prj_name", PROJECT, 4, true),
                lab("日志编号"), val("log_no", "【系统自动生成】", 4, true)));
  }

  if(isChild){
    /* 第 2 行：日志日期 / 填报人 / 岗位（1+2+1+2+1+3 = 10） */
    rows.push(R(lab("日志日期"), val("log_date", cnDate(rec.date), 2, true),
                lab("填报人"),   val("filler", rec.personName || "【当前账号】", 2, true),
                lab("岗位"),     val("post",   rec.role || "【岗位/职务】", 3, true)));
    /* 第 3 行：天气 0（跨两行）值 1-2；风力 3（跨两行）值 4-5；最高温 6，值 7-9 */
    rows.push(R(M2(lab("天气")), M2(val("weather", W, 2)),
                M2(lab("风力")), M2(val("wind", WD, 2)),
                lab("最高温度（℃）"), val("temp_high", TH, 3)));
    /* 第 4 行：前 6 列已被上一行的跨行格占用，浏览器/表格模型会自动跳过，
       因此这里不需要再写空占位格，最低温自然落在第 7 列（与最高温同列） */
    rows.push(R(lab("最低温度（℃）"), val("temp_low", TL, 3)));
  }else{
    /* ===== 项目版：6 列等宽，字段对齐 Word 模板「质量日志-项目版-0918.docx」 =====
       r0 | 项目名称 | 中煤雄安科创园项目 | 日志编号 | 【系统自动生成】 | 日志日期 | 时间
       r1 | 天气（跨两行） | 值（跨两行） | 风力（跨两行） | 值（跨两行） | 最高温度（℃） | 值
       r2 |  天气/风力 仍占这两列  | 最低温度（℃） | 值
       ——「天气、晴、风力、东北风 2 级」四个格各自 rowspan=2，纵向合并两行 */
    const CELLS = 6;
    const head = [];
    /* 第 1 行 */
    head.push(R(lab("项目名称"), val("prj_name", PROJECT, 1, true),
                lab("日志编号"), val("log_no", "【系统自动生成】", 1, true),
                lab("日志日期"), val("log_date", cnDate(rec.date), 1, true)));
    /* 第 2 行：天气 / 风力 各占两行，右列放最高温度 */
    head.push(R(M2(lab("天气")), M2(val("weather", W, 1)),
                M2(lab("风力")), M2(val("wind", WD, 1)),
                lab("最高温度（℃）"), val("temp_high", TH, 1)));
    /* 第 3 行：前 4 列已被上一行的跨行格占用，这里只需放最低温度（跨行格会自动跳过） */
    head.push(R(lab("最低温度（℃）"), val("temp_low", TL, 1)));
    return TBN(CELLS, head);
  }
  return TBN(COLS, rows);
}

/* =========================================================================
   2. 汇总：父（项目版）从子（个人版）自动取数
   ========================================================================= */
function childDone(child){
  if(child.status === "done") return true;
  const d = child.data || {};
  return ["pp_plan_desc","pp_week_left","pp_issue","pq_today_summary","pq_yesterday","pq_current","pq_site","pq_tomorrow"].some(k => (d[k]||"").trim()) ||
         Object.keys(d).some(k => /^act\d+$/.test(k) && (d[k]||"").trim());
}
function aggregate(parent){
  const kids = (parent.children||[]);
  const valid = c => c.data || {};
  const done = kids.filter(childDone).length;

  /* 一 当日施工概况：以「本周施工计划执行情况」的行数据为准
     - 本周计划任务 = 计划行数
     - 截至当日已完成 = 已填「实际完成」的行数
     - 今日填报任务 = 已填「实际开始」的行数
     - 今日完成任务 = 当行完成率为 100% 的行数
     - 本周计划完成率 = 今日完成任务 / 计划任务 */
  const rows = parent.plan || [];
  const plan = rows.length;
  const doneActual = rows.filter(r => (r[4]||"").trim()).length;
  const started = rows.filter(r => (r[3]||"").trim()).length;
  const finished = rows.filter(r => {
    const m = /(\d+(?:\.\d+)?)\s*%?/.exec(r[5] || "");
    return m && Number(m[1]) >= 100;
  }).length;

  const book = kids.length;                                       // 在册 = 配置人数
  return {
    p_plan: plan, p_done: doneActual, p_fill: started, p_finish: finished,
    p_mgr: book, p_labor: 0,
    p_rate: pct2(finished, plan),
    mp_total_book: book, mp_total_att: done,
    eq_sum_t: "", eq_sum_u: "",
    iot_sum_t: "", iot_sum_o: "", iot_sum_a: "", iot_sum_p: ""
  };
}
/* 把一行里同名的取值格读出来（示例值也能被合计正确相加） */
function rowCellValue(parent, key){
  const spec = cellSpecByKey(parent, key);
  const v = parent && parent.data ? parent.data[key] : undefined;
  const raw = (v !== undefined && v !== null && v !== "") ? v : (spec ? spec.value : "");
  return (raw === "" || raw === undefined || raw === null) ? "" : raw;
}
/* 在四套 schema 里按键找格定义（用于取示例值兜底）
   注意区块有两种形态：{blocks:[TB(...)]} 和 {h:..., tbl:TB(...)}，都要遍历 */
function cellSpecByKey(parent, key){
  const secs = parent && parent.__isQuality ? schemaQualityProject() : schemaProject();
  const scanTable = (tb)=>{
    if(!tb || !tb.cols) return null;
    for(const row of tb.cols){
      for(const c of (row.cells||[])){
        if(c && c.key === key) return c;
      }
    }
    return null;
  };
  for(const sec of secs){
    if(sec && sec.tbl){
      const hit = scanTable(sec.tbl);
      if(hit) return hit;
    }
    for(const b of (sec.blocks||[])){
      if(!b) continue;
      if(b.cells || b.cols){
        const hit = scanTable(b);
        if(hit) return hit;
      }
    }
  }
  return null;
}
/* 对一组列求和：优先用真实数据，缺失则用示例值兜底 */
function sumColumns(parent, keys){
  let t = 0, has = false;
  for(const k of keys){
    let v = rowCellValue(parent, k);
    if(v === "" || v === null || v === undefined) v = autoExample({key:k, t:"n"});
    const n = Number(String(v).replace(/[^\d.\-]/g, ""));
    if(isFinite(n)){ t += n; has = true; }
  }
  return has ? String(t) : "";
}
function sumValue(parent, key){
  /* 按 schema 声明的列求和（人员投入 / 普通设备 / 物联设备合计） */
  const sumSpec = cellSpecByKey(parent, key);
  if(sumSpec && Array.isArray(sumSpec.sumOf) && sumSpec.sumOf.length){
    return sumColumns(parent, sumSpec.sumOf);
  }
  if(/^iot_sum_(t|o|a|p)$/.test(String(key))){
    const suffix = String(key).replace("iot_sum_","");
    const hidden = parent && parent.data && Array.isArray(parent.data.iot_hidden) ? parent.data.iot_hidden : [];
    let total = 0;
    for(let i=1;i<=10;i++){
      if(hidden.includes(i-1)) continue;
      total += Number(autoExample({key:`iot_${i}_${suffix}`,t:"n"}) || 0);
    }
    return String(total);
  }
  const a = aggregate(parent);
  return a[key] !== undefined ? String(a[key]) : "";
}

  return {id:`qchild_${parent.date}_${pid}`,parentId:parent.id,date:parent.date,personId:pid,personName:s.name,dept:s.dept,role:s.role,weather:parent.weather,wind:parent.wind,temp_high:parent.temp_high,temp_low:parent.temp_low,data:{pq_today_summary:"今日本人完成质量检查2次，发现问题4项，下发整改单2份；提交整改1份，完成整改单复查1份，其中整单闭环1份；今日发起质量处罚1份。",pq_yesterday:"昨日与本人相关的整改单2份，截至今日已闭环1份，待整改1份，待本人复查0份，继续整改0份。",pq_current:"截至2026年09月20日，本人累计完成质量检查12次，发现问题18项，涉及整改单7份；其中已闭环5份，当前未闭环2份，待本人复查1份，已逾期0份。"},status:"done",updatedAt:`${parent.date} 17:20`};
}
function makeChild(parent, pid, withData){
  const s = staffOf(pid);
  const child = {
    id:`child_${parent.date}_${pid}`, parentId:parent.id, date:parent.date,
    personId:pid, personName:s.name, dept:s.dept, role:s.role,

  };

      act6:`本人开展质量检查 2 次，发现问题 4 项，下发整改单 2 份。`
    };

/* 每日自动生成一条施工日志（项目版），并按人员配置生成子日志 */
function ensureDaily(quiet){
  let created = 0;
  // 补齐最近 7 天的缺失日期
  for(let i=0;i<7;i++){
    const date = shift(-i);
    if(!state.logs.some(r=>r.date===date)){
      const rec = { id:"parent_"+date, date, weather:"晴", wind:"东北风 2 级",
        temp_high:"26", temp_low:"15", data:{}, children:[], expanded:false, auto:true };
      rec.children = state.configured.map(pid => makeChild(rec, pid, false));
      state.logs.push(rec);
      created++;
    }
  }
  state.logs.sort((a,b)=> a.date < b.date ? 1 : -1);
  // 按人员配置同步子日志（保留已填内容，不删除历史填写）
  state.logs.forEach(rec=>{
    state.configured.forEach(pid=>{
      if(!rec.children.some(c=>c.personId===pid)) rec.children.push(makeChild(rec, pid, false));
    });
    rec.children.sort((a,b)=> state.configured.indexOf(a.personId) - state.configured.indexOf(b.personId));
  });
  if(created && !quiet) toast(`系统已自动生成 ${created} 天的施工日志`);
  save();
}
function ensureQualityDaily(){
  state.qualityLogs.sort((a,b)=>a.date<b.date?1:-1);
  for(let i=0;i<7;i++){
    const date=shift(-i);
    let rec=state.qualityLogs.find(r=>r.date===date);
    if(!rec){rec={id:"quality_"+date,date,weather:"晴",wind:"东北风 2 级",temp_high:"26",temp_low:"15",data:{},children:[],expanded:false,auto:true};state.qualityLogs.push(rec);}
    state.configured.forEach(pid=>{if(!rec.children.some(c=>c.personId===pid)) rec.children.push(makeQualityChild(rec,pid));});
  }
  save();
}

    el.checked = kids.length>0 && kids.every(c=>selItems.has(c.id));

}

   8. 表格渲染
   ========================================================================= */
const AUTO_RO = [];   // 需要强制只读的 key（本演示用 ro 标记，不再按 key 判断）
function renderTable(tb, opts){
  const edit = !!opts.edit;
  const parent = opts.parent || null;
  const plain = !!tb.plainHead;
  const head = plain ? null : tb.cols[0];
  const body = plain ? tb.cols : tb.cols.slice(1);
  const canDeleteRows = !!(edit && tb.rowDelete);
  const hiddenRows = (opts.data && Array.isArray(opts.data[`${tb.rowDeleteKey||"row"}_hidden`]))
    ? opts.data[`${tb.rowDeleteKey||"row"}_hidden`] : [];
  const hiddenSet = new Set(hiddenRows.map(Number));
  /* 行删除后要重排序号：找出表头里的「序号」列（用于把序号按可见行重编） */
  const seqCol = (()=>{
    const cells = head ? head.cells : (tb.cols[0] && tb.cols[0].cells) || [];
    for(let i=0;i<cells.length;i++){
      const t = String(cells[i].label || cells[i].value || "").trim();
      if(t === "序号") return i;
    }
    return -1;
  })();
  let seqNext = 1;

  let html = `<div class="tblwrap ${opts.className||""}"><table class="doc ${opts.className||""}">`;
  if(Array.isArray(tb.widths)) html += `<colgroup>${tb.widths.map(w=>`<col style="width:${esc(w)}">`).join("")}</colgroup>`;
  if(head){
    html += `<thead><tr>`;
    head.cells.forEach(c=>{
      const raw = (typeof c.label === "string" && c.label !== "") ? c.label
                : (typeof c.value === "string" ? c.value : "");
      const hsp = (c.span||1)>1 ? ` colspan="${c.span}"` : "";
      const hrsp = (c.rowspan||c.rowSpan||1)>1 ? ` rowspan="${c.rowspan||c.rowSpan}"` : "";
      html += `<th${hsp}${hrsp}>${esc(raw)}</th>`;
    });
    if(canDeleteRows) html += `<th>操作</th>`;
    html += `</tr></thead>`;
  }
  html += `<tbody>`;
  body.forEach((row,rowIndex)=>{
    if(tb.rowDelete && hiddenSet.has(rowIndex)) return;
    /* 序号按「可见行」重编：删掉中间行后，序号自动补上，不留空档 */
    const seqHere = (seqCol >= 0) ? seqNext++ : null;
    html += "<tr>";
    row.cells.forEach((c,ci)=>{
      const span = c.span||1;
      const sp = span>1 ? ` colspan="${span}"` : "";
      const rsp = (c.rowspan||c.rowSpan||1)>1 ? ` rowspan="${c.rowspan||c.rowSpan}"` : "";
      /* 序号列只改「纯数字」的序号格；合计行等非数字格保持原样 */
      if(ci === seqCol && seqHere !== null){
        const raw = (typeof c.label === "string" && c.label !== "") ? c.label
                  : (typeof c.value === "string" ? c.value : "");
        if(/^\d+$/.test(String(raw).trim())){
          html += `<td class="${c.label?"k":""}"${sp}${rsp}>${seqHere}</td>`;
          return;
        }
      }
      if(c.t==="kv" || c.t==="sp"){
        const isLabel = c.label !== "" && c.label !== undefined;
        const text = isLabel ? c.label : String(c.value ?? "");
        html += `<td class="${isLabel?"k":""}"${sp}${rsp}>${esc(text)}${c.unit?` ${esc(c.unit)}`:""}</td>`;
      }else if(c.t==="ro"){
        html += `<td class="c"${sp}${rsp}>${edit ? `<span class="auto-tag">${esc(c.label)}</span>` : esc(c.label)}</td>`;
      }else if(c.t==="sum"){
        const v = parent ? sumValue(parent, c.key) : "";
        html += `<td class="c"${sp}${rsp}>${renderSum(c,v,edit)}</td>`;
      }else{
        html += `<td class="${c.t==="n"?"c":""}"${sp}${rsp}>${renderField(c,edit,opts.data)}</td>`;
      }
    });
    if(canDeleteRows) html += rowIndex < body.length-1
      ? `<td class="c"><button type="button" class="row-delete" data-row-del="${esc(tb.rowDeleteKey||"row")}|${rowIndex}">删除</button></td>`
      : `<td class="c"></td>`;
    html += "</tr>";
  });
  html += "</tbody></table></div>";
  return html;
}

/* 汇总格：编辑页只读（由子日志汇总），生成页显示数值 */
function renderSum(c, v, edit){
  const txt = (v==="" || v===undefined || v===null) ? "0" : v;
  if(edit) return `<input class="fld ro" value="${esc(txt)}" readonly title="由当日子日志自动汇总">`;
  return `<span>${esc(txt)}</span>`;
}

function sourceInfo(c){
  if(c.source) return c.source;
  if(c.t==="sum") return "自动统计";
  if(c.t==="ro" || c.ro===true) return "系统自动带入";
  const k=String(c.key||"");
  if(k==="weather") return "天气接口";
  if(/^(prj_name|log_no|log_date|wind|temp_high|temp_low)$/.test(k)) return "系统自动带入";
  if(/^plan\d+_[a-e]$/.test(k) || /^sp\d+_[a-e]$/.test(k)) return "进度计划自动带入";
  if(/^plan\d+_f$/.test(k) || /^sp\d+_f$/.test(k)) return "手动填写";
  if(k==="q_desc" || /^q_(today_summary|yesterday_summary|current_note|tomorrow)$/.test(k) || /^pq_(today_summary|yesterday|current)$/.test(k)) return "业务模块自动带入";
  if(/^q_(check|issue|order|review|close|penalty|open|overdue)$/.test(k)) return "业务模块自动带入";
  if(/^(p_|q_|s_|pp_.*desc|week_left|pp_week_left)/.test(k) && c.t==="ta") return "系统固定语句（可调整）";
  if(/^(cons_issue|pp_issue|pq_site|q_site|q_coord|q_abn_)/.test(k)) return "手动填写";
  if(/^(mp_|mt_|mt\d|eq_|iot_|al\d|om_|mat_|m\d|i\d|qo\d|qr\d|qp\d|s_|so\d|sr\d|sp\d|dg_|dp\d|dr\d|tj)/.test(k)) return "业务模块自动带入";
  if(/^act\d+$/.test(k)) return "业务模块自动生成";
  if(c.t==="ta" && /(desc|summary|yesterday|current|tomorrow|week_left)/.test(k)) return "系统固定语句（可调整）";
  return "手动填写";
}
function sourceClass(info){
  if(info.includes("天气")) return "api";
  if(info.includes("固定语句")) return "fixed";
  if(info.includes("手动")) return "manual";
  return "auto";
}

  if(c.t==="f") return "系统自动带入示例";
  return "";
}

function renderField(c, edit, data){
  const raw = (data && data[c.key] !== undefined && data[c.key] !== null) ? data[c.key] : c.value;
  const info = sourceInfo(c);
  const auto = sourceClass(info)==="auto" || sourceClass(info)==="api";
  const val = (auto && (raw==="" || raw===undefined || raw===null)) ? autoExample(c) : raw;
  const isEmpty = val==="" || val===undefined || val===null;
  if(!edit){
    return `<span class="${isEmpty?"fill-empty":""}">${esc(isEmpty?"—":val)}${!isEmpty&&c.unit?` ${esc(c.unit)}`:""}</span>`;
  }
  const ro = c.ro === true || sourceClass(info)==="auto" || sourceClass(info)==="api";
  const cls = ro ? "fld ro" : "fld";
  if(c.t==="ta"){
    return `<textarea class="${cls}" data-k="${esc(c.key)}" rows="${c.rows||3}"
      ${ro?"readonly":""} placeholder="${esc(c.ph||"")}">${esc(val||"")}</textarea>`;
  }
  if(c.t==="sel"){
    const opts = (c.opts||[]).map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("");
    return `<select class="${cls}" data-k="${esc(c.key)}" ${ro?"disabled":""}>${opts}</select>`;
  }
  const input = `<input class="${cls}" data-k="${esc(c.key)}" value="${esc(val||"")}"
    ${ro?"readonly":""} placeholder="${esc(c.ph||"")}">`;
  return c.unit ? `<div class="unit-field">${input}<span class="fld-unit">${esc(c.unit)}</span></div>` : input;
}

function renderBlocks(blocks, edit, data, parent){
  let html = "";
  (blocks||[]).forEach(b=>{
    if(!b) return;
    if(b.note){ html += `<div class="kv-note">${esc(b.note)}</div>`; return; }
    if(b.sub){ html += `<div class="sec-h sub">${esc(b.sub)}</div>`; return; }
    if(b.tbl){ html += renderTable(b.tbl,{edit,data,parent}); return; }
    /* 直接写在 blocks 里的表格（TB(...)） */
    if(b.cols && b.t==="tb"){ html += renderTable(b,{edit,data,parent}); return; }
    /* 单个字段组成的整宽行，用单格表格承载 */
    html += `<div class="tblwrap"><table class="doc"><tbody><tr><td>${renderField(b,edit,data)}</td></tr></tbody></table></div>`;
  });
  return html;
}

   9. 编辑页
   ========================================================================= */
function renderEdit(){
  const parent = findParent(route.target);
  if(!parent){ go("ledger"); return; }
  const isChild = !!route.childId;
  const target = isChild ? findChild(parent, route.childId) : parent;
  if(!target){ go("ledger"); return; }
  const data = target.data || (target.data = {});

  const quality = route.module==="quality";
  let html = `<div class="docwrap">
    <div class="toolbar" style="margin-bottom:8px">
      <div class="count">${isChild?`<b>个人版（子）</b>　${esc(target.personName)}　·　${esc(target.date)}`
                                :`<b>项目版（父）</b>　·　${esc(target.date)}`}</div>
      <div><button class="ghost" id="topBack">← 返回台账</button>
           <button class="primary" id="topSave" style="margin-left:8px">保存日志</button></div>
    </div>
    <div class="legend">
      <span><i class="e"></i>输入框仍可编辑</span>
      <span><i class="r"></i>系统只读</span>
      ${isChild?"":'<span><i class="a"></i>由子日志自动汇总（不可手填）</span>'}
    </div>
    <div class="doc-title">${quality?(isChild?"个人质量日志":"质检员质量日志"):"表C1-5　施工日志"}</div>
    ${quality?"":`<div class="doc-sub">工程名称：${esc(PROJECT)}　　　　　　　　　编号：${esc(target.data.log_no||"")}</div>`}`;

  html += renderTable(quality?qualityHeaderCells(target,true,isChild):headerCells(target, true, isChild), {edit:true, data, parent, className:"doc-head"});
  if(!quality) html += `<div class="activity-label">主要施工、生产、质量、安全、技术、管理活动：</div>`;

  const secs = quality ? (isChild ? schemaQualityPersonal() : schemaQualityProject()) : (isChild ? schemaPersonal() : schemaProject());
  secs.forEach(sec=>{
    html += `<div class="sec-h">${esc(sec.h)}</div>`;
    html += renderBlocks(sec.blocks, true, data, parent);
    if(sec.plan) html += renderPlanTable(target, true);
    if(sec.tbl) html += renderTable(sec.tbl, {edit:true, data, parent});
  });

  html += `<div class="savbar">
      <button class="ghost" id="cancelEdit">取消</button>
      <button class="primary" id="saveEdit">保存日志</button>
    </div></div>`;
  $("#content").innerHTML = html;

  /* 物联设备表允许删除单行：先弹确认，确认后重排；删除只写当前日志的隐藏标记，
     源业务数据不删，合计按剩余设备行重算。 */
  document.querySelectorAll("[data-row-del]").forEach(el=>el.onclick=()=>{
    const parts = String(el.dataset.rowDel||"").split("|");
    const key = parts[0] || "row";
    const idx = Number(parts[1]);
    const tbl = el.closest("table");
    const tr = el.closest("tr");
    /* 取该行「设备类型」，用于确认提示 */
    let devName = "";
    if(tr){
      const tds = [...tr.querySelectorAll("td")];
      if(tds.length > 1){
        const cell = tds[1];
        const inp = cell.querySelector("input,select,textarea");
        devName = ((inp && inp.value) || cell.textContent || "").trim();
      }
    }
    const title = (key === "iot") ? "删除设备运行情况" : "删除该行";
    const ask = (key === "iot")
      ? `是否删除设备类型「${devName || "（未选择）"}」的运行情况？<br><span style="color:#7d8ca2">删除后合计按剩余设备行重算，序号自动重排；可点「取消」不做任何改动。</span>`
      : `是否删除该行？<br><span style="color:#7d8ca2">删除后合计按剩余行重算，序号自动重排。</span>`;
    openModal(title,
      `<p style="margin:0 0 6px;line-height:1.8">${ask}</p>`,
      `<button class="ghost" id="rowDelCancel">取消</button>
       <button class="primary" id="rowDelOk" style="background:#e94655;border-color:#e94655">确认删除</button>`);
    $("#rowDelCancel").onclick = closeModal;
    $("#rowDelOk").onclick = ()=>{
      closeModal();
      /* 只记录「被隐藏的原始行号」，不删除源数据 */
      const hiddenKey = `${key}_hidden`;
      const hidden = Array.isArray(data[hiddenKey]) ? data[hiddenKey].slice() : [];
      if(!hidden.includes(idx)) hidden.push(idx);
      data[hiddenKey] = hidden;
      /* 重排序号：先把当前表单值收回来，再整体重渲染（隐藏行自动跳过并重编序号） */
      if(typeof collect === "function") collect();
      renderEdit();
      toast((key === "iot" ? "已删除该设备运行情况，" : "已删除该行，") + "序号已重排");
    };
  });

  /* 必填校验：标了 data-req="1" 的控件不能为空；返回 { ok, empty:[元素] } */
  function validateRequired(){
    const empty = [];
    document.querySelectorAll('[data-req="1"]').forEach(el=>{
      const v = (el.value || "").trim();
      el.classList.toggle("fld-invalid", v === "");
      if(v === "") empty.push(el);
    });
    return { ok: empty.length === 0, empty };
  }
  window.__validateEdit = validateRequired;

  function collect(){
    document.querySelectorAll("[data-k]").forEach(el=>{ data[el.dataset.k] = el.value; });
    /* 本周施工计划执行情况：按行收集 */
    const rows = target.plan || (target.plan = []);
    document.querySelectorAll("[data-row][data-col]").forEach(el=>{
      const ri = Number(el.dataset.row), ci = Number(el.dataset.col);
      if(!rows[ri]) rows[ri] = newPlanRow();
      rows[ri][ci] = el.value;
    });
    if(data.weather) target.weather = data.weather;
    if(data.wind) target.wind = data.wind;
    if(data.temp_high) target.temp_high = data.temp_high;
    if(data.temp_low) target.temp_low = data.temp_low;
  }
  window.__collectEdit = collect;

  /* 计划行：增加 / 删除（先生成当前表单值，避免丢失其它输入） */
  document.querySelectorAll("[data-plan-add]").forEach(btn=>btn.onclick=()=>{
    collect();
    if(!target.plan) target.plan = [];
    target.plan.push(newPlanRow());
    save(); renderEdit(); toast("已增加一行，请选择工序并填写");
  });
  document.querySelectorAll("[data-plan-del]").forEach(btn=>btn.onclick=()=>{
    collect();
    target.plan.splice(Number(btn.dataset.planDel), 1);
    save(); renderEdit(); toast("已删除该行");
  });
  /* 在最后一行的说明里按回车，快速续行 */
  document.querySelectorAll('[data-col="6"]').forEach(el=>{
    el.addEventListener("keydown", ev=>{
      if(ev.key === "Enter" && !ev.shiftKey){
        ev.preventDefault();
        const ri = Number(el.dataset.row);
        collect();
        if(ri === (target.plan||[]).length - 1) target.plan.push(newPlanRow());
        save(); renderEdit();
      }
    });
  });
  function doSave(){
    collect();
    /* 必填校验通过才允许保存 */
    const v = validateRequired();
    if(!v.ok){
      const first = v.empty[0];
      if(first && first.scrollIntoView) first.scrollIntoView({block:"center"});
      toast(`还有 ${v.empty.length} 处必填项未填写，请补齐后再保存`);
      return;
    }
    if(isChild){ target.status = "done"; }
    target.updatedAt = new Date().toLocaleString("zh-CN",{hour12:false});
    save(); toast("日志已保存"); go("ledger");
  }
  $("#cancelEdit").onclick = ()=>go("ledger");
  $("#topBack").onclick = ()=>go("ledger");
  $("#saveEdit").onclick = doSave;
  $("#topSave").onclick = doSave;
}

/* =========================================================================
   11. 导出：在原模板上只替换文字，生成带数据的 .docx
   -------------------------------------------------------------------------
   LOG_TEMPLATES 里是用户指定的四个原模板文件（原封不动内嵌）。
   导出时：解 zip → 用 DOMParser 解析 word/document.xml →
   按「表 / 行 / 列」把文字写进对应单元格 → 重新打包 → 落盘。
   版式、样式、页边距、分页全部沿用原文件，只改文字。
   ========================================================================= */
const MIME_DOCX = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
const W_NS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const XML_NS = "http://www.w3.org/XML/1998/namespace";

function templateKeyOf(isQuality, isChild){
  return (isQuality ? "qual" : "cons") + (isChild ? "_pers" : "_proj");
}

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

/* ---------- zip 读（原模板里的条目是 deflate 压缩的，用 DecompressionStream 解） ---------- */
async function inflateRaw(bytes){
  if(bytes.length === 0) return new Uint8Array(0);
  if(typeof DecompressionStream === "undefined")
    throw new Error("浏览器不支持 DecompressionStream，无法解压模板");
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzipAll(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  for(let i = bytes.length - 22; i >= 0 && i >= bytes.length - 66000; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("不是合法的 zip");
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const files = [];
  for(let i=0;i<count;i++){
    if(dv.getUint32(off, true) !== 0x02014b50) throw new Error("中央目录异常");
    const method = dv.getUint16(off + 10, true);
    const csize  = dv.getUint32(off + 20, true);
    const nlen   = dv.getUint16(off + 28, true);
    const elen   = dv.getUint16(off + 30, true);
    const clen   = dv.getUint16(off + 32, true);
    const lho    = dv.getUint32(off + 42, true);
    const name   = new TextDecoder().decode(bytes.subarray(off + 46, off + 46 + nlen));
    const lnlen  = dv.getUint16(lho + 26, true);
    const lelen  = dv.getUint16(lho + 28, true);
    const start  = lho + 30 + lnlen + lelen;
    const raw    = bytes.subarray(start, start + csize);
    files.push({ name, method, raw });
    off += 46 + nlen + elen + clen;
  }
  for(const f of files){
    f.data = (f.method === 8) ? await inflateRaw(f.raw) : f.raw;
  }
  return files;
}

/* ---------- zip 写（全部用不压缩存储，兼容性最好） ---------- */
function zipStore(files){
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;

  const table = (()=>{
    const t = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; }
    return t;
  })();
  const crc32 = (buf)=>{
    let c = 0xFFFFFFFF;
    for(let i=0;i<buf.length;i++) c = table[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };

  files.forEach(f=>{
    const nameB = enc.encode(f.name);
    const data = f.bytes;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nameB.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0x2821, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameB.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameB, 30);
    chunks.push(lh, data);

    const ch = new Uint8Array(46 + nameB.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x2821, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameB.length, true);
    cv.setUint32(42, offset, true);
    ch.set(nameB, 46);
    central.push(ch);
    offset += lh.length + data.length;
  });

  const cdStart = offset;
  let cdSize = 0;
  central.forEach(c=>{ chunks.push(c); cdSize += c.length; });
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, cdStart, true);
  chunks.push(eocd);

  const total = chunks.reduce((s,c)=>s+c.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  chunks.forEach(c=>{ out.set(c, p); p += c.length; });
  return out;
}

/* ---------- 在 document.xml 上按「表/行/列」写文字 ---------- */
function tl(el){ return el.getElementsByTagNameNS(W_NS, "t"); }
function tbs(root){ return root.getElementsByTagNameNS(W_NS, "tbl"); }
function trs(tbl){ return tbl.getElementsByTagNameNS(W_NS, "tr"); }
function tcs(tr){ return tr.getElementsByTagNameNS(W_NS, "tc"); }

function setc(root, ti, ri, ci, text){
  const tbl = tbs(root)[ti]; if(!tbl) return false;
  const tr = trs(tbl)[ri];   if(!tr) return false;
  const tc = tcs(tr)[ci];    if(!tc) return false;
  const ps = tc.getElementsByTagNameNS(W_NS, "p");
  if(!ps.length){
    const p = root.ownerDocument.createElementNS(W_NS, "w:p");
    tc.appendChild(p);
  }
  // 只保留第一个段落，避免多次写入叠加
  const keep = ps[0];
  for(let i=ps.length-1;i>=1;i--) ps[i].parentNode.removeChild(ps[i]);
  const ts = tl(keep);
  if(ts.length){
    ts[0].textContent = text==null ? "" : String(text);
    ts[0].setAttributeNS(XML_NS, "xml:space", "preserve");
    for(let i=1;i<ts.length;i++) ts[i].textContent = "";
  }else{
    const r = root.ownerDocument.createElementNS(W_NS, "w:r");
    const t = root.ownerDocument.createElementNS(W_NS, "w:t");
    t.setAttributeNS(XML_NS, "xml:space", "preserve");
    t.textContent = text==null ? "" : String(text);
    r.appendChild(t); keep.appendChild(r);
  }
  return true;
}
function setrow(root, ti, ri, values, start){
  start = start || 0;
  values.forEach((v,k)=>{ if(v !== null && v !== undefined) setc(root, ti, ri, start+k, v); });
}
function clearrow(root, ti, ri, n, start){
  start = start || 0;
  for(let i=0;i<n;i++) setc(root, ti, ri, start+i, "");
}

/* ---------- 数据 → 写入指令（与 patch_template.py 的表/行/列一一对应） ---------- */
function d0(v){ return (v===undefined||v===null||v==="") ? "" : v; }
/* 台账里没有的项：人工填写处显示「【未填写】」，自动统计处留空 */
const NOT_FILLED = "【未填写】";

function fillConsPers(root, rec){
  const d = rec.data || {};
  setc(root,0,0,1,d0(rec.dateCn)); setc(root,0,0,3,d0(rec.weather));
  setc(root,0,0,5,d0(rec.wind));  setc(root,0,0,7,d0(rec.tempHigh));
  setc(root,0,1,7,d0(rec.tempLow)); setc(root,0,4,1,d0(rec.recorder));
  const plan = rec.plan || [];
  for(let i=0;i<6;i++){
    const r = plan[i];
    if(!r){ clearrow(root,1,i+1,6,2); continue; }
    setrow(root,1,i+1,[d0(r[1]),d0(r[2]),d0(r[3]),d0(r[4]),d0(r[5]),d0(r[6])],2);
  }
  for(let i=0;i<11;i++){
    const v = d0(d["act"+(i+1)]).trim();
    setc(root,2,i+1,2, v || NOT_FILLED);
  }
  setc(root,3,0,0, d0(d.pp_week_left).trim() || `${NOT_FILLED}`);
  setc(root,4,0,0, d0(d.pp_issue).trim());
}

  setrow(root,13,1,["q_check","q_issue","q_order","q_review"].map(k=>d0(d[k])));
  setrow(root,13,3,["q_close","q_penalty","q_open","q_overdue"].map(k=>d0(d[k])));
  clearrow(root,14,1,7); clearrow(root,15,1,8); clearrow(root,16,1,6);
  setrow(root,17,1,["s_check","s_issue","s_order","s_review"].map(k=>d0(d[k])));
  setrow(root,17,3,["s_close","s_penalty","s_open","s_overdue"].map(k=>d0(d[k])));
  clearrow(root,18,1,7); clearrow(root,19,1,8); clearrow(root,20,1,6);
  setrow(root,21,1,["dg_proj","dg_patrol","dg_risk","dg_order","dg_open","dg_overdue"].map(k=>d0(d[k])));
  clearrow(root,22,1,4,1); clearrow(root,22,2,4,1);
  clearrow(root,23,1,8,1); clearrow(root,23,2,8,1);
  setrow(root,24,1,[d0(d.tj_times),d0(d.tj_plan)]);
  clearrow(root,25,1,3,1); clearrow(root,25,2,3,1);
  setc(root,26,0,0, d0(d.week_left).trim() || d0(d.pp_week_left));
  setc(root,27,0,0, d0(d.cons_issue).trim());
}

function fillQualPers(root, rec){
  const d = rec.data || {};
  /* 一 基本信息 */
  setc(root,0,0,1,d0(rec.project)); setc(root,0,0,3,d0(rec.logNo));
  setc(root,0,1,1,d0(rec.dateCn)); setc(root,0,1,3,d0(rec.person)); setc(root,0,1,5,d0(rec.post));
  setc(root,0,2,1,d0(rec.weather)); setc(root,0,2,3,d0(rec.wind)); setc(root,0,2,5,d0(rec.tempHigh));
  setc(root,0,3,5,d0(rec.tempLow)); setc(root,11,0,1,d0(rec.recorder));
  /* 二 今日个人质量概况：概况文字（自动生成）+ 统计格留空 */
  setc(root,1,0,0,d0(d.pq_today_summary));   /* 以整行合并格承载概况文字 */
  for(let i=0;i<7;i++) setc(root,1,1,i,"");
  /* 三 明细：台账无明细数据 → 人工填写处标【未填写】 */
  [2,3,4,5,6,7,9].forEach(ti=>{
    const n = tcs(trs(tbs(root)[ti])[1]).length;
    for(let c=0;c<n;c++) setc(root,ti,1,c,NOT_FILLED);
  });
  /* 四 责任状态：概况文字 + 累计格留空 */
  setc(root,10,1,0, d0(d.pq_tomorrow).trim());
  setc(root,10,1,1, d0(d.pq_site).trim());
}

function fillQualProj(root, rec){
  const d = rec.data || {};
  setc(root,0,0,1,d0(rec.project)); setc(root,0,0,3,d0(rec.logNo)); setc(root,0,0,5,d0(rec.dateCn));
  setc(root,0,1,1,d0(rec.weather)); setc(root,0,1,3,d0(rec.wind)); setc(root,0,1,5,d0(rec.tempHigh));
  setc(root,0,2,5,d0(rec.tempLow)); setc(root,8,0,1,d0(rec.recorder));
  for(let i=0;i<8;i++) setc(root,1,1,i,"");
  setc(root,7,1,0, d0(d.q_site).trim());
  setc(root,7,1,1, d0(d.q_coord).trim());
}

const FILLERS = { cons_pers: fillConsPers, cons_proj: fillConsProj,
                  qual_pers: fillQualPers, qual_proj: fillQualProj };

/* ---------- 从台账记录取数 ---------- */
function findLogRecord(id){
  const pools = [{rows: state.logs||[], quality:false}, {rows: state.qualityLogs||[], quality:true}];
  for(const pool of pools){
    for(const parent of pool.rows){
      if(parent.id === id) return {rec: parent, parent, isChild:false, quality: pool.quality};
      const kid = (parent.children||[]).find(c=>c.id===id);
      if(kid) return {rec: kid, parent, isChild:true, quality: pool.quality};
    }
  }
  return null;
}

let __fillMeta = {};
function setFillMeta(meta){ __fillMeta = meta || {}; }

/* 把一条记录整理成补丁需要的字段 */
function recordFor(rec, isChild, parent){
  const d = rec.data || {};
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(rec.date || "");
  const dateCn = m ? `${m[1]}年${m[2]}月${m[3]}日` : (rec.date || "");
  const base = {
    dateCn, weather: rec.weather || "", wind: rec.wind || "",
    tempHigh: rec.temp_high || "", tempLow: rec.temp_low || "",
    recorder: rec.recorder || "",
    project: PROJECT, logNo: "【系统自动生成】",
    person: rec.personName || "", post: rec.role || "",
    plan: rec.plan || [], data: d
  };
  base.childCount = (parent && parent.children ? parent.children.length : 0);
  base.childDone  = (parent && parent.children ? parent.children.filter(childDone).length : 0);
  return base;
}

async function exportOne(id){
  const hit = findLogRecord(id);
  if(!hit) return null;
  const key = templateKeyOf(hit.quality, hit.isChild);
  const tpl = LOG_TEMPLATES[key];
  if(!tpl) return null;

  const base = recordFor(hit.rec, hit.isChild, hit.parent);
  const meta = __fillMeta[key] || null;

  const files = await unzipAll(b64ToBytes(tpl.b64));
  const outFiles = [];
  for(const f of files){
    if(f.name === "word/document.xml"){
      let xml = new TextDecoder().decode(f.data);
      const doc = new DOMParser().parseFromString(xml, "application/xml");
      const root = doc.documentElement || (doc.childNodes && doc.childNodes[0]);
      if(!root || String(root.nodeName||"").toLowerCase() === "parsererror")
        throw new Error("模板 document.xml 解析失败");
      /* 补齐只有数据层才知道的业务字段 */
      if(meta) Object.assign(base, meta);
      FILLERS[key](root, base);
      const out = new XMLSerializer().serializeToString(doc);
      outFiles.push({ name: f.name, bytes: new TextEncoder().encode(out) });
    }else{
      outFiles.push({ name: f.name, bytes: f.data });
    }
  }
  const zipBytes = zipStore(outFiles);
  const who = hit.isChild ? `_${hit.rec.personName||""}` : "";
  const typeName = `${hit.quality?"质量":"施工"}日志_${hit.isChild?"个人版":"项目版"}`;
  return { fileName: `${hit.rec.date}_${typeName}${who}.docx`, bytes: zipBytes };
}

function saveBytes(fileName, bytes){
  const blob = new Blob([bytes], {type: MIME_DOCX});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

async function exportLogs(ids){
  let ok = 0, miss = 0;
  for(let i=0;i<ids.length;i++){
    let out = null;
    try { out = await exportOne(ids[i]); } catch(e){ out = null; }
    if(!out){ miss++; continue; }
    const o = out;
    setTimeout(()=>saveBytes(o.fileName, o.bytes), ok * 260);
    ok++;
  }
  if(ok) toast(`已导出 ${ok} 个带数据的 Word 日志（沿用原模板版式）`);
  else toast("没有可导出的日志");
  if(miss) setTimeout(()=>toast(`有 ${miss} 条导出失败`), 1600);
}

  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2000);
}
