<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#43516a;background:#fff}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#process{min-height:100vh;position:relative;display:grid;grid-template-columns:250px minmax(0,1fr);font-size:14px}#process .groups{padding:24px 15px 24px 20px;border-right:1px solid #e7edf5}#process .group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;color:#1d2b3e;font-size:16px;font-weight:700}#process .group-head button{border:0;border-radius:4px;background:#2387f6;color:#fff;width:38px;height:36px;font-size:23px}#process .group-item{width:100%;border:0;background:#fff;display:flex;align-items:center;gap:8px;text-align:left;padding:11px 12px 11px 24px;color:#33465e;white-space:nowrap}#process .group-item.active{background:#eaf4ff}#process .group-root{font-weight:700;padding-left:12px}#process .group-children .group-item{padding-left:30px}#process .group-children{display:block}#process .group-item .label{overflow:hidden;text-overflow:ellipsis;flex:1}#process .group-item .count{color:#6c7b8d}#process .workspace{min-width:0;padding:22px 24px}#process .toolbar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}#process .search{height:40px;width:260px;max-width:100%;border:1px solid #d9e0e9;border-radius:4px;padding:0 12px}#process .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#process .control{height:40px;padding:0 14px;border:1px solid #d7e0ea;border-radius:4px;background:#fff;color:#52667d;white-space:nowrap}#process .primary{background:#2387f6;border-color:#2387f6;color:#fff}#process .link{border:0;background:transparent;color:#1785fa;padding:5px;white-space:nowrap}#process .link:hover{text-decoration:underline}#process .danger{color:#e95d68!important}#process .grid{overflow:auto}#process table{width:100%;border-collapse:collapse;white-space:nowrap;table-layout:auto}#process th{background:#f3f4f6;color:#334457;text-align:left;font-size:14px;font-weight:700;padding:15px 12px}#process td{border-bottom:1px solid #e6ebf1;padding:13px 12px;height:58px}#process tr:hover td{background:#fafcff}#process .check{width:25px}#process .file-icon{color:#158af9;font-size:20px;margin-right:8px}#process .file-name{border:0;background:transparent;color:#3d4a5a;padding:0;text-align:left}#process .file-name:hover{color:#1785fa}#process .tag{display:inline-block;font-size:12px;color:#2880df;background:#eaf4ff;padding:2px 6px;margin-left:7px}#process .empty{padding:80px 10px;text-align:center;color:#8794a4}#process .menu{position:fixed;z-index:20;min-width:195px;padding:6px 0;border:1px solid #e6ebf2;border-radius:4px;background:#fff;box-shadow:0 8px 26px #1b2f4c30}#process .menu button{display:block;width:100%;padding:10px 16px;border:0;background:#fff;text-align:left;color:#40516a}#process .menu button:hover{background:#ecf5ff;color:#1785fa}#process .overlay{position:fixed;inset:0;z-index:30;background:#17263d80;display:flex;justify-content:center;align-items:flex-start;padding:10vh 18px 20px;overflow:auto}#process .dialog{width:min(700px,100%);background:#fff;border-radius:6px;box-shadow:0 16px 40px #1527443d}#process .dialog.wide{width:min(1050px,100%)}#process .dialog-head{height:61px;border-bottom:1px solid #e5e9ef;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:18px;color:#1d2c40}#process .dialog-head button{font-size:24px;background:none;border:0;color:#8a98a8}#process .dialog-body{padding:22px 28px;max-height:68vh;overflow:auto}#process .dialog-foot{border-top:1px solid #e5e9ef;display:flex;justify-content:flex-end;gap:10px;padding:14px 28px}#process .field{display:grid;grid-template-columns:125px 1fr;gap:10px;align-items:center;margin-bottom:16px}#process .field input,#process .field select{height:40px;border:1px solid #d7dfe9;border-radius:4px;padding:0 10px;min-width:0;width:100%}#process .note{color:#8b98a8;font-size:12px;line-height:1.7}#process .error{color:#dc5260;margin:8px 0}#process .record-tabs{display:flex;gap:28px;border-bottom:1px solid #e0e4eb;margin-bottom:18px}#process .record-tabs button{border:0;background:#fff;padding:8px 0;color:#4d5d72}#process .record-tabs button.active{color:#1688f8;border-bottom:2px solid #1688f8}#process .record-table{border:1px solid #c9dcf7;min-height:270px;overflow:auto}#process .record-table th,#process .record-table td{text-align:center;border-right:1px solid #c9dcf7;border-bottom:1px solid #c9dcf7}#process .record-table th{background:#fbfcff}#process .record-table tr>*:last-child{border-right:0}#process .qr{text-align:center;margin:18px 0}#process .qr svg{width:190px;height:190px}#process .preview{width:100%;max-height:390px;background:#1c2634}#process .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:50;background:#263d55;color:#fff;padding:10px 18px;border-radius:4px}#process .placeholder{text-align:center;padding:90px 20px;background:#f4f7fb;color:#7e8b9e}
#process .dialog.qr-dialog{width:min(430px,100%)}#process .qr-dialog .dialog-body{padding:0;background:#f7f9fc}#process .qr-poster{position:relative;width:360px;max-width:100%;min-height:515px;margin:0 auto;padding:30px 24px 24px;text-align:center;color:#123b75;background:linear-gradient(160deg,#fff 0 58%,#f4f8fd 100%);overflow:hidden}#process .qr-brand-mark{position:absolute;right:20px;top:18px;color:#2071bb;font-weight:800;font-size:19px;line-height:1}#process .qr-brand-mark small{display:block;margin-top:3px;font-size:7px;letter-spacing:1px}#process .qr-title{font-size:30px;font-weight:800;letter-spacing:2px;color:#1670bd}#process .qr-project{margin-top:4px;font-size:19px;color:#1773c7}#process .qr-skyline{height:83px;margin:4px -8px -7px;color:#78a4d4}#process .qr-skyline svg{width:100%;height:100%}#process .qr-scan{position:relative;z-index:1;font-size:12px;color:#1d2f44}#process .qr-code-shell{position:relative;width:198px;height:198px;margin:4px auto 13px;padding:9px;background:#fff;border:1px solid #dde4ec;border-radius:4px;box-shadow:0 2px 7px #273a5518}#process .qr-code-shell .qr{padding:0;margin:0}#process .qr-code-shell .qr svg{width:178px!important;height:178px!important}#process .qr-center-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:35px;height:35px;display:grid;place-items:center;border:4px solid #fff;border-radius:50%;background:#2177be;color:#fff;font-weight:800;font-size:12px;pointer-events:none}#process .qr-separator{display:flex;align-items:center;gap:9px;color:#27384e;font-size:11px}#process .qr-separator:before,#process .qr-separator:after{content:'';height:1px;flex:1;background:#9faebb}#process .qr-resource{margin:10px auto 0;min-height:62px;padding:14px 18px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#e8f3ff;box-shadow:0 3px 9px #33557a24;color:#172c44;font-size:16px;font-weight:700;line-height:1.45}#process .qr-footnote{margin-top:10px;color:#6c7d90;font-size:10px}#process .bulk-poster-list{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:center}#process .bulk-poster-list .qr-poster{width:340px}
@media(max-width:900px){#process{grid-template-columns:190px minmax(0,1fr)}#process .workspace{padding:16px}}@media(max-width:600px){#process{display:block}#process .groups{border-right:0;border-bottom:1px solid #e7edf5;padding:14px}#process .group-list{display:flex;overflow:auto}#process .group-item{width:auto;flex:none;padding:9px 12px}#process .toolbar{align-items:stretch}#process .tools{gap:5px}#process .control{padding:0 9px}#process .field{grid-template-columns:1fr}#process .qr-poster{width:100%}}

#process .dialog.records{width:min(1080px,100%)}#process .record-tabs{display:flex;gap:38px;border-bottom:1px solid #d7dce5;margin:0 0 20px}#process .record-tabs button{border:0;border-radius:0;padding:4px 0 10px;background:none;color:#3e4b5b;font-size:16px}#process .record-tabs button.active{color:#287efa;border-bottom:2px solid #287efa}#process .record-tools{display:flex;align-items:center;gap:16px;margin:0 0 24px;min-height:40px}#process .record-tools input{width:min(500px,100%);min-width:0;height:40px;padding:0 12px;border:1px solid #d9e0e9;border-radius:4px}#process .record-grid{border:1px solid #c9ddff;min-height:320px;overflow:auto}#process .record-grid table{width:100%;min-width:420px;table-layout:auto;border-collapse:collapse;white-space:nowrap}#process .record-grid th,#process .record-grid td{text-align:center;height:50px;padding:10px;border-right:1px solid #c9ddff;border-bottom:1px solid #c9ddff;font-size:14px}#process .record-grid th{background:#f9fbff;color:#3e4958;font-weight:600}#process .record-grid tr>*:last-child{border-right:0}#process .record-grid tbody tr:last-child td{border-bottom:0}#process .record-empty{min-height:300px;display:flex;align-items:center;justify-content:center;color:#929aa5;gap:10px}#process .record-empty span{font-size:28px;color:#9ba9b8}#process .record-grid .count-link{color:#287efa;background:transparent;border:0}@media(max-width:650px){#process .record-tabs{gap:15px}#process .record-tabs button{font-size:13px}#process .dialog.records .dialog-body{padding:15px}}
</style>
<style>#process .dialog.records{width:min(1080px,100%)}#process .record-tools input{min-width:0;height:40px;padding:0 12px;border:1px solid #d9e0e9;border-radius:4px}@media(max-width:650px){#process .dialog.records .record-grid table{min-width:0;table-layout:fixed}#process .dialog.records .record-grid th,#process .dialog.records .record-grid td{padding:8px 4px;font-size:12px;white-space:normal;overflow-wrap:anywhere}#process .dialog.records .record-grid th:first-child{width:12%}#process .dialog.records .record-grid th:nth-child(2){width:22%}#process .dialog.records .record-grid th:nth-child(3){width:40%}#process .dialog.records .record-grid th:nth-child(4){width:26%}}</style><style>#process .card-view{overflow:visible}#process .card-selection{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px;color:#7b8798;font-size:13px}#process .card-selection label{display:flex;align-items:center;gap:7px;color:#43516a}#process .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}#process .process-card{position:relative;min-width:0;padding:16px;border:1px solid #e5eaf2;border-radius:4px;background:white}#process .process-card.selected{border-color:#2387f6;background:#f4f8ff}#process .card-check{position:absolute;left:10px;top:10px;margin:0;z-index:1}#process .thumb{display:grid;place-items:center;width:100%;height:110px;margin:0 0 12px;border:1px solid #e5eaf2;border-radius:3px;background:#f5f8fc;color:#2387f6}#process .thumb:hover{background:#eaf3ff}#process .video-mark{display:grid;place-items:center;width:58px;height:58px;border:2px solid #90b2df;border-radius:50%;background:#e1edfc;font-size:25px}#process .card-name{display:block;width:100%;min-height:40px;white-space:normal;overflow-wrap:anywhere;line-height:1.45;color:#347dff}#process .card-meta{margin:9px 0;color:#919aaa;font-size:12px;line-height:1.5;overflow-wrap:anywhere}#process .card-actions{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}#process #view-toggle[aria-pressed="true"]{border-color:#2387f6;color:#2387f6;background:#eef6ff}@media(max-width:600px){#process .cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}</style></head>
<body>
<div id="process">
  <aside class="groups"><div class="group-head"><span>分组名称</span><button type="button" id="add-group" aria-label="新建分组">＋</button></div><div class="group-list" id="group-list"></div></aside>
  <main class="workspace"><div class="toolbar"><input class="search" id="search" placeholder="按照关键词搜索" aria-label="搜索工艺文件"><div class="tools"><span class="note" id="upload-tip" style="margin-right:8px" hidden>请选择左侧分组　</span><button class="control" id="view-toggle" type="button" aria-label="切换为卡片视图" aria-pressed="false">▦ 卡片</button><button class="control primary" id="upload">▣ 上传文件</button><button class="control" id="batch-download" disabled>↓ 下载</button><button class="control" id="batch-qr" disabled>▦ 打印/导出二维码</button><button class="control" id="batch-move" disabled>➜ 移动到</button><button class="control" id="batch-delete" disabled>♧ 删除</button></div></div><div class="grid" id="list"></div><input id="file-input" type="file" accept="video/mp4,video/webm,.mp4,.webm" multiple hidden></main>
  <div id="popover"></div><div id="modal"></div><div id="toast" aria-live="polite"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(()=>{'use strict';
const root=document.getElementById('process'),$=s=>root.querySelector(s),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groupNames=['混凝土浇筑展示','梁柱节点拦网展示','地下室后浇带做法展示','压头防水做法展示'];
const files=['混凝土浇筑.mp4','砌体结构施工工艺动画模拟.mp4','三桩承台混凝土浇筑施工工艺.mp4','无梁楼盖柱帽模板施工.mp4','石材幕墙做法.mp4','预制楼梯吊装演示.mp4','基坑开挖支护全过程施工动画.mp4'];
let group='全部',query='',card=false,nextId=11,selected=new Set(),items=files.map((name,i)=>({id:i+1,name,group:groupNames[0],by:i?'系统管理员':'刘耀宇',size:[95.15,7.23,9.64,16.13,7.06,25.6,19.29][i],date:i?'2025-10-20 15:20:0'+i:'2024-10-13 21:28:41',type:'mp4',file:null,shares:[],views:[],bim:[]}));
['梁柱节点拦网','地下室后浇带','压头防水'].forEach((name,i)=>items.push({id:8+i,name:name+'.mp4',group:groupNames[i+1],by:'系统管理员',size:8+i,date:'2025-10-20 15:30:00',type:'mp4',file:null,shares:[],views:[],bim:[]}));
let popId=null,toastTimer;
function now(){return new Date().toLocaleString('sv-SE').slice(0,19)}
function notify(message){clearTimeout(toastTimer);$('#toast').innerHTML='<div class="toast">'+escape(message)+'</div>';toastTimer=setTimeout(()=>$('#toast').innerHTML='',3000)}
function closeMenu(){popId=null;$('#popover').innerHTML=''}
function closeDialog(){$('#modal').innerHTML=''}
function dialog(title,body,footer='',wide=false){closeMenu();$('#modal').innerHTML='<div class="overlay"><section class="dialog '+(wide?'wide':'')+'" role="dialog" aria-modal="true" aria-label="'+escape(title)+'"><div class="dialog-head">'+escape(title)+'<button id="dialog-close" aria-label="关闭">×</button></div><div class="dialog-body">'+body+'</div>'+(footer?'<div class="dialog-foot">'+footer+'</div>':'')+'</section></div>';$('#dialog-close').onclick=closeDialog;const cancel=$('#cancel');if(cancel)cancel.onclick=closeDialog}
const cancel='<button class="control" id="cancel">取消</button>',save='<button class="control primary" id="save">确定</button>';
function current(){return items.filter(x=>(group==='全部'||x.group===group)&&x.name.toLowerCase().includes(query))}
function processActions(x){
 return '<button class="link" data-action="rename" data-id="'+x.id+'">重命名</button><button class="link" data-action="download" data-id="'+x.id+'">下载</button><button class="link danger" data-action="delete" data-id="'+x.id+'">删除</button><button class="link" data-action="menu" data-id="'+x.id+'">更多⌄</button>';
}
function render(){
 const shown=current(),checked=shown.filter(x=>selected.has(x.id)).length,all=!!shown.length&&checked===shown.length;
 $('#group-list').innerHTML='<button class="group-item group-root '+(group==='全部'?'active':'')+'" data-group="全部"><span class="label">全部</span><span class="count">'+items.length+'</span></button>'+'<div class="group-children">'+groupNames.map(name=>'<button class="group-item '+(group===name?'active':'')+'" data-group="'+escape(name)+'"><span class="label">'+escape(name)+'</span><span class="count">'+items.filter(x=>x.group===name).length+'</span></button>').join('')+'</div>';
 const upBtn=$('#upload');if(upBtn)upBtn.disabled=(group==='全部');const upTip=$('#upload-tip');if(upTip)upTip.hidden=(group!=='全部');
 const toggle=$('#view-toggle');toggle.textContent=card?'☷ 列表':'▦ 卡片';toggle.setAttribute('aria-label',card?'切换为列表视图':'切换为卡片视图');toggle.setAttribute('aria-pressed',String(card));
 const mount=$('#list');mount.classList.toggle('card-view',card);
 if(!shown.length)mount.innerHTML='<div class="empty">该分组暂无文件</div>';
 else if(card){
  mount.innerHTML='<div class="card-selection"><label><input id="check-all" type="checkbox" aria-label="全选当前列表" '+(all?'checked':'')+'> 全选当前列表</label><span>共 '+shown.length+' 条</span></div><div class="cards">'+shown.map(x=>'<article class="process-card '+(selected.has(x.id)?'selected':'')+'"><input class="card-check" type="checkbox" data-check="'+x.id+'" aria-label="选择'+escape(x.name)+'" '+(selected.has(x.id)?'checked':'')+'><button type="button" class="thumb" data-action="preview" data-id="'+x.id+'" aria-label="预览'+escape(x.name)+'"><span class="video-mark" aria-hidden="true">▶</span></button><button class="file-name card-name" data-action="preview" data-id="'+x.id+'">'+escape(x.name)+'</button><p class="card-meta">'+escape(x.group)+' · '+escape(x.type.toUpperCase())+' · '+escape(x.size)+' MB</p><p class="card-meta">上传人：'+escape(x.by)+'</p><p class="card-meta">上传时间：'+escape(x.date)+'</p>'+(x.bim.length?'<span class="tag">已挂接BIM</span>':'')+'<div class="card-actions">'+processActions(x)+'</div></article>').join('')+'</div>';
 }else{
  mount.innerHTML='<table><thead><tr><th class="check"><input id="check-all" type="checkbox" aria-label="全选当前列表" '+(all?'checked':'')+'></th><th>文件名称</th><th>上传人</th><th>类型</th><th>文件大小</th><th>上传时间</th><th>操作</th></tr></thead><tbody>'+shown.map(x=>'<tr><td><input type="checkbox" data-check="'+x.id+'" aria-label="选择'+escape(x.name)+'" '+(selected.has(x.id)?'checked':'')+'></td><td><span class="file-icon">▣</span><button class="file-name" data-action="preview" data-id="'+x.id+'">'+escape(x.name)+'</button>'+(x.bim.length?'<span class="tag">已挂接BIM</span>':'')+'</td><td>'+escape(x.by)+'</td><td>'+escape(x.type)+'</td><td>'+escape(x.size)+'MB</td><td>'+escape(x.date)+'</td><td>'+processActions(x)+'</td></tr>').join('')+'</tbody></table>';
 }
 if($('#check-all'))$('#check-all').indeterminate=checked>0&&checked<shown.length;
 for(const id of ['batch-download','batch-qr','batch-move','batch-delete'])$('#'+id).disabled=selected.size===0;
}
function fileDownload(x){if(!x.file){notify('示例文件未附原始视频，上传文件后可下载');return}const url=URL.createObjectURL(x.file),a=document.createElement('a');a.href=url;a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function addGroup(){dialog('新建','<label class="field"><span><span class="danger">*</span> 分组名称</span><input id="new-group" maxlength="50" placeholder="请输入"></label><div class="error" id="error" role="alert"></div>',cancel+save);$('#save').onclick=()=>{const name=$('#new-group').value.trim();if(!name){$('#error').textContent='请输入分组名称';return}if(groupNames.includes(name)){$('#error').textContent='分组名称已存在';return}groupNames.push(name);group=name;selected.clear();closeDialog();render();notify('分组已创建')}}
function rename(x){dialog('重命名','<label class="field"><span>文件名称</span><input id="new-name" maxlength="100" value="'+escape(x.name)+'"></label><div class="error" id="error" role="alert"></div>',cancel+save);$('#save').onclick=()=>{const name=$('#new-name').value.trim();if(!name){$('#error').textContent='请输入文件名称';return}x.name=name;closeDialog();render();notify('名称已更新')}}
function remove(ids){const list=items.filter(x=>ids.includes(x.id));dialog('删除文件','确认删除 '+list.length+' 个文件？相关分享链接和二维码将失效。',cancel+'<button class="control primary" id="save">确认删除</button>');$('#save').onclick=()=>{items=items.filter(x=>!ids.includes(x.id));ids.forEach(id=>selected.delete(id));closeDialog();render();notify('已删除')}}
function move(ids){dialog('移动到分组','<label class="field"><span>目标分组</span><select id="move-target">'+groupNames.filter(name=>name!==group).map(name=>'<option>'+escape(name)+'</option>').join('')+'</select></label>',cancel+save);$('#save').onclick=()=>{const target=$('#move-target').value;if(!target){notify('请先创建其他分组');return}items.filter(x=>ids.includes(x.id)).forEach(x=>x.group=target);selected.clear();closeDialog();render();notify('已移动到 '+target)}}
function menu(x,button){if(popId===x.id){closeMenu();return}popId=x.id;$('#popover').innerHTML='<div class="menu" role="menu">'+[['share','分享'],['qr','二维码'],['records','查看记录'],['bim','BIM模型挂接']].map(([action,label])=>'<button role="menuitem" data-action="'+action+'" data-id="'+x.id+'">'+label+'</button>').join('')+'</div>';const pop=$('#popover .menu'),rect=button.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(rect.left,innerWidth-pop.offsetWidth-8))+'px';pop.style.top=(rect.bottom+pop.offsetHeight+6<innerHeight?rect.bottom+4:Math.max(8,rect.top-pop.offsetHeight-4))+'px'}
function shareUrl(x){return 'https://example.com/process/'+x.id}
function makeQr(el,url){if(typeof qrcode!=='function'){el.textContent='二维码组件未加载';return}const qr=qrcode(0,'M');qr.addData(url);qr.make();el.innerHTML=qr.createSvgTag(4,12)}

function processPosterHtml(x,qrId){return'<div class="qr-poster" data-poster="'+x.id+'"><div class="qr-brand-mark">中煤<small>中煤集团</small></div><div class="qr-title">施工工艺交底</div><div class="qr-project">雄安科创园项目部</div><div class="qr-skyline">'+posterSkyline()+'</div><div class="qr-scan">扫码查看施工工艺交底内容</div><div class="qr-code-shell"><div class="qr" id="'+qrId+'"></div><div class="qr-center-logo">中</div></div><div class="qr-separator"><span>雄安科创园项目现场交底</span></div><div class="qr-resource">'+escape(x.name)+'</div><div class="qr-footnote">二维码长期有效，请妥善张贴保存</div></div>'}
function exportProcessPoster(x,host){const source=host.querySelector('.qr svg');if(!source){notify('二维码组件未加载');return false}const code=source.cloneNode(true);code.setAttribute('x','110');code.setAttribute('y','215');code.setAttribute('width','200');code.setAttribute('height','200');const qrMarkup=new XMLSerializer().serializeToString(code),safeName=escape(x.name),svg='<svg xmlns="http://www.w3.org/2000/svg" width="420" height="620" viewBox="0 0 420 620"><rect width="420" height="620" fill="#fff"/><rect y="430" width="420" height="190" fill="#f5f9fe"/><text x="210" y="60" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700" fill="#1670bd">施工工艺交底</text><text x="210" y="91" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1773c7">雄安科创园项目部</text><text x="365" y="42" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2071bb">中煤</text><text x="365" y="55" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="8" fill="#2071bb">中煤集团</text><g fill="none" stroke="#78a4d4" opacity=".58"><path d="M30 175H390M45 175V125l35-20 35 20v50M125 175v-38l35-18 36 18v38M215 175v-58h145v58M225 117l20-20h95l20 20M230 135h125"/><path d="M58 137h14m16 0h14M58 151h14m16 0h14M140 145h18m10 0h18M235 145h25m12 0h25m12 0h25"/></g><text x="210" y="199" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#1d2f44">扫码查看施工工艺交底内容</text><rect x="101" y="206" width="218" height="218" rx="5" fill="#fff" stroke="#dce5ee"/>'+qrMarkup+'<circle cx="210" cy="315" r="20" fill="#2177be" stroke="#fff" stroke-width="5"/><text x="210" y="321" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#fff">中</text><path d="M44 459H135M285 459H376" stroke="#9faebb"/><text x="210" y="464" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#27384e">雄安科创园项目现场交底</text><rect x="55" y="486" width="310" height="76" rx="10" fill="#e8f3ff" stroke="#d6e7f7"/><text x="210" y="531" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#172c44">'+safeName+'</text><text x="210" y="590" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#6c7d90">二维码长期有效，请妥善张贴保存</text></svg>',blob=new Blob([svg],{type:'image/svg+xml'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=x.name+'-施工工艺交底二维码.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return true}
function share(x,qrMode=false){const url=shareUrl(x);if(qrMode){dialog('施工工艺交底二维码',processPosterHtml(x,'qr-code'),cancel+'<button class="control primary" id="save">↓ 下载二维码</button>');root.querySelector('.dialog').classList.add('qr-dialog');makeQr($('#qr-code'),url);$('#save').onclick=()=>{if(!exportProcessPoster(x,root.querySelector('.qr-poster')))return;x.shares.unshift({type:'二维码',date:now(),expiry:'长期有效',by:'系统管理员'});notify('施工工艺交底二维码已下载')};return}dialog('分享链接','<div>文件：'+escape(x.name)+'</div><label class="field"><span>分享链接</span><input id="share-url" readonly value="'+url+'"></label><label class="field"><span>有效期</span><select id="expiry"><option>永久</option><option>7天</option><option>30天</option><option>半年</option></select></label><div class="note">这是演示链接，正式使用时由后台生成可访问地址。</div>',cancel+'<button class="control primary" id="save">复制链接</button>');$('#save').onclick=async()=>{try{await navigator.clipboard.writeText(url)}catch{$('#share-url').select();notify('请按 Ctrl+C 复制已选中的链接');return}x.shares.unshift({type:'链接',date:now(),expiry:$('#expiry').value,by:'系统管理员'});closeDialog();notify('分享链接已复制')}}
function viewRecordChannel(log){
 const raw=String(log.channel||log.source||'appweb').toLowerCase();
 return ['share','sharelink','mini','分享链接','小程序'].includes(raw)?'share':['appweb','web','app','mobile','移动端'].includes(raw)?'appweb':'unknown';
}
function groupedViewRecords(logs,tab,query){
 const keyword=String(query||'').trim().toLowerCase(),groups=new Map();
 (logs||[]).forEach((log,index)=>{
  if(viewRecordChannel(log)!==tab)return;
  const name=String(log.person||''),phone=String(log.phone||'');
  if(keyword&&![name,phone].some(v=>v.toLowerCase().includes(keyword)))return;
  const key=name||phone?JSON.stringify([name,phone]):'unknown:'+index;
  if(!groups.has(key))groups.set(key,{name,phone,events:[]});groups.get(key).events.push(log);
 });
 return [...groups.values()];
}
function records(x,tab='share',query=''){
 if(tab==='view')tab='appweb';
 const body='<div class="record-tabs" role="tablist"><button type="button" role="tab" aria-selected="'+(tab==='share')+'" data-record-tab="share" class="'+(tab==='share'?'active':'')+'">分享链接查看记录</button><button type="button" role="tab" aria-selected="'+(tab==='appweb')+'" data-record-tab="appweb" class="'+(tab==='appweb'?'active':'')+'">WEB & 移动端查看记录</button></div><div class="record-tools"><input id="process-record-search" aria-label="搜索姓名或手机号" placeholder="搜索姓名或手机号" value="'+escape(query)+'"></div><div class="record-grid" id="process-record-grid"></div>';
 dialog('查看记录',body,'',true);root.querySelector('.dialog').classList.add('records');
 root.querySelectorAll('[data-record-tab]').forEach(b=>b.onclick=()=>records(x,b.dataset.recordTab,$('#process-record-search').value));
 $('#process-record-search').oninput=()=>renderProcessRecordTable(x,tab);renderProcessRecordTable(x,tab);
}
function renderProcessRecordTable(x,tab){
 const query=$('#process-record-search').value,people=groupedViewRecords(x.views,tab,query);
 const head='<tr><th>序号</th><th>姓名</th><th>手机</th><th>查看次数</th></tr>';
 const body=people.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+escape(p.name||'--')+'</td><td>'+escape(p.phone||'--')+'</td><td><button type="button" class="count-link" data-count-index="'+i+'">'+p.events.length+'</button></td></tr>').join('');
 $('#process-record-grid').innerHTML='<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>'+(people.length?'':'<div class="record-empty"><span>▤</span>暂无数据</div>');
 root.querySelectorAll('[data-count-index]').forEach(b=>b.onclick=()=>processRecordTimes(x,people[+b.dataset.countIndex],tab,query));
}
function processRecordTimes(x,person,tab,query=''){
 const body='<div class="record-grid"><table><thead><tr><th>序号</th><th>查看时间</th></tr></thead><tbody>'+person.events.map((event,i)=>'<tr><td>'+(i+1)+'</td><td>'+escape(event.date||'--')+'</td></tr>').join('')+'</tbody></table></div>';
 dialog('查看次数统计',body,'<button class="control" id="process-record-back">返回查看记录</button>');
 $('#dialog-close').onclick=$('#process-record-back').onclick=()=>records(x,tab,query);
}

function attachBim(x){window.parent.postMessage({channel:'xa-bim-briefing',action:'bind',briefingType:'施工工艺交底',resourceName:x.name.replace(/\.[^.]+$/,''),fileName:x.name,sourceId:String(x.id)},'*')}
function preview(x){x.views.unshift({person:'系统管理员',date:now(),source:'WEB'});dialog(x.name,x.file?'<video class="preview" src="'+URL.createObjectURL(x.file)+'" controls></video>':'<div class="placeholder">演示条目未附视频文件。上传本地视频后可在此播放。</div>','',true)}
function bulkQr(ids){
  const chosen=items.filter(x=>ids.includes(x.id));
  dialog('打印/导出施工工艺交底二维码','<div id="bulk-qr-list" class="bulk-poster-list"></div>',cancel+'<button class="control" id="export-qr">导出二维码</button><button class="control primary" id="save">打印</button>',true);
  $('#bulk-qr-list').innerHTML=chosen.map(x=>processPosterHtml(x,'qr-code-'+x.id)).join('');
  chosen.forEach(x=>makeQr($('#qr-code-'+x.id),shareUrl(x)));
  $('#export-qr').onclick=()=>{let count=0;chosen.forEach(x=>{if(exportProcessPoster(x,root.querySelector('[data-poster="'+x.id+'"]')))count++});notify(count?'已导出 '+count+' 张施工工艺交底二维码':'二维码组件未加载')};
  $('#save').onclick=()=>window.print();
}
root.addEventListener('click',e=>{const groupButton=e.target.closest('[data-group]');if(groupButton){group=groupButton.dataset.group;selected.clear();closeMenu();render();return}const action=e.target.closest('[data-action]');if(action){const x=items.find(v=>v.id===+action.dataset.id);if(!x)return;const name=action.dataset.action;if(name==='menu')menu(x,action);else{closeMenu();({preview:()=>preview(x),rename:()=>rename(x),download:()=>fileDownload(x),delete:()=>remove([x.id]),share:()=>share(x),qr:()=>share(x,true),records:()=>records(x),bim:()=>attachBim(x)})[name]?.()}return}if(!e.target.closest('.menu'))closeMenu()});
$('#view-toggle').onclick=()=>{card=!card;closeMenu();render()};
$('#group-list').addEventListener('change',()=>{});$('#add-group').onclick=addGroup;$('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();selected.clear();render()};$('#upload').onclick=()=>{
  if(group==='全部'){notify('请先在左侧选择具体分组');return}
  dialog('上传文件','<div class="field"><span>上传到</span><input value="'+escape(group)+'" readonly></div><label class="field"><span><span class="danger">*</span> 选择文件</span><input id="up-files" type="file" accept="video/mp4,video/webm,.mp4,.webm" multiple></label><div class="note">支持 MP4、WebM；上传后自动归入左侧选中的分组。</div><div class="error" id="up-error" role="alert"></div>',cancel+'<button class="control primary" id="up-save">上传</button>');
  $('#up-save').onclick=()=>{
    const fs=$('#up-files').files;if(!fs.length){$('#up-error').textContent='请选择文件';return}
    let ok=0,bad=0;
    for(const file of fs){if(!/\.(mp4|webm)$/i.test(file.name)){bad++;continue}items.unshift({id:nextId++,name:file.name,group,by:'系统管理员',size:(file.size/1048576).toFixed(2),date:now(),type:file.name.split('.').at(-1).toLowerCase(),file,shares:[],views:[],bim:[]});ok++}
    if(!ok){$('#up-error').textContent='仅支持 MP4、WebM 视频';return}
    closeDialog();selected.clear();render();notify('已上传 '+ok+' 个文件'+(bad?'，'+bad+' 个格式不支持已跳过':''));
  };
};
$('#list').addEventListener('change',e=>{if(e.target.id==='check-all'){current().forEach(x=>e.target.checked?selected.add(x.id):selected.delete(x.id))}else if(e.target.dataset.check){const id=+e.target.dataset.check;e.target.checked?selected.add(id):selected.delete(id)}render()});
$('#batch-download').onclick=()=>items.filter(x=>selected.has(x.id)).forEach(fileDownload);$('#batch-qr').onclick=()=>bulkQr([...selected]);$('#batch-move').onclick=()=>move([...selected]);$('#batch-delete').onclick=()=>remove([...selected]);window.addEventListener('scroll',closeMenu,true);root.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeDialog()}});render();
})();
</script>
