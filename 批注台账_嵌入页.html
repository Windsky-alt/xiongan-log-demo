<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>批注台账</title>
<style>
/* 样式与 实测实量_测量记录台账_嵌入页.html 保持一致 */
:root{--blue:#3a82ee;--text:#34445a;--muted:#8290a4;--line:#e4eaf2;--head:#f3f4f6}
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px/1.5 "Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);background:#fff}button,input,select{font:inherit}button{cursor:pointer}
.page{height:100%;padding:22px;overflow:auto}
.filters{display:flex;align-items:center;gap:14px;padding-bottom:20px;border-bottom:1px solid #edf1f5;flex-wrap:wrap}
.filters input,.filters select{height:40px;border:1px solid #dbe3ed;border-radius:4px;padding:0 12px;color:#41546c;background:#fff}
.filters input{width:240px}
.btn{height:40px;padding:0 18px;border:1px solid #d8e1ec;border-radius:4px;background:#fff;color:#43556d}
.btn:hover{border-color:#b9cde8;color:var(--blue)}
.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}
.btn.primary:hover{background:#2f74dc;border-color:#2f74dc;color:#fff}
.summary{display:flex;justify-content:space-between;align-items:center;margin:19px 0 12px}
.summary b{color:var(--blue)}
.summary .sub{color:var(--muted);margin-left:4px}
.table-wrap{min-width:1080px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{height:56px;padding:0 12px;background:var(--head);color:#33465e;text-align:left;font-weight:700}
td{height:64px;padding:0 12px;border-bottom:1px solid var(--line);color:#566980;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:hover td{background:#fbfdff}
tbody tr{cursor:pointer}
.wrap-cell{white-space:normal;line-height:1.55;padding-top:12px;padding-bottom:12px;height:auto}
.cell-title{font-weight:600;color:#33465e}
.cell-sub{color:var(--muted);margin-top:4px;font-size:13px}
.comp small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;background:#f0f4f9;color:#5a6d86;border:1px solid #e6edf6;font-size:12px;margin:5px 5px 0 0}
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:12.5px;font-weight:700;white-space:nowrap}
.badge.wait{background:#fff1f2;color:#d94252;border:1px solid #ffd9dd}
.badge.cont{background:#fff6ea;color:#c2690a;border:1px solid #ffe2bd}
.badge.check{background:#eef6ff;color:#2176cf;border:1px solid #cfe6ff}
.badge.done{background:#eefaf3;color:#148659;border:1px solid #cdeedb}
.badge.over{background:#e45555;color:#fff;border:1px solid #e45555}
.over-days{color:#e45555;font-size:12.5px;font-weight:700;margin-left:6px}
.action{border:0;background:transparent;color:#237bea;padding:4px 6px}
.action:hover{text-decoration:underline}
.pagination{display:flex;justify-content:flex-end;gap:14px;align-items:center;padding:22px 0;color:#74849a}
.page-no{color:#237bea;font-weight:700;border:0;background:transparent;padding:2px 6px}
.page-no.on{color:#fff;background:var(--blue);border-radius:3px}
.empty{padding:50px;text-align:center;color:#91a0b2}
.pick-note{padding:10px 12px;margin-bottom:14px;border:1px solid #d9eafd;border-radius:4px;background:#f2f8ff;color:#52718f}

.mask{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:#17283f63}
.mask.show{display:flex}
.dialog{width:min(760px,96vw);max-height:88vh;display:flex;flex-direction:column;background:#fff;border-radius:6px;box-shadow:0 18px 45px #17283f42}
.dialog-head{height:58px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);font-size:17px;font-weight:700}
.close{margin-left:auto;border:0;background:transparent;color:#7f8da1;font-size:24px}
.dialog-body{padding:19px 20px;overflow:auto}
.dialog-foot{height:62px;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:0 20px;border-top:1px solid var(--line);background:#fafcff}
.sec-title{font-weight:700;color:#33465e;margin:18px 0 4px;font-size:13.5px}
.sec-title:first-child{margin-top:0}
.kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:13.5px;line-height:1.6}
.kv:last-child{border-bottom:0}
.kv .k{width:88px;flex:none;color:var(--muted)}
.kv .v{flex:1;min-width:0;word-break:break-word}
.steps{position:relative;padding-left:18px}
.steps::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.step{position:relative;padding-bottom:14px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.step.on::before{border-color:var(--blue)}
.step.over::before{border-color:#e45555}
.step .st{font-weight:700;color:#33465e}
.step .sm{color:var(--muted);font-size:13px;margin-top:2px}
@media(max-width:900px){.page{padding:15px}.dialog{width:97vw}.dialog-body{padding:14px}}
.detail-bar{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid #edf1f5;margin-bottom:20px}
.detail-bar .detail-name{font-weight:700;color:#33465e;font-size:15px}
.page[hidden]{display:none}
.img-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.img-list img{width:96px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.round-card{margin:10px 0 14px;border:1px solid #dfe7f1;border-radius:6px;overflow:hidden}
.round-head{padding:9px 12px;background:#f6f9fc;font-weight:700;color:#425a76}
.round-body{padding:2px 12px 9px}
.annotation-table{min-width:1300px;table-layout:fixed}.annotation-description{font-weight:400;color:#41546c;line-height:1.65}.badge.void{background:#eef1f5;color:#7c8794}.action.danger{color:#d9534f}.annotation-table td{vertical-align:middle}
.ann-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2b3e;color:#fff;padding:9px 16px;border-radius:5px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}.ann-toast.show{opacity:1}
.ann-mask{position:fixed;inset:0;background:#0b162480;display:flex;align-items:center;justify-content:center;z-index:98}
.ann-dialog{background:#fff;border-radius:8px;padding:18px 20px;width:340px;box-shadow:0 12px 40px #0b162433;font-size:13px;color:#33465e}
.ann-dialog-wide{width:460px}
.ann-dialog h3{margin:0 0 12px;font-size:15px}
.ann-dialog p{margin:0 0 16px;line-height:1.7}
.ann-dialog-foot{display:flex;justify-content:flex-end;gap:8px}
/* 编辑批注：字段与排版沿用「新增批注」 */
.ann-dialog-form{width:520px;max-height:86vh;display:flex;flex-direction:column;padding:0}
.ann-dialog-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #e0e7ef;font-weight:700;color:#1d2b3e;font-size:15px}
.ann-x{border:0;background:none;color:#6b7d90;font-size:20px;line-height:1;cursor:pointer}
.ann-dialog-body{padding:18px;overflow:auto}
.ann-dialog-form .field{display:block;margin:0 0 13px;color:#40526a;font-size:13px}
.ann-dialog-form .field span{display:block;margin-bottom:5px}
.ann-dialog-form .field input,.ann-dialog-form .field select,.ann-dialog-form .field textarea{width:100%;border:1px solid #cbd8e5;border-radius:3px;padding:8px;color:#263c54;font:inherit}
.ann-dialog-form .field textarea{min-height:80px;resize:vertical}
.ann-dialog-form .field[hidden]{display:none}
.ann-dialog-form .required{color:#d34b4b;font-weight:700}
.ann-dialog-form .annotation-radio{display:flex;gap:24px;align-items:center}
.ann-dialog-form .annotation-radio label{display:flex;align-items:center;gap:6px;color:#40526a}
.ann-dialog-form .annotation-radio input{width:auto}
.ann-dialog-form .form-error{color:#c43838;font-size:12px;min-height:18px}
.ann-dialog-form .ann-comp-row{display:flex;align-items:center;gap:10px}
.ann-dialog-form .ann-comp-row strong{flex:1;font-weight:700;color:#1d2b3e}
.ann-dialog-form .ann-btn,.ann-dialog-form .ann-dialog-foot button{border:1px solid #c9d6e4;border-radius:3px;background:#fff;color:#28699f;padding:7px 11px;font:inherit;cursor:pointer}
.ann-dialog-form .ann-dialog-foot .primary{background:#2787f5;border-color:#2787f5;color:#fff}
.ann-dialog-form .ann-dialog-foot{display:flex;justify-content:flex-end;gap:8px}
.ann-dialog-form .ann-dialog-foot{padding:12px 18px;border-top:1px solid #e1e9f1}
.ann-field{display:block;margin-bottom:12px;font-size:12px;color:#5a6b80}
.ann-field textarea,.ann-field input{display:block;width:100%;margin-top:5px;border:1px solid #d9e2ec;border-radius:4px;padding:7px 9px;font:inherit;color:#33465e}
.ann-field textarea{min-height:64px;resize:vertical}
</style>
</head>

<main class="page" id="listView">
  <div class="filters">
    <select id="fStatus">
      <option value="all">全部状态</option>

    <select id="fComp"><option value="">全部构件</option></select>
    <input id="fSearch" placeholder="搜索批注内容 / 构件 / 责任人"/>

    <button class="btn primary" id="searchBtn">搜索</button>
  </div>

  <div class="summary">
    <span>共 <b id="count">0</b> 条批注<span class="sub" id="subInfo"></span></span>
    <span class="sub" id="pageInfo"></span>
  </div>

  <div id="tableMount"></div>
  <div class="pagination" id="pagination"></div>
</main>

<main class="page" id="detailView" hidden>
  <div class="detail-bar">
    <button class="btn" id="backBtn">← 返回台账</button>
    <span class="detail-name" id="detailName"></span>
    <span class="badge" id="detailState"></span>
  </div>
  <div id="detailBody"></div>
</main>

function normalizeBindings(raw){

  const original=existing[0]||catalog.find(r=>r.sendCode===code);
  if(!original)return;const data={...original,...overrides[code]};
  names.forEach(name=>{const c=components.find(c=>c[0]===name||c[1]===name);if(!c)return;
   const old=existing.find(r=>r.componentId===c[0]);
   out.push({...data,...old,type:'report',sourceId:'report:'+code,componentId:c[0],compName:c[1],x:c[2],y:c[3],
    title:code+' · '+data.materialName,checkTime:data.sendDate||'',bimModel:old?.bimModel||data.bimModel||'XA000_ZMXA_A_建筑单体主文件-01地块-地上.rvt'});

 incoming.filter(r=>r.type==='report').forEach(r=>{

function overdueDays(r){

  const st=annStore()||{annotations:[],seq:0};

function syncBimRows(id,fields,remove){
  try{
    const raw=localStorage.getItem('xa-bim-business-v2');if(!raw)return;
    const st=JSON.parse(raw);if(!Array.isArray(st.records))return;
    const match=r=>r.type==='annotation'&&(String(r.ledgerKey)===String(id)||String(r.sourceId||'').indexOf(String(id))>=0);
    if(remove){st.records=st.records.filter(r=>!match(r))}
    else{let hit=false;st.records.forEach(r=>{if(match(r)){Object.assign(r,fields);hit=true}});if(!hit)return}

  }catch(e){}
}

function askAnnConfirm(text,onOk){
  const box=document.createElement('div');box.className='ann-mask';
  box.innerHTML='<div class="ann-dialog"><p>'+esc(text)+'</p><div class="ann-dialog-foot"><button class="action" data-cancel>取消</button><button class="action danger" data-ok>确定</button></div></div>';
  document.body.appendChild(box);
  box.querySelector('[data-cancel]').onclick=()=>box.remove();
  box.querySelector('[data-ok]').onclick=()=>{box.remove();onOk()};
}
function withdrawAnn(id){
  askAnnConfirm('确认撤回该批注？撤回后状态变为「已撤回」，可编辑重新提交或删除。',()=>{
    patchAnn(id,{baseStatus:'已撤回',status:'已撤回'});
    syncBimRows(id,{baseStatus:'已撤回',status:'已撤回'});
    reloadAnn();annToast('已撤回，可编辑重新提交');
  });
}
function deleteAnn(id){
  askAnnConfirm('确认删除该批注？删除后不可恢复，BIM 模型上的挂接数据同步删除。',()=>{
    const st=annStore()||{annotations:[],seq:0};
    st.annotations=st.annotations.filter(x=>x.id!==id);saveAnnStore(st);
    try{const rm=JSON.parse(localStorage.getItem(REMOVED_KEY)||'[]');if(rm.indexOf(id)<0){rm.push(id);localStorage.setItem(REMOVED_KEY,JSON.stringify(rm))}}catch(e){}
    syncBimRows(id,{},true);
    reloadAnn();annToast('已删除，BIM 挂接数据已同步删除');
  });
}
function annPeople(items){
  return '<option value="">请选择</option>'+items.map(x=>'<option value="'+esc(x[0])+'" data-unit="'+esc(x[1])+'">'+esc(x[0])+'（'+esc(x[1])+'）</option>').join('');
}
function annCompOptions(selectedId){
  const list=(XABimStore&&XABimStore.components)||[];
  return list.map(c=>'<option value="'+esc(c[0])+'" '+(c[0]===selectedId?'selected':'')+'>'+esc(c[1])+'</option>').join('');
}
function annFormValues(){
  const sel=document.querySelector('#annEditAssignee'),opt=sel&&sel.options[sel.selectedIndex];
  return {
    componentId:document.querySelector('#annEditComp')?.value||'',
    desc:document.querySelector('#annEditDesc')?.value||'',
    issue:document.querySelector('input[name="annEditIssue"]:checked')?.value==='yes',
    assignee:sel?.value||'',
    unit:opt?.dataset.unit||'',
    deadline:document.querySelector('#annEditDeadline')?.value||'',
    reviewer:document.querySelector('#annEditReviewer')?.value||''
  };
}
function editAnn(id){
  const r=findAnn(id);if(!r)return;
  const issue=r.issueRequired!==false&&r.baseStatus!=='无需整改';
  const compName=(r.compName||((XABimStore.components||[]).find(c=>c[0]===r.componentId)||[])[1]||'--');
  const body='<div class="field"><span>已选构件</span><div class="ann-comp-row"><strong id="annEditCompText">'+esc(compName)+'</strong><button type="button" class="ann-btn" data-change-comp>更换构件</button></div><select id="annEditComp" hidden>'+annCompOptions(r.componentId)+'</select></div>'
    +'<div class="field"><span>问题描述 <b class="required">*</b></span><textarea id="annEditDesc" rows="3" placeholder="描述构件现场发现的问题">'+esc(r.description||'')+'</textarea></div>'
    +'<div class="field"><span>是否需要整改 <b class="required">*</b></span><div class="annotation-radio"><label><input type="radio" name="annEditIssue" value="yes" '+(issue?'checked':'')+'>是</label><label><input type="radio" name="annEditIssue" value="no" '+(issue?'':'checked')+'>否</label></div></div>'
    +'<div id="annEditIssueFields">'
    +'<div class="field"><span>整改人 <b class="required">*</b></span><select id="annEditAssignee">'+annPeople([['李强','机电安装班组'],['徐志成','主体施工班组'],['赵明','装饰班组']])+'</select></div>'
    +'<div class="field"><span>整改截止日期 <b class="required">*</b></span><input id="annEditDeadline" type="date" value="'+esc(r.deadline||'')+'"></div>'
    +'<div class="field"><span>复查人 <b class="required">*</b></span><select id="annEditReviewer">'+annPeople([['王会彬','质量员'],['刘振','专业工程师'],['张恒毓','项目技术员']])+'</select></div>'
    +'</div>';
  const box=document.createElement('div');box.className='ann-mask';
  box.innerHTML='<section class="ann-dialog ann-dialog-form annotation-create-modal" role="dialog" aria-modal="true" aria-label="编辑批注">'
    +'<div class="ann-dialog-head"><span>编辑批注</span><button type="button" class="ann-x" data-cancel aria-label="关闭">×</button></div>'
    +'<div class="ann-dialog-body">'+body+'<div class="form-error" id="annEditError" role="alert"></div></div>'
    +'<div class="ann-dialog-foot"><button class="action" data-cancel>取消</button><button class="action primary" data-ok>保存并重新提交</button></div></section>';
  document.body.appendChild(box);
  if(r.assignee)box.querySelector('#annEditAssignee').value=r.assignee;
  else box.querySelector('#annEditAssignee').value='';
  if(r.reviewer)box.querySelector('#annEditReviewer').value=r.reviewer;
  const toggle=()=>{const yes=box.querySelector('input[name="annEditIssue"]:checked')?.value==='yes';box.querySelector('#annEditIssueFields').hidden=!yes};
  box.querySelectorAll('input[name="annEditIssue"]').forEach(i=>i.addEventListener('change',toggle));toggle();
  box.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>box.remove());
  const changeBtn=box.querySelector('[data-change-comp]');
  if(changeBtn)changeBtn.onclick=()=>{const sel=box.querySelector('#annEditComp');sel.hidden=!sel.hidden;if(!sel.hidden)sel.focus()};
  const compSel=box.querySelector('#annEditComp');
  if(compSel)compSel.onchange=()=>{const c=(XABimStore.components||[]).find(x=>x[0]===compSel.value);if(c)box.querySelector('#annEditCompText').textContent=c[1]};
  box.querySelector('[data-ok]').onclick=()=>{
    const v=annFormValues(),error=box.querySelector('#annEditError');
    if(!v.desc.trim()){error.textContent='请填写问题描述';return}
    if(v.issue&&!v.assignee){error.textContent='请选择整改人';return}
    if(v.issue&&!v.deadline){error.textContent='请选择整改截止日期';return}
    if(v.issue&&!v.reviewer){error.textContent='请选择复查人';return}
    const comp=(XABimStore.components||[]).find(c=>c[0]===v.componentId);
    const fields={
      title:v.desc.trim().slice(0,20),
      description:v.desc.trim(),
      requirement:v.issue?'按方案整改并复查':'仅记录问题，无需整改',
      deadline:v.issue?v.deadline:'',
      unit:v.issue?v.unit:'',
      assignee:v.issue?v.assignee:'',
      reviewer:v.issue?v.reviewer:'',
      issueRequired:!!v.issue,
      baseStatus:v.issue?'待整改':'无需整改',
      status:v.issue?'待整改':'无需整改',
      round:(Number(r.round)||1)+1,
      resubmittedAt:new Date().toLocaleString('sv-SE').slice(0,16)
    };
    if(comp){fields.componentId=comp[0];fields.compName=comp[1];fields.position=comp[1]}
    patchAnn(id,fields);
    syncBimRows(id,fields);
    box.remove();reloadAnn();
    annToast('已保存并重新提交，状态回到'+(v.issue?'「待整改」':'「无需整改」'));
  };
}
/* ===== 事件 ===== */
$('#searchBtn').onclick=()=>{
  view.overdue=$('#fOverdue').value;view.status=$('#fStatus').value; view.checker=$('#fChecker').value;
  view.comp=$('#fComp').value; view.kw=$('#fSearch').value.trim().toLowerCase();
  view.page=1; renderTable();
};
$('#resetBtn').onclick=()=>{
  view={status:'all',overdue:'',checker:'',comp:'',kw:'',page:1}; renderFilters(); renderTable();
};
$('#fSearch').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#searchBtn').click() });
$('#tableMount').addEventListener('click',e=>{
  const w=e.target.closest('[data-withdraw]'); if(w){ e.stopPropagation(); withdrawAnn(+w.dataset.withdraw); return }
  const ed=e.target.closest('[data-edit]'); if(ed){ e.stopPropagation(); editAnn(+ed.dataset.edit); return }
  const dl=e.target.closest('[data-del]'); if(dl){ e.stopPropagation(); deleteAnn(+dl.dataset.del); return }
  const b=e.target.closest('[data-detail]');
  if(b){ e.stopPropagation(); openDetail(+b.dataset.detail); return }
  const tr=e.target.closest('tr[data-id]');
  if(tr) openDetail(+tr.dataset.id);
});
$('#pagination').addEventListener('click',e=>{
  const b=e.target.closest('[data-page]'); if(!b) return;
  view.page=+b.dataset.page; renderTable();
});
$('#backBtn').onclick=backToList;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') backToList() });

/* ===== 跨端同步 ===== */
window.addEventListener('message',e=>{
  const d=e.data; if(!d||d.channel!=='xa-annotation') return;
  if(d.action==='refresh'||d.action==='changed'){
    if(Array.isArray(d.data)&&d.data.length){
      d.data.forEach(x=>{
        const i=DATA.findIndex(y=>y.id===x.id);
        if(i<0) DATA.push({...x}); else DATA[i]={...DATA[i],...x};
      });
    }else{
      const s=loadStore(); if(s) DATA=mergeAnnotationRows(s);
    }
    renderAll();
  }
});
try{
  const bc=new BroadcastChannel('xa-annotation-sync');
  bc.onmessage=e=>{ if(e.data&&e.data.type==='changed'){ const s=loadStore(); if(s)DATA=mergeAnnotationRows(s); renderAll() } };
}catch(e){}
try{ window.addEventListener('storage',e=>{ if(e.key==='xa-annotations-v1'){ const s=loadStore(); if(s){DATA=mergeAnnotationRows(s); renderAll()} } }) }catch(e){}

renderAll();
})();
</script>
</body>
</html>
