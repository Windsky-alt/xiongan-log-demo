let bimBindingContext=null,selectedBimComponents=new Set(),componentSearchQuery='';
const bindableComponents=[{name:'1号楼 · 14层 · 柱 KZ-01',pos:[38,44]},{name:'1号楼 · 14层 · 柱 KZ-02',pos:[43,48]},{name:'1号楼 · 14层 · 剪力墙 Q-14',pos:[52,49]},{name:'1号楼 · 14层 · 梁 KL-08',pos:[63,42]},{name:'1号楼 · 14层 · 梁 KL-09',pos:[67,46]},{name:'1号楼 · 14层 · 楼板 B-14',pos:[58,58]},{name:'1号楼 · 14层 · 外墙 W-03',pos:[73,53]}];
function bindingKey(record,position){return record.time+'|'+position}
function groupRecordPositions(record){const map=new Map();record.items.forEach(x=>{if(!map.has(x[1]))map.set(x[1],[]);map.get(x[1]).push(x)});return [...map.entries()]}
function renderLedgerDetail(record,index){measureScreen='ledgerDetail';setMeasureFrame('实测实量','','');const region=record.area.split(' · ').slice(0,2).join(' · ');$('#measureFlowContent').innerHTML='<div class="measure-card" style="display:flex;align-items:center"><b style="flex:1">区域</b><span>'+escapeHtml(region)+'</span></div>'+groupRecordPositions(record).map(([position,items],i)=>{const bound=measureBimBindings[bindingKey(record,position)]||[];return '<div class="position-group-title">分组'+(i+1)+'</div><button class="position-card" data-bind-position="'+escapeHtml(position)+'"><div class="position-top"><b>'+escapeHtml(position)+'</b><span class="bind-state '+(bound.length?'bound':'')+'">'+(bound.length?'已挂接 '+bound.length+' 个构件':'点击挂接 BIM')+'</span></div><div class="bound-components">BIM构件：'+(bound.length?bound.map(escapeHtml).join('、'):'--')+'</div><div class="item-chips">'+items.map(x=>'<span>'+escapeHtml(x[0])+'<br><small>'+escapeHtml(x[2])+'</small></span>').join('')+'</div></button>'}).join('');$$('[data-bind-position]').forEach(b=>b.onclick=()=>chooseBindingModel(record,index,b.dataset.bindPosition));$('#measureTopAction').onclick=null}
function chooseBindingModel(record,index,position){openSheet('选择BIM模型','<div class="picker-list"><label class="picker-option"><input type="radio" name="bindModel" value="1号楼建筑模型.rvt" checked><span><b>建筑</b><br><small>1号楼建筑模型.rvt</small></span></label><label class="picker-option"><input type="radio" name="bindModel" value="1号楼结构模型.rvt"><span><b>结构</b><br><small>1号楼结构模型.rvt</small></span></label><label class="picker-option"><input type="radio" name="bindModel" value="1号楼机电模型.rvt"><span><b>机电</b><br><small>1号楼机电模型.rvt</small></span></label></div>','<button data-close>取消</button><button class="primary" id="enterBimBinding">进入挂接</button>');$('#enterBimBinding').onclick=()=>{const model=$('input[name="bindModel"]:checked').value;$('#overlay').innerHTML='';startBimBinding(record,index,position,model)}}
function startBimBinding(record,index,position,model){bimBindingContext={record,index,position,model};selectedBimComponents=new Set(measureBimBindings[bindingKey(record,position)]||[]);componentSearchQuery='';showPage('modelPage');$('#modelPage').classList.add('binding-mode');$('#modelPageTitle').textContent='绑定BIM构件';$('#markerLayer').innerHTML='';$('#bimBindPanel').hidden=false;renderComponentHotspots();renderBimBindPanel()}
function renderComponentHotspots(){$('#componentLayer').innerHTML=bindableComponents.map((c,i)=>'<button class="component-hotspot '+(selectedBimComponents.has(c.name)?'selected':'')+'" data-bind-component="'+i+'" style="left:'+c.pos[0]+'%;top:'+c.pos[1]+'%">'+c.name+'</button>').join('');$$('[data-bind-component]').forEach(b=>b.onclick=e=>{e.stopPropagation();const name=bindableComponents[+b.dataset.bindComponent].name;selectedBimComponents.has(name)?selectedBimComponents.delete(name):selectedBimComponents.add(name);renderComponentHotspots();renderBimBindPanel()})}
function mobileComponentSearchRows(){const keyword=componentSearchQuery.trim().toLowerCase();return bindableComponents.filter(c=>!keyword||c.name.toLowerCase().includes(keyword))}
function renderMobileComponentSearch(){const rows=mobileComponentSearchRows(),mount=$('#componentSearchResults');if(!mount)return;mount.innerHTML=rows.length?rows.map((c,i)=>'<label class="component-search-result"><input type="checkbox" data-mobile-search-component="'+escapeHtml(c.name)+'" '+(selectedBimComponents.has(c.name)?'checked':'')+'><span>'+escapeHtml(c.name)+'</span></label>').join(''):'<div class="component-search-empty">未找到匹配构件</div>';const all=$('#mobileSelectAllComponents');if(all){all.checked=!!rows.length&&rows.every(c=>selectedBimComponents.has(c.name));all.disabled=!rows.length}const count=$('#mobileComponentSearchCount');if(count)count.textContent='已选 '+selectedBimComponents.size+' 个';$$('[data-mobile-search-component]').forEach(x=>x.onchange=()=>{x.checked?selectedBimComponents.add(x.dataset.mobileSearchComponent):selectedBimComponents.delete(x.dataset.mobileSearchComponent);renderComponentHotspots();renderBimBindPanel();renderMobileComponentSearch()})}
function openMobileComponentSearch(){componentSearchQuery='';openSheet('搜索选择构件','<div class="component-search-box"><span>⌕</span><input id="mobileComponentSearch" placeholder="输入构件名称或编号"><button id="clearMobileComponentSearch">×</button></div><div class="component-search-tools"><span>搜索结果</span><label><input id="mobileSelectAllComponents" type="checkbox"> 全选当前结果</label></div><div class="component-search-results" id="componentSearchResults"></div>','<button data-close>返回模型</button><button class="primary" id="finishComponentSearch"><span id="mobileComponentSearchCount">已选 '+selectedBimComponents.size+' 个</span> · 完成选择</button>');renderMobileComponentSearch();$('#mobileComponentSearch').oninput=e=>{componentSearchQuery=e.target.value;renderMobileComponentSearch()};$('#clearMobileComponentSearch').onclick=()=>{componentSearchQuery='';$('#mobileComponentSearch').value='';renderMobileComponentSearch();$('#mobileComponentSearch').focus()};$('#mobileSelectAllComponents').onchange=e=>{mobileComponentSearchRows().forEach(c=>e.target.checked?selectedBimComponents.add(c.name):selectedBimComponents.delete(c.name));renderComponentHotspots();renderBimBindPanel();renderMobileComponentSearch()};$('#finishComponentSearch').onclick=()=>$('#overlay').innerHTML=''}
function renderBimBindPanel(){const c=bimBindingContext;$('#bimBindPanel').innerHTML='<div class="bind-context"><b>'+escapeHtml(c.position)+'</b><span>'+escapeHtml(c.model)+'</span></div><button class="bind-search-open" id="openComponentSearch">⌕ 搜索选择构件</button><div class="bind-selection">'+(selectedBimComponents.size?'已选择 '+selectedBimComponents.size+' 个：'+[...selectedBimComponents].map(escapeHtml).join('、'):'可搜索多选，也可直接点选模型构件')+'</div><div class="bind-actions"><button id="cancelBimBind">取消</button><button class="primary" id="confirmBimBind">确定挂接（'+selectedBimComponents.size+'）</button></div>';$('#openComponentSearch').onclick=openMobileComponentSearch;$('#cancelBimBind').onclick=exitBimBinding;$('#confirmBimBind').onclick=confirmBimBinding}
function confirmBimBinding(){if(!selectedBimComponents.size){toast('请至少选择一个构件');return}const c=bimBindingContext;measureBimBindings[bindingKey(c.record,c.position)]=[...selectedBimComponents];localStorage.setItem('xa_measure_bim_bindings_v1',JSON.stringify(measureBimBindings));toast('测量部位已挂接 '+selectedBimComponents.size+' 个构件');const back={...c};resetBimBindingMode();renderLedgerDetail(back.record,back.index)}
function exitBimBinding(){const back=bimBindingContext;resetBimBindingMode();if(back)renderLedgerDetail(back.record,back.index)}
function resetBimBindingMode(){$('#modelPage').classList.remove('binding-mode');$('#modelPageTitle').textContent='BIM模型';$('#componentLayer').innerHTML='';$('#bimBindPanel').hidden=true;$('#bimBindPanel').innerHTML='';bimBindingContext=null;selectedBimComponents=new Set();componentSearchQuery=''}
function openMeasureHistoryDetail(r){$('#overlay').innerHTML='<section class="detail-page"><div class="detail-bar"><button id="detailBack">‹</button><b>测量记录详情</b></div><div class="detail-section"><h3>'+escapeHtml(r.name)+'</h3><div class="detail-row"><label>测量区域</label><span>'+escapeHtml(r.area)+'</span></div><div class="detail-row"><label>测量时间</label><span>'+escapeHtml(r.time)+'</span></div><div class="detail-row"><label>测量人</label><span>'+escapeHtml(r.person)+'</span></div><div class="detail-row"><label>合格率</label><span>'+escapeHtml(r.rate)+'</span></div></div><div class="detail-section"><h3>测点数据</h3><table class="measure-detail-table"><thead><tr><th>测量项</th><th>测量部位</th><th>测点值</th></tr></thead><tbody>'+r.items.map(x=>'<tr><td>'+escapeHtml(x[0])+'</td><td>'+escapeHtml(x[1])+'</td><td>'+escapeHtml(x[2])+'</td></tr>').join('')+'</tbody></table></div></section>';$('#detailBack').onclick=()=>$('#overlay').innerHTML=''}
$('#measureBack').onclick=()=>{if(measureScreen==='home'||measureScreen==='ledger')showPage('businessPage');else if(measureScreen==='ledgerDetail')renderMeasureLedger();else if(measureScreen==='forms')renderMeasureHome();else renderMeasureFormList()};
function updateTime(){const d=new Date();$$('.clock').forEach(x=>x.textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}))}updateTime();setInterval(updateTime,30000);renderModel();
})();
</script>
</body></html>
