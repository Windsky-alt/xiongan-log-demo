ize:13px;white-space:nowrap}#bim-brief th{background:#eff0f3;font-weight:600;text-align:left;padding:15px 12px}#bim-brief td{padding:17px 12px;border-bottom:1px solid #e9edf4}#bim-brief tr:hover td{background:#fafcff}#bim-brief .tag{background:#eef5ff;color:#377fff;padding:3px 7px;font-size:12px}#bim-brief .foot{text-align:right;padding:22px 0;color:#7b8595;font-size:12px}#bim-brief .overlay{position:absolute;inset:0;background:#17263f55;z-index:10;padding:60px 18px;display:flex;align-items:flex-start;justify-content:center}#bim-brief .dialog{width:580px;max-width:100%;background:white;border-radius:6px;box-shadow:0 10px 45px #18335c33;overflow:hidden}#bim-brief .dialog.wide{width:760px}#bim-brief .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid #e7eaf1;font-size:17px}#bim-brief .db{padding:24px;max-height:510px;overflow:auto}#bim-brief .df{padding:14px 22px;border-top:1px solid #e7eaf1;display:flex;justify-content:flex-end;gap:10px}#bim-brief .field{display:block;margin-bottom:20px}#bim-brief .field>span{display:block;margin-bottom:10px}#bim-brief .field input:not([type=radio]),#bim-brief .field select{width:100%}#bim-brief .radios{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}#bim-brief .info{background:#f5f8fc;padding:14px;line-height:1.9;margin-bottom:20px}#bim-brief .menu{display:flex;flex-direction:column;gap:4px}#bim-brief .menu button{text-align:left;border:0;padding:12px}#bim-brief .toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#fff;border:1px solid #b6d9c9;box-shadow:0 4px 18px #29416622;padding:12px 24px;z-index:20;max-width:90%}#bim-brief .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}#bim-brief .modelcard{border:1px solid #e5eaf2;border-radius:4px;padding:16px}#bim-brief .thumb{height:110px;background:#f5f8fc;display:grid;place-items:center;margin-bottom:12px}#bim-brief .cube{width:65px;height:65px;border:2px solid #90b2df;background:#dbeaff;transform:rotate(-30deg) skew(15deg);box-shadow:12px 12px 0 #bfd1e9}#bim-brief .empty{text-align:center;padding:60px;color:#929aab}#bim-brief .qr{text-align:center;padding:10px 0 20px}#bim-brief .qr canvas{max-width:180px}#bim-brief .error{color:#e45b5b;margin-top:12px}#bim-brief .viewer{background:#eff4f9;height:230px;display:grid;place-items:center;margin-bottom:14px}
#bim-brief .dialog.qr-dialog{width:430px}#bim-brief .qr-dialog .db{padding:0;background:#f7f9fc}#bim-brief .qr-poster{position:relative;width:360px;max-width:100%;min-height:515px;margin:0 auto;padding:30px 24px 24px;text-align:center;color:#123b75;background:linear-gradient(160deg,#fff 0 58%,#f4f8fd 100%);overflow:hidden}#bim-brief .qr-brand-mark{position:absolute;right:20px;top:18px;color:#2071bb;font-weight:800;font-size:19px;line-height:1}#bim-brief .qr-brand-mark small{display:block;margin-top:3px;font-size:7px;letter-spacing:1px}#bim-brief .qr-title{font-size:30px;font-weight:800;letter-spacing:2px;color:#1670bd}#bim-brief .qr-project{margin-top:4px;font-size:19px;color:#1773c7}#bim-brief .qr-skyline{height:83px;margin:4px -8px -7px;color:#78a4d4}#bim-brief .qr-skyline svg{width:100%;height:100%}#bim-brief .qr-scan{position:relative;z-index:1;font-size:12px;color:#1d2f44}#bim-brief .qr-code-shell{position:relative;width:198px;height:198px;margin:4px auto 13px;padding:9px;background:#fff;border:1px solid #dde4ec;border-radius:4px;box-shadow:0 2px 7px #273a5518}#bim-brief .qr-code-shell .qr{padding:0;margin:0}#bim-brief .qr-code-shell .qr svg{width:178px!important;height:178px!important}#bim-brief .qr-center-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:35px;height:35px;display:grid;place-items:center;border:4px solid #fff;border-radius:50%;background:#2177be;color:#fff;font-weight:800;font-size:12px;pointer-events:none}#bim-brief .qr-separator{display:flex;align-items:center;gap:9px;color:#27384e;font-size:11px}#bim-brief .qr-separator:before,#bim-brief .qr-separator:after{content:'';height:1px;flex:1;background:#9faebb}#bim-brief .qr-resource{margin:10px auto 0;min-height:62px;padding:14px 18px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#e8f3ff;box-shadow:0 3px 9px #33557a24;color:#172c44;font-size:16px;font-weight:700;line-height:1.45}#bim-brief .qr-footnote{margin-top:10px;color:#6c7d90;font-size:10px}

<header><div class="brand">雄安科创园智慧工地</div><div class="topnav"><span>首页</span><span>个人中心</span><span>人员管理</span><span style="color:#377fff">更多⌄</span></div><div class="user">雄安科创园项目部　│　系统管理员</div></header>
<div class="shell"><aside><div class="nav" style="color:#377fff">BIM应用　⌄</div><div class="nav active">三维交底</div></aside><main><div class="tabs">个人中心　×　　<span style="border-bottom:2px solid #377fff;padding-bottom:18px">三维交底　×</span></div><div class="content"><div class="briefing-layout"><section class="group-pane" aria-label="模型分组"><div class="group-head"><span>分组名称</span><button type="button" class="primary" id="b-add-group" aria-label="新建分组">＋</button></div><div id="b-tree" class="group-tree" role="tree"></div></section><div class="briefing-workspace"><div class="filters"><label>模型名称　<input id="b-name" placeholder="请输入模型名称" style="width:190px"></label><button class="primary" id="b-search">搜索</button><button id="b-reset">重置</button></div><div class="bar"><span id="b-count"></span><div><span class="muted" id="b-upload-tip">请选择左侧分组　</span><button id="b-view">▦ 卡片</button> <button class="primary" id="b-upload" disabled>＋ 上传模型</button></div></div><div id="b-list"></div><div class="foot" id="b-foot"></div></div></div></div></main></div><div id="b-modal"></div><div id="b-op-menu"></div><div id="b-toast" aria-live="polite"></div>

<script>
(()=>{const root=document.getElementById('bim-brief'),$=s=>root.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let card=false,filter='',selectedGroup='全部',seq=7,active=null,timer;const groups=[{name:'主体结构',parent:'全部'},{name:'脚手架工程',parent:'全部'},{name:'机电安装',parent:'全部'}],collapsed=new Set();
const names=['梁柱核心区节点三维交底','脚手架搭设节点','泵管支设','墙钢筋定位','板钢筋定位','柱筋定位卡具'];let rows=names.map((name,i)=>({id:i+1,name,group:i===1?'脚手架工程':i===2?'机电安装':'主体结构',type:i===1?'rvt':'rfa',size:[8.43,17.4,1.27,3.66,9.61,2.4][i],versions:[{v:1,date:'2026-09-22 09:30',by:'系统管理员',note:'首次上传',file:null}],logs:[],bim:[]}));
rows[0].logs=[
  {person:'刘耀宇',phone:'17731085339',channel:'appweb',date:'2026-09-21 10:25:18'},
  {person:'系统管理员',phone:'',channel:'appweb',date:'2026-09-21 12:11:04'},
  {person:'系统管理员',phone:'',channel:'appweb',date:'2026-09-21 15:32:09'},
  {person:'系统管理员',phone:'',channel:'appweb',date:'2026-09-22 08:46:31'},
  {person:'路阳',phone:'17334397700',channel:'appweb',date:'2026-09-22 09:06:23'}
];
function toast(t){clearTimeout(timer);$('#b-toast').innerHTML='<div class="toast">'+esc(t)+'</div>';timer=setTimeout(()=>$('#b-toast').innerHTML='',3000)}
function close(){$('#b-modal').innerHTML=''}
function closeMenu(){const menu=$('#b-op-menu');menu.innerHTML='';delete menu.dataset.modelId}
function modal(title,body,footer='',wide=false,kind=''){closeMenu();$('#b-modal').innerHTML='<div class="overlay"><section role="dialog" aria-modal="true" aria-label="'+esc(title)+'" class="dialog '+(wide?'wide':'')+' '+kind+'"><div class="dh">'+esc(title)+'<button class="link" id="b-close" aria-label="关闭">×</button></div><div class="db">'+body+'</div>'+(footer?'<div class="df">'+footer+'</div>':'')+'</section></div>';$('#b-close').onclick=close;const cancel=$('#b-cancel');if(cancel)cancel.onclick=close;$('#b-close').focus()}
const cancel='<button id="b-cancel">取消</button>', save='<button class="primary" id="b-save">确定</button>';
function descendants(name){const result=[name];for(let i=0;i<result.length;i++)groups.filter(g=>g.parent===result[i]).forEach(g=>result.push(g.name));return result}
function renderTree(){
  const branch=(name,depth)=>{
    const children=groups.filter(g=>g.parent===name);
    const count=name==='全部'?rows.length:rows.filter(r=>descendants(name).includes(r.group)).length;
    const node='<button type="button" role="treeitem" aria-selected="'+(selectedGroup===name)+'" '+(children.length?'aria-expanded="'+(!collapsed.has(name))+'"':'')+' class="group-node '+(selectedGroup===name?'selected':'')+'" style="padding-left:'+(7+depth*17)+'px!important" data-group="'+esc(name)+'"><span class="caret">'+(children.length?(collapsed.has(name)?'›':'⌄'):'·')+'</span><span class="group-name">'+esc(name)+'</span><span class="group-count">'+count+'</span></button>';
    return node+(collapsed.has(name)?'':children.map(g=>branch(g.name,depth+1)).join(''));
  };
  $('#b-tree').innerHTML=branch('全部',0);
}
function render(){
  renderTree();
  const list=rows.filter(r=>r.name.includes(filter)&&(selectedGroup==='全部'||descendants(selectedGroup).includes(r.group)));
  $('#b-count').innerHTML='共 <span style="color:#377fff">'+list.length+'</span> 条';
  $('#b-foot').textContent='共 '+list.length+' 条　　10条/页　　 ‹　 1　 ›';
  $('#b-view').textContent=card?'☷ 列表':'▦ 卡片';
  $('#b-upload').disabled=selectedGroup==='全部';
  $('#b-upload-tip').hidden=selectedGroup!=='全部';
  $('#b-list').innerHTML=!list.length?'<div class="empty">暂无模型，请上传模型或调整搜索条件</div>':card?'<div class="cards">'+list.map(r=>'<div class="modelcard"><button class="thumb" style="width:100%" data-action="preview" data-id="'+r.id+'" aria-label="查看'+esc(r.name)+'"><span class="cube"></span></button><button class="link" data-action="preview" data-id="'+r.id+'">'+esc(r.name)+'</button><p class="muted">'+esc(r.group)+'　V'+r.versions.length+'　'+r.size+' MB</p><p class="muted">上传人：系统管理员</p>'+(r.bim.length?'<span class="tag">已挂接'+r.bim.length+'处</span>':'')+actions(r)+'</div>').join('')+'</div>':'<div class="scroll"><table><thead><tr><th>模型名称</th><th>所属分组</th><th>版本</th><th>上传人</th><th>大小 / 类型</th><th>更新时间</th><th>操作</th></tr></thead><tbody>'+list.map(r=>'<tr><td><button class="link" data-action="preview" data-id="'+r.id+'">'+esc(r.name)+'</button>'+(r.bim.length?'<span class="tag">已挂接'+r.bim.length+'处</span>':'')+'</td><td>'+esc(r.group)+'</td><td><span class="tag">V'+r.versions.length+'</span></td><td>系统管理员</td><td>'+r.size+' MB / '+r.type.toUpperCase()+'</td><td>'+r.versions.at(-1).date+'</td><td>'+actions(r)+'</td></tr>').join('')+'</tbody></table></div>'
}
function actions(r){return ['二维码','分享','更多'].map((x,i)=>'<button class="link" data-action="'+['qr','share','menu'][i]+'" data-id="'+r.id+'">'+x+(i===2?'⌄':'')+'</button>').join(' ')}
function download(file,name){if(!file){toast('示例记录未附原始模型，请上传文件后体验下载');return}const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function upload(r){
  if(!r&&selectedGroup==='全部'){toast('请先在左侧选择具体分组');return}
  const fields=(r?'<div class="info">'+esc(r.name)+'<br>当前版本 V'+r.versions.length+' → 新版本 V'+(r.versions.length+1)+'</div>':'<label class="field"><span>模型名称</span><input id="b-newname" maxlength="80" placeholder="未填写时使用文件名称"></label><div class="info">上传到：'+esc(selectedGroup)+'</div>')+'<label class="field"><span>选择模型文件 *</span><input type="file" id="b-file" accept=".rvt,.rfa,.ifc,.glb,.gltf"></label><div class="muted">支持格式以正式接入的模型转换服务为准。本原型保存文件和版本信息，不进行BIM转换。</div><div id="b-error" class="error" role="alert"></div>';
  modal(r?'更新模型':'上传模型',fields,cancel+save);
  $('#b-save').onclick=()=>{
    const f=$('#b-file').files[0];
    if(!f){$('#b-error').textContent='请选择模型文件';return}
    if(!/\.(rvt|rfa|ifc|glb|gltf)$/i.test(f.name)){$('#b-error').textContent='请选择支持的模型格式';return}
    let row=r;
    if(!row){row={id:seq++,name:$('#b-newname').value.trim()||f.name.replace(/\.[^.]+$/,''),group:selectedGroup,versions:[],logs:[],bim:[]};rows.unshift(row)}
    row.type=f.name.split('.').at(-1).toLowerCase();row.size=(f.size/1048576).toFixed(2);
    row.versions.push({v:row.versions.length+1,date:new Date().toLocaleString('sv-SE').slice(0,16),by:'系统管理员',note:r?'更新模型':'首次上传',file:f});
    close();render();toast(r?'新版本已保存（原型）':'模型文件已添加（原型）')
  }
}
function sharing(r,isQr){modal(isQr?'模型二维码':'分享模型','<div class="info">'+esc(r.name)+'　<span class="tag">V'+r.versions.length+'</span><br><span class="muted">分享固定指向当前版本，更新模型后原分享版本保持不变。</span></div>'+(isQr?'<div class="qr" id="b-qr"></div>':'')+'<label class="field"><span>分享链接</span><input readonly id="b-url" value="https://example.com/bim/share/'+r.id+'/v'+r.versions.length+'"></label><span>有效期</span><div class="radios">'+['永久','7天','30天','半年','自定义'].map((x,i)=>'<label><input type="radio" name="b-exp" value="'+x+'" '+(!i?'checked':'')+'> '+x+'</label>').join('')+'</div><input aria-label="到期日期" id="b-date" type="date" hidden><div class="muted" style="margin-top:18px">原型示例链接，正式部署后用于扫码和外部访问。</div>',cancel+'<button class="primary" id="b-save">'+(isQr?'下载二维码':'复制链接')+'</button>');root.querySelectorAll('[name=b-exp]').forEach(x=>x.onchange=()=>$('#b-date').hidden=x.value!=='自定义');if(isQr){if(typeof qrcode==='function'){const q=qrcode(0,'M');q.addData($('#b-url').value);q.make();$('#b-qr').innerHTML=q.createSvgTag(4,16);$('#b-qr').querySelector('svg').style.width='180px';$('#b-qr').querySelector('svg').style.height='180px'}else{$('#b-qr').textContent='二维码组件未加载，请稍后重试'}}$('#b-save').onclick=async()=>{if(!$('#b-date').hidden&&(!$('#b-date').value||$('#b-date').value<=new Date().toISOString().slice(0,10))){toast('请选择未来的到期日期');return}if(isQr){const svg=$('#b-qr svg');if(!svg){toast('二维码组件未加载');return}download(new Blob([svg.outerHTML],{type:'image/svg+xml'}),r.name+'-二维码.svg');toast('已下载示例链接二维码');return}try{await navigator.clipboard.writeText($('#b-url').value);toast('已复制示例链接')}catch{$('#b-url').select();toast('请复制已选中的示例链接')}}}
function toggleMenu(r,trigger){
  const target=$('#b-op-menu');
  if(target.dataset.modelId===String(r.id)){closeMenu();target.dataset.modelId='';return}
  const options=[['download','下载'],['rename','重命名'],['update','更新模型'],['versions','版本管理'],['bim','BIM模型挂接'],['logs','查看记录'],['delete','删除']];
  target.innerHTML='<div class="op-menu" role="menu" aria-label="'+esc(r.name)+'操作">'+options.map(([action,label])=>'<button type="button" role="menuitem" '+(action==='delete'?'class="danger"':'')+' data-action="'+action+'" data-id="'+r.id+'">'+label+'</button>').join('')+'</div>';
  target.dataset.modelId=String(r.id);
  const menu=target.firstElementChild,rect=trigger.getBoundingClientRect();
  const left=Math.max(8,Math.min(rect.left,window.innerWidth-menu.offsetWidth-8));
  const top=rect.bottom+menu.offsetHeight+8<=window.innerHeight?rect.bottom+4:Math.max(8,rect.top-menu.offsetHeight-4);
  menu.style.left=left+'px';menu.style.top=top+'px';
}
function openRecords(r,tab='mini'){
  const body='<div class="record-tabs"><button type="button" data-record-tab="mini" class="'+(tab==='mini'?'selected':'')+'">小程序查看记录</button><button type="button" data-record-tab="appweb" class="'+(tab==='appweb'?'selected':'')+'">APP & WEB 查看记录</button></div><div class="record-tools"><label id="b-team-wrap" '+(tab==='mini'?'':'hidden')+'>班组： <select id="b-team"><option value="">请选择</option></select></label><input id="b-record-search" aria-label="搜索查看人" placeholder="搜索"></div><div class="record-grid" id="b-record-grid"></div>';
  modal('查看记录',body,'',true,'records');
  root.querySelectorAll('[data-record-tab]').forEach(b=>b.onclick=()=>openRecords(r,b.dataset.recordTab));
  $('#b-record-search').oninput=()=>renderRecordTable(r,tab);
  $('#b-team').onchange=()=>renderRecordTable(r,tab);
  renderRecordTable(r,tab);
}
function renderRecordTable(r,tab){
  const query=$('#b-record-search').value.trim().toLowerCase();
  const team=$('#b-team').value;
  const found=r.logs.filter(l=>(l.channel||'appweb')===tab&&(!team||l.team===team)&&(!query||(l.person||'系统管理员').toLowerCase().includes(query)||(l.phone||'').includes(query)));
  const people=[];
  found.forEach(l=>{const name=l.person||'系统管理员',phone=l.phone||'';let item=people.find(x=>x.name===name&&x.phone===phone);if(!item){item={name,phone,team:l.team||'',trade:l.trade||'',wechat:l.wechat||'',avatar:l.avatar||'',events:[]};people.push(item)}item.events.push(l)});
  const mini=tab==='mini';
  const head=mini?'<tr><th>序号</th><th>姓名</th><th>手机</th><th>班组</th><th>工种</th><th>微信名</th><th>微信头像</th><th>查看次数</th></tr>':'<tr><th>序号</th><th>姓名</th><th>手机</th><th>查看次数</th></tr>';
  const body=people.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.phone)+'</td>'+(mini?'<td>'+esc(p.team)+'</td><td>'+esc(p.trade)+'</td><td>'+esc(p.wechat)+'</td><td>'+esc(p.avatar)+'</td>':'')+'<td><button class="count-link" data-count-index="'+i+'">'+p.events.length+'</button></td></tr>').join('');
  $('#b-record-grid').innerHTML='<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>'+(people.length?'':'<div class="record-empty"><span>▤</span>暂无数据</div>');
  root.querySelectorAll('[data-count-index]').forEach(b=>b.onclick=()=>openRecordTimes(r,people[+b.dataset.countIndex],tab));
}
function openRecordTimes(r,person,tab){
  const body='<div class="record-grid"><table><thead><tr><th>序号</th><th>查看时间</th></tr></thead><tbody>'+person.events.map((event,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(event.date)+'</td></tr>').join('')+'</tbody></table></div>';
  modal('查看次数统计',body,'',false,'times');
  $('#b-close').onclick=()=>openRecords(r,tab);
}
function attachBim(r){
  window.parent.postMessage({
    channel:'xa-bim-briefing',action:'bind',briefingType:'三维交底',
    resourceName:r.name,fileName:r.name+'.'+r.type,sourceId:String(r.id)
  },'*');
}
function act(action,r,trigger){
  active=r;
  if(action==='menu'){toggleMenu(r,trigger);return}
  closeMenu();
  if(action==='qr'||action==='share'){sharing(r,action==='qr');return}
  if(action==='download'){download(r.versions.at(-1).file,r.name+'.'+r.type);return}
  if(action==='update'){upload(r);return}
  if(action==='bim'){attachBim(r);return}
  if(action==='rename'){modal('重命名','<label class="field"><span>模型名称 *</span><input id="b-rename" maxlength="80" value="'+esc(r.name)+'"></label><div class="muted">修改显示名称，保留历史版本与分享关系。</div>',cancel+save);$('#b-save').onclick=()=>{const n=$('#b-rename').value.trim();if(!n){toast('请输入模型名称');return}r.name=n;close();render();toast('名称已更新')};return}
  if(action==='delete'){modal('删除模型','<div class="info">确认删除“'+esc(r.name)+'”？</div><p>删除后，全部版本将不可访问，相关二维码与分享链接失效。</p>',cancel+'<button class="primary" id="b-save" style="background:#ed6060;border-color:#ed6060">确认删除</button>');$('#b-save').onclick=()=>{rows=rows.filter(x=>x.id!==r.id);close();render();toast('模型已删除')};return}
  if(action==='versions'){modal('版本管理 · '+r.name,'<div class="scroll"><table><thead><tr><th>版本</th><th>上传时间</th><th>上传人</th><th>更新说明</th><th>操作</th></tr></thead><tbody>'+[...r.versions].reverse().map(v=>'<tr><td>V'+v.v+(v.v===r.versions.length?' <span class="tag">当前</span>':'')+'</td><td>'+v.date+'</td><td>'+v.by+'</td><td>'+esc(v.note)+'</td><td><button class="link" data-version="'+v.v+'">查看</button><button class="link" data-dl="'+v.v+'">下载</button></td></tr>').join('')+'</tbody></table></div>','',true);root.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>preview(r,+b.dataset.version));root.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const v=r.versions[+b.dataset.dl-1];download(v.file,v.file?.name||r.name)});return}
  if(action==='logs'){openRecords(r);return}
  if(action==='preview')preview(r,r.versions.length)
}
function preview(r,v){r.logs.unshift({v,date:new Date().toLocaleString('sv-SE'),person:'系统管理员',phone:'',channel:'appweb'});modal(r.name+' · V'+v,'<div class="viewer"><div class="cube"></div></div><div class="muted">模型预览占位。正式模型旋转、缩放与构件显示需接入BIM引擎；本次原型预览已记入查看记录。</div>','<button id="b-cancel">关闭</button>',true)}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){const r=rows.find(x=>x.id===+b.dataset.id);if(r)act(b.dataset.action,r,b);return}if(!e.target.closest('#b-op-menu'))closeMenu()});
window.addEventListener('scroll',closeMenu,true);
$('#b-tree').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(!b)return;const name=b.dataset.group;if(e.target.closest('.caret')&&groups.some(g=>g.parent===name)){collapsed.has(name)?collapsed.delete(name):collapsed.add(name)}else{selectedGroup=name}render()});
$('#b-add-group').onclick=()=>{
  modal('新建分组','<label class="field"><span>上级分组</span><select id="b-parent"><option value="全部">全部</option>'+groups.map(g=>'<option value="'+esc(g.name)+'" '+(selectedGroup===g.name?'selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select></label><label class="field"><span>分组名称 *</span><input id="b-group-name" maxlength="40" placeholder="请输入分组名称"></label><div id="b-error" class="error" role="alert"></div>',cancel+save);
  $('#b-save').onclick=()=>{const name=$('#b-group-name').value.trim();if(!name){$('#b-error').textContent='请输入分组名称';return}if(name==='全部'||groups.some(g=>g.name===name)){$('#b-error').textContent='分组名称已存在';return}groups.push({name,parent:$('#b-parent').value});selectedGroup=name;close();render();toast('分组已创建')}
};
$('#b-search').onclick=()=>{filter=$('#b-name').value.trim();render()};
$('#b-name').onkeydown=e=>{if(e.key==='Enter')$('#b-search').click()};
$('#b-reset').onclick=()=>{$('#b-name').value='';filter='';render()};
$('#b-view').onclick=()=>{card=!card;render()};
$('#b-upload').onclick=()=>upload(null);
root.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
})();
</script>
</div>

</body>
</html>
